<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner FGH</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fa; color: #333; min-height: 100vh; }
    .container { margin: 0 auto; background: #fff; box-shadow: 0 4px 16px rgba(22,60,109,.08); border: 1px solid #e6edf5; }

    /* ================= Cabeçalho ================= */
    .header-wrapper { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
    .title-block h1 { margin:0; font-weight:900; color:#163c6d; letter-spacing:1px; line-height:1; text-transform:uppercase; }
    .title-block .year-row { display:flex; align-items:center; gap:12px; color:#163c6d; font-weight:500; }
    .title-block .year-row .line { flex:1; height:2px; background:#163c6d; }
    .logo-block { text-align:right; flex-shrink:0; }
    .logo-block img { max-width:100%; object-fit:contain; }
    .logo-fallback { font-weight:900; color:#163c6d; line-height:1; }
    .logo-fallback small { display:block; letter-spacing:2px; margin-top:-4px; }

    /* ================= Toolbar ================= */
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#f8fafc; border:1px solid #e6edf5; border-radius:8px; }
    .toolbar select { border:1px solid #d1d8e2; border-radius:6px; color:#163c6d; background:#fff; font-weight:600; cursor:pointer; }
    .toolbar .spacer { flex:1; }

    /* ================= Filtros ================= */
    .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#fff7e6; border:1px solid #f5d99b; border-radius:8px; }
    .filters select { border:1px solid #e8c98c; border-radius:6px; background:#fff; font-weight:600; color:#7a4b00; cursor:pointer; }
    .filters .lbl { font-weight:700; color:#7a4b00; text-transform:uppercase; letter-spacing:.5px; }
    .filters .count { color:#7a4b00; font-weight:600; margin-left:auto; }

    /* ================= Botões ================= */
    .btn { border:none; border-radius:6px; cursor:pointer; font-weight:600; transition:.15s; white-space:nowrap; }
    .btn-primary { background:#163c6d; color:#fff; } .btn-primary:hover { background:#0e2b4f; }
    .btn-secondary { background:#2b6ca3; color:#fff; } .btn-secondary:hover { background:#1f5280; }
    .btn-success { background:#1a9c4a; color:#fff; } .btn-success:hover { background:#13803b; }
    .btn-nav { background:#e9edf2; color:#163c6d; }
    .btn-nav:hover { background:#d3dde8; }
    .btn-toggle { background:#eef3f9; color:#163c6d; border:1px solid #d1d8e2; }
    .btn-toggle.active { background:#163c6d; color:#fff; border-color:#163c6d; }
    .btn-admin { background:#7a4b00; color:#fff; } .btn-admin:hover { background:#5d3900; }
    .btn-mini { border-radius:4px; border:none; cursor:pointer; font-weight:600; }
    .btn-mini.edit { background:#2b6ca3; color:#fff; } .btn-mini.del { background:#dc3545; color:#fff; }
    .btn-mini.dup { background:#1a9c4a; color:#fff; }

    /* ================= Calendário (Mês) ================= */
    .calendar { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; border:1px solid #dbe0e5; border-radius:8px; overflow:hidden; }
    .calendar thead th { background:#163c6d; color:#fff; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .calendar thead th.weekend { background:#1f4d85; }
    .calendar td { border:1px solid #e6edf5; vertical-align:top; background:#fff; position:relative; cursor:pointer; transition:background .15s; overflow:hidden; }
    .calendar td:hover { background:#f8fbff; }
    .calendar td.other-month { background:#f8fafc; cursor:default; }
    .calendar td.other-month .day-number { color:#c5cdd6; }
    .calendar td.weekend .day-number { color:#2b6ca3; }
    .day-number { font-weight:600; color:#163c6d; display:inline-block; text-align:center; }
    .day-number.hoje { background:#163c6d; color:#fff !important; border-radius:50%; }
    .day-badge { position:absolute; top:6px; right:6px; background:#163c6d; color:#fff; font-weight:700; border-radius:10px; line-height:1.4; }

    /* ================= Semana ================= */
    .week-grid { display:grid; grid-template-columns:repeat(7,1fr); }
    .week-col { border:1px solid #e6edf5; border-radius:8px; background:#fff; display:flex; flex-direction:column; }
    .week-col-header { background:#163c6d; color:#fff; border-radius:6px; text-align:center; font-weight:700; }
    .week-col-header .wk-day { display:block; line-height:1.1; }
    .week-col-header.hoje { background:#0e2b4f; box-shadow:inset 0 0 0 2px #f5a623; }
    .week-col.weekend { background:#f8fafc; }

    /* ================= Dia ================= */
    .day-view { margin:0 auto; }
    .day-view-header { background:#163c6d; color:#fff; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .day-view-header h2 { margin:0; }
    .day-view-header .sub { opacity:.85; }

    /* Barra de navegação do dia */
    .day-view-header .day-nav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .day-view-header .day-nav .btn { font-size: clamp(11px, .95vw, 14px); padding: clamp(6px, .8vw, 10px) clamp(10px, 1.2vw, 16px); }
    .day-nav .btn-nav { min-width: clamp(34px, 3.2vw, 46px); font-size: clamp(18px, 1.8vw, 24px); line-height:1; font-weight:900; }
    .day-nav .btn-today { background:#2b6ca3; color:#fff; }
    .day-nav .btn-today:hover { background:#1f5280; }

    /* Faixa da semana clicável */
    .day-strip { display:grid; grid-template-columns:repeat(7,1fr); gap: clamp(4px, .6vw, 8px); margin-bottom: clamp(8px, 1.2vw, 14px); }
    .day-strip-item {
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        border:1px solid #e6edf5; background:#fff; border-radius:8px;
        padding: clamp(5px, .8vw, 9px) 2px; cursor:pointer;
        font-family:inherit; color:#163c6d; transition:.15s;
    }
    .day-strip-item:hover { background:#f0f6ff; border-color:#c8d6e8; }
    .day-strip-item .ds-wd { font-size: clamp(9px, .8vw, 11px); font-weight:700; text-transform:uppercase; letter-spacing:.5px; opacity:.7; }
    .day-strip-item .ds-num { font-size: clamp(13px, 1.3vw, 18px); font-weight:700; }
    .day-strip-item.hoje .ds-num { background:#f5a623; color:#fff; border-radius:50%; width:1.75em; height:1.75em; display:flex; align-items:center; justify-content:center; }
    .day-strip-item.active { background:#163c6d; border-color:#163c6d; }
    .day-strip-item.active .ds-wd, .day-strip-item.active .ds-num { color:#fff; }
    .day-strip-item.active.hoje .ds-num { background:#f5a623; }
    .day-strip-item.weekend:not(.active) { background:#f8fafc; }

    .day-view-list { display:flex; flex-direction:column; min-height:150px; }
    .day-view-list:empty::after { content:'Nenhum evento neste dia. Arraste para cá ou clique em "Novo evento".'; display:block; text-align:center; color:#888; border:2px dashed #dbe0e5; border-radius:10px; }
    .day-card { border-left:5px solid; cursor:grab; transition:.15s; display:flex; flex-direction:column; min-width:0; }
    .day-card:hover { filter:brightness(.97); }
    .day-card.dragging { opacity:.4; }
    .day-card .dc-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; min-width:0; }
    .day-card .dc-title { font-weight:700; flex:1; min-width:0; word-break:break-word; overflow-wrap:anywhere; line-height:1.3; }
    .day-card .dc-actions { display:flex; gap:4px; flex-shrink:0; align-self:flex-start; }
    .day-card .dc-meta { opacity:.85; display:flex; gap:8px; flex-wrap:wrap; word-break:break-word; }
    .day-card .dc-desc { opacity:.9; word-break:break-word; overflow-wrap:anywhere; line-height:1.4; }

    /* ================= Lista ================= */
    .list-day { border:1px solid #e6edf5; border-radius:8px; margin-bottom:10px; background:#fff; overflow:hidden; }
    .list-day-header { background:#f0f4f8; font-weight:700; color:#163c6d; display:flex; justify-content:space-between; align-items:center; }
    .list-day-header.hoje { background:#163c6d; color:#fff; }
    .list-day-header .weekday { font-weight:600; color:#5a7ba3; text-transform:uppercase; letter-spacing:.5px; }
    .list-day-header.hoje .weekday { color:#c8d6e8; }
    .list-day-body { display:flex; flex-direction:column; }

    /* ================= Chips de evento ================= */
    .event-chip { border-left:3px solid; cursor:grab; transition:filter .15s; display:block; word-break:break-word; white-space:normal; flex-shrink:0; }
    .event-chip:hover { filter:brightness(.95); }
    .event-chip.dragging { opacity:.4; }
    .chip-title { font-weight:700; display:block; }
    .continuation-mark { display:inline-block; opacity:.6; font-weight:700; }
    .events-list { display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
    .events-list::-webkit-scrollbar { width:5px; }
    .events-list::-webkit-scrollbar-thumb { background:#c8d6e8; border-radius:3px; }

    /* ================= Cabeçalho colorido do cartão ================= */
    .chip-header { display:flex; flex-wrap:wrap; align-items:center; }
    .chip-header .continuation-mark { margin-right:2px; }
    .badge {
        display:inline-block;
        border-radius:3px;
        font-weight:700;
        letter-spacing:.2px;
        line-height:1.5;
        white-space:nowrap;
        max-width:100%;
        overflow:hidden;
        text-overflow:ellipsis;
    }
    .badge-area { font-style:italic; font-weight:600; }

    /* ================= Drop target ================= */
    td.drop-target, .week-col.drop-target, .day-view-list.drop-target, .list-day-body.drop-target { background:#fffbe6 !important; box-shadow:inset 0 0 0 2px #f5a623; }

    /* ================= Legenda ================= */
    .legend { display:flex; flex-wrap:wrap; border-top:1px solid #e6edf5; color:#555; }
    .legend .item { display:flex; align-items:center; gap:6px; }
    .legend .dot { border-radius:3px; border-left:3px solid; }

    /* ================= Modais ================= */
    .modal-overlay { position:fixed; inset:0; background:rgba(22,60,109,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25); max-height:92vh; overflow-y:auto; }
    .modal h2 { margin:0; color:#163c6d; }
    .modal .field { margin-bottom:12px; }
    .modal label { display:block; font-weight:600; color:#163c6d; margin-bottom:4px; }
    .modal .hint { color:#7a8ba3; margin-top:3px; display:block; }
    .modal input[type=text], .modal input[type=date], .modal input[type=color], .modal textarea, .modal select { width:100%; border:1px solid #d1d8e2; border-radius:6px; font-family:inherit; color:#333; }
    .modal textarea { resize:vertical; min-height:70px; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline:none; border-color:#2b6ca3; box-shadow:0 0 0 3px rgba(43,108,163,.1); }
    .modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
    .modal .actions .left { margin-right:auto; }
    .modal .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:480px) { .modal .row2 { grid-template-columns:1fr; } }

    .events-day-list { margin:12px 0; max-height:340px; overflow-y:auto; }
    .events-day-list .event-row { border-radius:6px; border-left:4px solid; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .events-day-list .event-row .info { flex:1; min-width:0; }
    .events-day-list .event-row .info .tipo-label { display:inline-block; font-weight:700; text-transform:uppercase; opacity:.75; letter-spacing:.4px; }
    .events-day-list .event-row .info strong { display:block; word-break:break-word; }
    .events-day-list .event-row .info .periodo { opacity:.8; display:block; font-style:italic; }
    .events-day-list .event-row .info .desc { opacity:.85; display:block; word-break:break-word; }
    .events-day-list .event-row .row-actions { display:flex; gap:4px; flex-shrink:0; flex-direction:column; }

    /* ================= Admin ================= */
    .admin-tabs { display:flex; gap:4px; border-bottom:2px solid #e6edf5; }
    .admin-tab { background:none; border:none; font-weight:700; color:#5a7ba3; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
    .admin-tab.active { color:#163c6d; border-bottom-color:#163c6d; }
    .admin-pane { display:none; }
    .admin-pane.active { display:block; }
    .admin-list { list-style:none; padding:0; margin:0 0 14px; }
    .admin-list li { display:flex; align-items:center; gap:8px; border:1px solid #e6edf5; border-radius:6px; margin-bottom:6px; background:#f8fafc; }
    .admin-list li .item-color { border-radius:4px; border:1px solid #ccc; flex-shrink:0; }
    .admin-list li .item-label { flex:1; font-weight:600; color:#163c6d; }
    .admin-list li .item-actions { display:flex; gap:4px; }
    .admin-add { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:#f0f4f8; border-radius:6px; }
    .admin-add input[type=text] { flex:1; min-width:140px; border:1px solid #d1d8e2; border-radius:6px; }
    .admin-add input[type=color] { cursor:pointer; border:1px solid #d1d8e2; border-radius:6px; }
    .admin-empty { color:#888; text-align:center; border:1px dashed #dbe0e5; border-radius:6px; margin-bottom:12px; }

    /* ================= Popup Teletubies ================= */
    .teletubies-overlay { position:fixed; inset:0; background:rgba(22,60,109,.35); display:none; align-items:center; justify-content:center; z-index:2000; pointer-events:none; animation: fadeInTubies .15s ease-out; }
    .teletubies-overlay.active { display:flex; }
    .teletubies-img { filter: drop-shadow(0 10px 30px rgba(0,0,0,.4)); animation: popTubies .35s cubic-bezier(.34,1.56,.64,1); }
    @keyframes fadeInTubies { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popTubies {
        0%   { transform: scale(.5) rotate(-8deg); opacity: 0; }
        60%  { transform: scale(1.08) rotate(3deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* ============================================================
       RESPONSIVIDADE GLOBAL — ajusta o layout a qualquer resolução
    ============================================================ */
    *, *::before, *::after { min-width: 0; }
    img, table { max-width: 100%; }

    body { padding: clamp(4px, 1vw, 14px); font-size: clamp(13px, 1.05vw, 16px); }
    .container { width: 100%; max-width: min(1800px, 100%); padding: clamp(10px, 2vw, 26px); border-radius: clamp(6px, 1vw, 14px); }

    .header-wrapper { gap: clamp(8px, 1.5vw, 20px); margin-bottom: clamp(10px, 1.5vw, 20px); }
    .title-block h1 { font-size: clamp(22px, 4.5vw, 56px); }
    .title-block .year-row { font-size: clamp(12px, 1.6vw, 18px); gap: clamp(6px, 1vw, 14px); margin-top: clamp(4px, 0.8vw, 10px); }
    .title-block .year-row .line { max-width: clamp(40px, 8vw, 110px); }
    .logo-block img { height: clamp(40px, 6vw, 90px); }
    .logo-fallback { font-size: clamp(24px, 4.5vw, 44px); }
    .logo-fallback small { font-size: clamp(18px, 3.2vw, 32px); }

    .toolbar { padding: clamp(6px, 1vw, 12px) clamp(8px, 1.5vw, 16px); gap: clamp(4px, 0.6vw, 10px); margin-bottom: clamp(6px, 1vw, 14px); }
    .toolbar select, .toolbar .btn { font-size: clamp(11px, 0.95vw, 14px); padding: clamp(5px, 0.7vw, 9px) clamp(8px, 1vw, 14px); }
    .btn-nav { min-width: clamp(30px, 3vw, 42px); }

    .filters { padding: clamp(6px, 0.8vw, 10px) clamp(8px, 1.5vw, 16px); gap: clamp(4px, 0.6vw, 10px); margin-bottom: clamp(6px, 1vw, 14px); }
    .filters select { font-size: clamp(11px, 0.9vw, 13px); padding: clamp(5px, 0.7vw, 9px) clamp(8px, 1vw, 12px); }
    .filters .lbl { font-size: clamp(10px, 0.8vw, 12px); }
    .filters .count { font-size: clamp(10px, 0.8vw, 12px); }
    .filters .btn { font-size: clamp(11px, 0.9vw, 13px); padding: clamp(5px, 0.7vw, 9px) clamp(8px, 1vw, 12px); }

    .calendar td { height: clamp(85px, 12vh, 200px); padding: clamp(3px, 0.5vw, 7px); }
    .calendar thead th { font-size: clamp(9.5px, 0.9vw, 13px); padding: clamp(5px, 0.9vw, 12px) clamp(2px, 0.4vw, 6px); }
    .day-number { font-size: clamp(10.5px, 1.1vw, 16px); line-height: clamp(17px, 1.9vw, 26px); width: clamp(17px, 1.9vw, 26px); margin-bottom: clamp(2px, 0.5vw, 4px); }
    .day-badge { font-size: clamp(8px, 0.75vw, 11px); padding: 1px clamp(4px, 0.6vw, 7px); top: clamp(4px, 0.5vw, 6px); right: clamp(4px, 0.5vw, 6px); }
    .event-chip { font-size: clamp(9.5px, 0.85vw, 12.5px); padding: clamp(3px, 0.45vw, 6px) clamp(4px, 0.6vw, 9px); border-radius: clamp(3px, 0.4vw, 5px); }
    .events-list { gap: 3px; margin-top: 3px; max-height: clamp(60px, 9vh, 150px); padding-right: 2px; }
    .badge { font-size: clamp(7.5px, 0.7vw, 10px); padding: 1px clamp(3px, 0.4vw, 6px); }
    .continuation-mark { font-size: clamp(9px, 0.8vw, 11px); }

    .week-grid { gap: clamp(3px, 0.5vw, 8px); }
    .week-col { min-height: clamp(220px, 42vh, 440px); padding: clamp(4px, 0.6vw, 8px); gap: clamp(3px, 0.4vw, 6px); }
    .week-col-header { font-size: clamp(10px, 0.9vw, 13px); padding: clamp(4px, 0.6vw, 8px); margin: calc(clamp(4px, 0.6vw, 8px) * -1) calc(clamp(4px, 0.6vw, 8px) * -1) 6px; }
    .week-col-header .wk-day { font-size: clamp(14px, 1.7vw, 22px); }

    .day-view { max-width: min(900px, 100%); }
    .day-view-header { padding: clamp(10px, 1.6vw, 18px) clamp(14px, 2vw, 22px); border-radius: clamp(6px, 0.8vw, 10px); margin-bottom: clamp(8px, 1.2vw, 14px); }
    .day-view-header h2 { font-size: clamp(16px, 1.9vw, 24px); }
    .day-view-header .sub { font-size: clamp(11.5px, 1vw, 14px); }
    .day-view-list { gap: clamp(6px, 0.9vw, 10px); }
    .day-view-list:empty::after { padding: clamp(24px, 3vw, 40px) clamp(14px, 2vw, 20px); font-size: clamp(12px, 1vw, 14px); }
    .day-card { padding: clamp(8px, 1.2vw, 14px) clamp(10px, 1.4vw, 16px); border-radius: clamp(5px, 0.7vw, 8px); gap: clamp(4px, 0.6vw, 6px); }
    .day-card .dc-title { font-size: clamp(13px, 1.25vw, 17px); }
    .day-card .dc-desc { font-size: clamp(11.5px, 1vw, 13.5px); }
    .day-card .dc-meta { font-size: clamp(11px, 0.95vw, 13px); }
    .btn-mini { font-size: clamp(10px, 0.8vw, 12px); padding: clamp(3px, 0.5vw, 5px) clamp(6px, 0.8vw, 9px); }

    .list-day-header { font-size: clamp(12.5px, 1vw, 15px); padding: clamp(6px, 0.9vw, 9px) clamp(8px, 1.2vw, 12px); }
    .list-day-body { padding: clamp(5px, 0.8vw, 10px); gap: clamp(4px, 0.6vw, 6px); }

    .modal { padding: clamp(14px, 2vw, 24px); max-width: min(600px, 100% - 16px); border-radius: clamp(8px, 1vw, 12px); }
    .modal.large { max-width: min(920px, 100% - 16px); }
    .modal h2 { font-size: clamp(16px, 1.6vw, 21px); margin-bottom: clamp(10px, 1.2vw, 16px); }
    .modal label { font-size: clamp(12px, 1vw, 13.5px); }
    .modal input[type=text], .modal input[type=date], .modal input[type=color], .modal textarea, .modal select { font-size: clamp(12px, 1vw, 14px); padding: clamp(7px, 0.8vw, 9px) clamp(8px, 1vw, 10px); }
    .modal .hint { font-size: clamp(10px, 0.8vw, 11.5px); }
    .events-day-list .event-row { padding: clamp(8px, 1vw, 11px); margin-bottom: clamp(6px, 0.8vw, 8px); }
    .events-day-list .event-row .info strong { font-size: clamp(13px, 1.1vw, 15px); }
    .events-day-list .event-row .info .tipo-label { font-size: clamp(9.5px, 0.85vw, 10.5px); }
    .events-day-list .event-row .info .desc { font-size: clamp(11.5px, 1vw, 13px); }
    .events-day-list .event-row .info .periodo { font-size: clamp(11px, 0.9vw, 12px); }

    .legend { font-size: clamp(10.5px, 0.85vw, 12.5px); gap: clamp(6px, 1vw, 12px); margin-top: clamp(10px, 1.2vw, 16px); padding-top: clamp(8px, 1vw, 14px); }
    .legend .dot { width: clamp(10px, 0.9vw, 13px); height: clamp(10px, 0.9vw, 13px); }

    .admin-tabs { margin-bottom: clamp(10px, 1.2vw, 16px); }
    .admin-tab { padding: clamp(7px, 1vw, 10px) clamp(10px, 1.2vw, 16px); font-size: clamp(12px, 1vw, 14px); }
    .admin-list li { padding: clamp(6px, 0.8vw, 8px) clamp(8px, 1vw, 10px); }
    .admin-list li .item-color { width: clamp(18px, 1.6vw, 22px); height: clamp(18px, 1.6vw, 22px); }
    .admin-list li .item-label { font-size: clamp(12px, 1vw, 14px); }

<script>
/* ============================================================
   CONFIG
============================================================ */
const GITHUB_OWNER = 'caiomalbuquerque';
const GITHUB_REPO = 'programacao_de_eventos';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'calendario.json';
const CACHE_KEY = 'planner_fgh';
const CACHE_TIME_KEY = 'planner_fgh_time';
const TOKEN_KEY = 'planner_fgh_token';
const VIEW_KEY = 'planner_fgh_view';
const CACHE_DURATION = 5 * 60 * 1000;

const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MESES_CURTOS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DIAS_SEMANA_LONGO = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const DIAS_SEMANA_CURTO = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

const PALETA = ['#2196f3','#4caf50','#f5a623','#9c27b0','#e53935',
                '#00bcd4','#ff5722','#3f51b5','#009688','#795548',
                '#673ab7','#8bc34a','#ff9800','#e91e63','#607d8b'];

const DEFAULT_CONFIG = {
    tipos: [
        { id:'info',       label:'Informativo', cor:'#4caf50' },
        { id:'prazo',      label:'Prazo',       cor:'#f5a623' },
        { id:'tarefa',     label:'Tarefa',      cor:'#2196f3' },
        { id:'comunicado', label:'Comunicado',  cor:'#9c27b0' },
        { id:'feriado',    label:'Feriado',     cor:'#e53935' }
    ],
    responsaveis: [],
    areas: []
};

/* ============================================================
   ESTADO
============================================================ */
let data = { config: JSON.parse(JSON.stringify(DEFAULT_CONFIG)), eventos: [] };
let nextId = 1;
let currentDate = new Date();
let view = 'mes';
let diaSelecionado = null;
let authToken = sessionStorage.getItem(TOKEN_KEY) || '';
let filtros = { tipo:'', responsavel:'', area:'' };
let dragState = { eventId: null, sourceDay: null };

/* ============================================================
   HELPERS
============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dateKeyFromDate(dt){ return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(k){ const [y,m,d]=k.split('-'); return `${Number(d)}/${Number(m)}/${y}`; }
function addDays(key,n){ const d = parseDateKey(key); d.setDate(d.getDate()+n); return dateKeyFromDate(d); }
function daysBetween(a,b){ return Math.round((parseDateKey(b)-parseDateKey(a))/86400000); }
function escapeHtml(t){ if(t==null) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* Cores */
function hexToRgb(hex){ const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i); if(!m) return {r:128,g:128,b:128}; return {r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}; }
function mix(a,b,t){ return {r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t)}; }
function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tipoCss(cor){ const base = hexToRgb(cor||'#888'); const bg = rgbToHex(mix(base,{r:255,g:255,b:255},.85)); const txt = rgbToHex(mix(base,{r:0,g:0,b:0},.45)); return `background:${bg};border-left-color:${cor||'#888'};color:${txt};`; }
function getTipo(id){ return (data.config.tipos||[]).find(t=>t.id===id) || {id, label:id||'Sem tipo', cor:'#888'}; }

function corAutomatica(label){
    let h = 0;
    for(let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return PALETA[h % PALETA.length];
}
function getRespCor(label){ const r = (data.config.responsaveis || []).find(x => x.label === label); return r ? r.cor : '#888'; }
function getAreaCor(label){ const a = (data.config.areas || []).find(x => x.label === label); return a ? a.cor : '#888'; }
function badgeStyle(cor){
    const base = hexToRgb(cor || '#888');
    const bg = rgbToHex(mix(base, {r:255,g:255,b:255}, 0.82));
    const txt = rgbToHex(mix(base, {r:0,g:0,b:0}, 0.35));
    return `background:${bg};color:${txt};`;
}

/* ============================================================
   PERSISTÊNCIA
============================================================ */
async function loadFromGitHub(){
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try { const r = await fetch(url+'?t='+Date.now()); if(!r.ok) throw new Error('nf'); return await r.json(); }
    catch(e){ console.warn('Sem dados remotos:', e); return null; }
}
async function loadData(){
    const raw = localStorage.getItem(CACHE_KEY);
    const t = Number(localStorage.getItem(CACHE_TIME_KEY)||0);
    if(raw && t && (Date.now()-t < CACHE_DURATION)){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    const remote = await loadFromGitHub();
    if(remote){ data = remote; prepararDados(); cacheLocal(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); return; }
    if(raw){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    cacheLocal();
}
function prepararDados(){
    if(!data.eventos) data.eventos = [];
    if(!data.config) data.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if(!data.config.tipos) data.config.tipos = JSON.parse(JSON.stringify(DEFAULT_CONFIG.tipos));

    data.config.responsaveis = (data.config.responsaveis || []).map(r =>
        typeof r === 'string' ? { label: r, cor: corAutomatica(r) } : r
    );
    data.config.areas = (data.config.areas || []).map(a =>
        typeof a === 'string' ? { label: a, cor: corAutomatica(a) } : a
    );

    data.eventos.forEach(ev=>{
        if(!ev.dataInicio && ev.data){ ev.dataInicio = ev.data; delete ev.data; }
        if(!ev.dataFim) ev.dataFim = ev.dataInicio;
        if(ev.responsavel === undefined) ev.responsavel = '';
        if(ev.area === undefined) ev.area = '';
        if(ev.ordem === undefined) ev.ordem = ev.id*10;
    });
    let max = 0;
    data.eventos.forEach(e=>{ if(e.id > max) max = e.id; });
    nextId = max+1;
}
function cacheLocal(){ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }

/* ============================================================
   SALVAR NO GITHUB
============================================================ */
async function salvarTudo(){
    if(!authToken){ alert('Faça login como admin (🔧 Admin) antes de salvar.'); return; }
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha;
    try { const r = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}`, {headers:{Authorization:`Bearer ${authToken}`}}); if(r.ok) sha = (await r.json()).sha; } catch(e){}
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = { message:`Atualiza planner - ${new Date().toLocaleString('pt-BR')}`, content, branch:GITHUB_BRANCH };
    if(sha) body.sha = sha;
    try {
        const put = await fetch(apiUrl, { method:'PUT', headers:{Authorization:`Bearer ${authToken}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if(!put.ok) throw new Error((await put.json()).message||'Erro');
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal();
        alert('✅ Salvo no GitHub com sucesso!');
    } catch(e){ alert('Erro ao salvar: '+e.message); }
}

/* ============================================================
   AUTENTICAÇÃO
============================================================ */
async function validarToken(token){
    try {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {headers:{Authorization:`Bearer ${token}`}});
        if(!r.ok) return false;
        const info = await r.json();
        return info.permissions && info.permissions.push === true;
    } catch(e){ return false; }
}
async function abrirAdmin(){
    if(!authToken){
        const t = prompt('Cole seu token do GitHub (com permissão de escrita neste repositório):');
        if(!t) return;
        const ok = await validarToken(t);
        if(!ok){ alert('Token inválido ou sem permissão de escrita.'); return; }
        authToken = t;
        sessionStorage.setItem(TOKEN_KEY, t);
    }
    renderAdminListas();
    document.getElementById('modalAdmin').classList.add('active');
}
function fecharAdmin(){ document.getElementById('modalAdmin').classList.remove('active'); }
function fazerLogout(){ if(!confirm('Sair do modo admin?')) return; authToken = ''; sessionStorage.removeItem(TOKEN_KEY); fecharAdmin(); }

/* ============================================================
   ADMIN
============================================================ */
function switchAdminTab(pane){
    document.querySelectorAll('.admin-tab').forEach(b=>b.classList.toggle('active', b.dataset.pane===pane));
    document.querySelectorAll('.admin-pane').forEach(p=>p.classList.toggle('active', p.id==='pane-'+pane));
}
function renderAdminListas(){
    const lt = document.getElementById('listaTipos');
    lt.innerHTML = data.config.tipos.length === 0
        ? '<div class="admin-empty">Nenhum tipo cadastrado.</div>'
        : data.config.tipos.map((t,i)=>`
            <li>
                <div class="item-color" style="background:${escapeHtml(t.cor)}"></div>
                <input type="text" class="item-label" value="${escapeHtml(t.label)}" onchange="editarTipoLabel(${i}, this.value)" style="border:1px solid transparent;background:transparent;font-weight:600;color:#163c6d;font-size:14px;">
                <input type="color" value="${escapeHtml(t.cor)}" onchange="editarTipoCor(${i}, this.value)">
                <div class="item-actions"><button class="btn-mini del" onclick="delTipo(${i})">✕</button></div>
            </li>`).join('');

    const lr = document.getElementById('listaResponsaveis');
    lr.innerHTML = data.config.responsaveis.length === 0
        ? '<div class="admin-empty">Nenhum responsável cadastrado.</div>'
        : data.config.responsaveis.map((r,i)=>`
            <li>
                <span class="badge badge-resp" style="${badgeStyle(r.cor)}">@${escapeHtml(r.label)}</span>
                <input type="text" class="item-label" value="${escapeHtml(r.label)}" onchange="editarRespLabel(${i}, this.value)" style="border:1px solid transparent;background:transparent;font-weight:600;color:#163c6d;font-size:14px;">
                <input type="color" value="${escapeHtml(r.cor)}" onchange="editarRespCor(${i}, this.value)">
                <div class="item-actions"><button class="btn-mini del" onclick="delResponsavel(${i})">✕</button></div>
            </li>`).join('');

    const la = document.getElementById('listaAreas');
    la.innerHTML = data.config.areas.length === 0
        ? '<div class="admin-empty">Nenhuma área cadastrada.</div>'
        : data.config.areas.map((a,i)=>`
            <li>
                <span class="badge badge-area" style="${badgeStyle(a.cor)}">${escapeHtml(a.label)}</span>
                <input type="text" class="item-label" value="${escapeHtml(a.label)}" onchange="editarAreaLabel(${i}, this.value)" style="border:1px solid transparent;background:transparent;font-weight:600;color:#163c6d;font-size:14px;">
                <input type="color" value="${escapeHtml(a.cor)}" onchange="editarAreaCor(${i}, this.value)">
                <div class="item-actions"><button class="btn-mini del" onclick="delArea(${i})">✕</button></div>
            </li>`).join('');
}
function addTipo(){
    const label = document.getElementById('novoTipoLabel').value.trim();
    const cor = document.getElementById('novoTipoCor').value;
    if(!label){ alert('Informe o nome do tipo.'); return; }
    let id = slug(label) || ('tipo-'+Date.now());
    if(data.config.tipos.find(t=>t.id===id)) id = id+'-'+Date.now();
    data.config.tipos.push({id,label,cor});
    document.getElementById('novoTipoLabel').value = '';
    cacheLocal(); renderAdminListas(); renderLegend(); popularFiltros();
}
function editarTipoLabel(i,v){ data.config.tipos[i].label = v.trim()||data.config.tipos[i].label; cacheLocal(); renderLegend(); popularFiltros(); }
function editarTipoCor(i,v){ data.config.tipos[i].cor = v; cacheLocal(); renderAdminListas(); renderLegend(); }
function delTipo(i){ const t=data.config.tipos[i]; if(!confirm(`Remover o tipo "${t.label}"?`)) return; data.config.tipos.splice(i,1); cacheLocal(); renderAdminListas(); renderLegend(); popularFiltros(); }

function addResponsavel(){
    const v = document.getElementById('novoResponsavel').value.trim();
    if(!v) return;
    if(data.config.responsaveis.find(r => r.label === v)){ alert('Já cadastrado.'); return; }
    data.config.responsaveis.push({ label: v, cor: corAutomatica(v) });
    data.config.responsaveis.sort((a,b)=>a.label.localeCompare(b.label));
    document.getElementById('novoResponsavel').value = '';
    cacheLocal(); renderAdminListas(); popularFiltros();
}
function delResponsavel(i){ if(!confirm(`Remover "${data.config.responsaveis[i].label}"?`)) return; data.config.responsaveis.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); }
function editarRespLabel(i,v){ v=v.trim(); if(!v){ renderAdminListas(); return; } data.config.responsaveis[i].label = v; cacheLocal(); renderAdminListas(); popularFiltros(); }

function addArea(){

function editarAreaLabel(i,v){ v=v.trim(); if(!v){ renderAdminListas(); return; } data.config.areas[i].label = v; cacheLocal(); renderAdminListas(); popularFiltros(); }

/* ============================================================
   MAPA DE EVENTOS
============================================================ */
function construirMapa(){
    const mapa = {};
    const evs = data.eventos
        .filter(passaFiltro)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    evs.forEach(ev=>{
        const ini = ev.dataInicio, fim = ev.dataFim||ini;
        if(!ini||!fim) return;
        let cur = ini;
        while(cur <= fim){
            if(!mapa[cur]) mapa[cur] = [];
            const position = ini===fim ? 'single' : (cur===ini ? 'start' : (cur===fim ? 'end' : 'middle'));
            mapa[cur].push({ev, position});
            cur = addDays(cur, 1);
        }
    });
    return mapa;
}

/* ============================================================
   RENDER PRINCIPAL
============================================================ */
function render(){
    document.querySelectorAll('.btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    atualizarTitulo();
    const c = document.getElementById('viewContainer');
    if(view === 'mes') c.innerHTML = renderMes();
    else if(view === 'semana') c.innerHTML = renderSemana();
    else if(view === 'dia') c.innerHTML = renderDia();
    else c.innerHTML = renderLista();
    renderLegend();
    atualizarContadorFiltro();
}
function atualizarContadorFiltro(){
    const el = document.getElementById('filterCount');
    if(!temFiltroAtivo()){ el.textContent = ''; return; }
    const total = data.eventos.length;
    const visiveis = data.eventos.filter(passaFiltro).length;
    el.textContent = `${visiveis} de ${total} eventos`;
}
function atualizarTitulo(){
    const mt = document.getElementById('monthTitle');
    const yt = document.getElementById('yearTitle');
    if(view === 'dia'){
        const d = currentDate;
        mt.textContent = DIAS_SEMANA_LONGO[d.getDay()].toUpperCase();
        yt.textContent = `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
    } else if(view === 'semana'){
        const ini = new Date(currentDate); ini.setDate(currentDate.getDate() - currentDate.getDay());
        const fim = new Date(ini); fim.setDate(ini.getDate() + 6);

        yt.textContent = `${ini.getDate()}/${ini.getMonth()+1} a ${fim.getDate()}/${fim.getMonth()+1} de ${fim.getFullYear()}`;

    }

============================================================ */
function renderChipHeader(ev, isContinuation){
    const parts = [];
    if(isContinuation) parts.push('<span class="continuation-mark" title="Continuação">↳</span>');
    if(ev.responsavel){
        const cor = getRespCor(ev.responsavel);
        parts.push(`<span class="badge badge-resp" style="${badgeStyle(cor)}" title="Responsável: ${escapeHtml(ev.responsavel)}">@${escapeHtml(ev.responsavel)}</span>`);

    return `<div class="chip-header">${parts.join('')}</div>`;

/* ============================================================
   RENDER — MÊS
============================================================ */
function renderMes(){
    const ano = currentDate.getFullYear(), mes = currentDate.getMonth();
    const primeiro = new Date(ano, mes, 1);
    const diaSemanaIni = primeiro.getDay();
    const ultimoDia = new Date(ano, mes+1, 0).getDate();
    const ultimoAnt = new Date(ano, mes, 0).getDate();
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '<table class="calendar"><thead><tr>';
    ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].forEach((d,i)=>{ html += `<th class="${(i===0||i===6)?'weekend':''}">${d}</th>`; });
    html += '</tr></thead><tbody>';

    const total = Math.ceil((diaSemanaIni + ultimoDia)/7)*7;
    for(let i=0;i<total;i++){
        if(i%7===0) html += '<tr>';
        const dia = i - diaSemanaIni + 1;
        let cy=ano, cm=mes, cd, other=false;
        if(dia<1){ other=true; cm=mes-1; cy=ano; if(cm<0){cm=11;cy--;} cd=ultimoAnt+dia; }
        else if(dia>ultimoDia){ other=true; cm=mes+1; cy=ano; if(cm>11){cm=0;cy++;} cd=dia-ultimoDia; }
        else cd = dia;

        const key = dateKey(cy, cm, cd);
        const evs = (!other && mapa[key]) ? mapa[key] : [];
        const wknd = (i%7===0||i%7===6);
        const hj = key === hojeKey;

        let cls = ''; if(other) cls += ' other-month'; if(wknd) cls += ' weekend';

        html += `<td class="${cls}" data-day="${key}" ${other?'':'onclick="cellClick(event, \''+key+'\')"'} ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        if(!other){
            html += `<span class="day-number ${hj?'hoje':''}">${cd}</span>`;
            if(evs.length > 0){
                html += `<span class="day-badge">${evs.length}</span><div class="events-list">`;
                evs.slice(0,8).forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
                if(evs.length>8) html += `<div style="font-size:10.5px;text-align:center;color:#163c6d;font-weight:600;">+${evs.length-8} mais</div>`;
                html += '</div>';
            }
        } else {
            html += `<span class="day-number" style="color:#c5cdd6">${cd}</span>`;
        }
        html += '</td>';
        if(i%7===6) html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

/* ============================================================
   RENDER — SEMANA
============================================================ */
function renderSemana(){
    const ini = new Date(currentDate);
    ini.setDate(currentDate.getDate() - currentDate.getDay());
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '<div class="week-grid">';
    for(let i=0;i<7;i++){
        const d = new Date(ini); d.setDate(ini.getDate()+i);
        const key = dateKeyFromDate(d);
        const evs = mapa[key] || [];
        const hj = key === hojeKey;
        const wknd = (i===0||i===6);
        html += `<div class="week-col ${wknd?'weekend':''}" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        html += `<div class="week-col-header ${hj?'hoje':''}">
                    <span style="font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;">${DIAS_SEMANA_CURTO[i]}</span>
                    <span class="wk-day">${d.getDate()}</span>
                 </div>`;
        evs.forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

/* Faixa com os 7 dias da semana atual (clicável) */
function renderDayStrip(){
    const ini = new Date(currentDate);
    ini.setDate(currentDate.getDate() - currentDate.getDay());
    const hojeKey = dateKeyFromDate(new Date());
    const curKey = dateKeyFromDate(currentDate);

    let html = '<div class="day-strip">';
    for(let i=0;i<7;i++){
        const d = new Date(ini); d.setDate(ini.getDate()+i);
        const k = dateKeyFromDate(d);
        const cls = ['day-strip-item'];
        if(k === curKey) cls.push('active');
        if(k === hojeKey) cls.push('hoje');

        html += `<button type="button" class="${cls.join(' ')}" onclick="irParaDia('${k}')" title="${DIAS_SEMANA_LONGO[i]}, ${d.getDate()}/${d.getMonth()+1}">
                    <span class="ds-wd">${DIAS_SEMANA_CURTO[i]}</span>
                    <span class="ds-num">${d.getDate()}</span>

}

    const desc = ev.descricao ? `<div class="dc-desc">${escapeHtml(ev.descricao)}</div>` : '';

    return `<div class="day-card" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"

    const ultimo = new Date(ano, mes+1, 0).getDate();

/* ============================================================
   CHIP (mês/semana/lista)
============================================================ */
function renderChip(ev, position, dayKey, expandido){
    const t = getTipo(ev.tipo);
    const isMulti = ev.dataInicio !== ev.dataFim;
    const isCont = isMulti && position !== 'start' && position !== 'single';
    const header = renderChipHeader(ev, isCont);
    const periodo = (expandido && isMulti) ? `<div style="font-size:11.5px;opacity:.75;margin-top:3px;font-style:italic;">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</div>` : '';
    const desc = (expandido && ev.descricao) ? `<div style="font-size:12.5px;opacity:.85;margin-top:3px;">${escapeHtml(ev.descricao)}</div>` : '';
    const tipoLabel = expandido ? `<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;opacity:.7;margin-top:3px;">${escapeHtml(t.label)}</div>` : '';
    const tooltip = [ev.responsavel?'Resp: '+ev.responsavel:'', ev.area?'Área: '+ev.area:'', ev.titulo, isMulti?`${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}`:'', ev.descricao||''].filter(Boolean).join(' • ');

    return `<div class="event-chip" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"
                 title="${escapeHtml(tooltip)}"
                 ondragstart="onChipDragStart(event, ${ev.id}, '${dayKey}')"
                 ondragend="onChipDragEnd(event)"
                 onclick="event.stopPropagation(); abrirFormEvento(${ev.id})">
                ${header}
                <span class="chip-title">${escapeHtml(ev.titulo)}</span>
                ${periodo}${desc}${tipoLabel}
            </div>`;
}

/* ============================================================
   DRAG & DROP
============================================================ */
function onChipDragStart(e, id, dayKey){
    dragState.eventId = id;
    dragState.sourceDay = dayKey;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(id));
    e.currentTarget.classList.add('dragging');
}
function onChipDragEnd(e){
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
    dragState.eventId = null;
    dragState.sourceDay = null;
}
function onDayDragOver(e, el){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-target');
}
function onDayDragLeave(e, el){
    if(!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
}
function onDayDrop(e, el){
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('drop-target');

    let srcId = dragState.eventId;
    if(!srcId){
        const raw = e.dataTransfer.getData('text/plain');
        srcId = raw ? Number(raw) : null;
    }
    if(!srcId) return;

    const dayKey = el.dataset.day;
    if(!dayKey) return;

    const ev = data.eventos.find(x=>x.id === srcId);
    if(!ev) return;

    const jaEstaNoDia = ev.dataInicio <= dayKey && dayKey <= ev.dataFim;
    if(!jaEstaNoDia){
        const diff = daysBetween(ev.dataInicio, dayKey);
        ev.dataInicio = addDays(ev.dataInicio, diff);
        ev.dataFim = addDays(ev.dataFim, diff);
    }

    const chips = Array.from(el.querySelectorAll('.event-chip')).filter(c => Number(c.dataset.eventId) !== srcId);
    const mouseY = e.clientY;
    let insertBeforeIdx = chips.length;
    for(let i=0;i<chips.length;i++){
        const rect = chips[i].getBoundingClientRect();
        if(mouseY < rect.top + rect.height/2){ insertBeforeIdx = i; break; }
    }

    const diaEvs = data.eventos
        .filter(x => x.id !== srcId && x.dataInicio <= dayKey && dayKey <= x.dataFim)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);

    diaEvs.splice(insertBeforeIdx, 0, ev);
    diaEvs.forEach((x,i)=>{ x.ordem = (i+1)*10; });

    dragState.eventId = null;
    dragState.sourceDay = null;
    cacheLocal();
    render();
}

/* ============================================================
   MODAL DO DIA
============================================================ */
function abrirModalDia(key){
    if(!key) key = dateKeyFromDate(currentDate);

    const [y,m,d] = key.split('-');
    document.getElementById('modalDiaTitulo').textContent = `${Number(d)} de ${MESES[Number(m)-1]} de ${y}`;
    renderListaDia();
    document.getElementById('modalDia').classList.add('active');
}
function renderListaDia(){
    const evs = data.eventos
        .filter(ev => ev.dataInicio <= diaSelecionado && diaSelecionado <= ev.dataFim)
        .filter(passaFiltro)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);

    const c = document.getElementById('eventsDayList');
    if(evs.length === 0){ c.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Nenhum evento neste dia.</p>'; return; }
    c.innerHTML = evs.map(ev => {
        const t = getTipo(ev.tipo);
        const periodo = ev.dataInicio !== ev.dataFim ? `<span class="periodo">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</span>` : '';
        const header = renderChipHeader(ev, false);
        return `<div class="event-row" style="${tipoCss(t.cor)}">
                    <div class="info">
                        <span class="tipo-label">${escapeHtml(t.label)}</span>
                        ${header}
                        <strong>${escapeHtml(ev.titulo)}</strong>
                        ${periodo}
                        ${ev.descricao ? `<span class="desc">${escapeHtml(ev.descricao)}</span>` : ''}
                    </div>
                    <div class="row-actions">
                        <button class="btn-mini edit" onclick="abrirFormEvento(${ev.id})">Editar</button>
                        <button class="btn-mini dup" onclick="duplicarEvento(${ev.id})">Duplicar</button>
                        <button class="btn-mini del" onclick="excluirEvento(${ev.id})">Excluir</button>
                    </div>
                </div>`;
    }).join('');
}
function fecharModalDia(){ document.getElementById('modalDia').classList.remove('active'); }

/* ============================================================
   FORMULÁRIO
============================================================ */
function novoEventoHoje(){ diaSelecionado = dateKeyFromDate(currentDate); abrirFormEvento(); }

function abrirFormEvento(id){
    fecharModalDia();
    const ev = id ? data.eventos.find(e=>e.id===id) : null;
    if(!ev && !diaSelecionado) diaSelecionado = dateKeyFromDate(new Date());

    document.getElementById('formTituloModal').textContent = ev ? 'Editar evento' : 'Novo evento';
    document.getElementById('formId').value = ev ? ev.id : '';
    document.getElementById('formDataInicio').value = ev ? ev.dataInicio : diaSelecionado;
    document.getElementById('formDataFim').value = ev ? (ev.dataFim !== ev.dataInicio ? ev.dataFim : '') : '';
    document.getElementById('formTitulo').value = ev ? ev.titulo : '';
    document.getElementById('formDescricao').value = ev ? (ev.descricao||'') : '';

    preencherSelect('formResponsavel', data.config.responsaveis.map(r => r.label), ev ? ev.responsavel : '');
    preencherSelect('formArea', data.config.areas.map(a => a.label), ev ? ev.area : '');
    preencherSelect('formTipo', data.config.tipos.map(t=>({value:t.id,label:t.label})), ev ? ev.tipo : (data.config.tipos[0]?data.config.tipos[0].id:''));

    document.getElementById('modalForm').classList.add('active');
    setTimeout(()=>document.getElementById('formTitulo').focus(), 100);
}
function preencherSelect(id, opcoes, valorAtual){
    const sel = document.getElementById(id);
    const normalizadas = opcoes.map(o => (typeof o === 'string' ? {value:o,label:o} : o));
    let html = '<option value="">— Nenhum —</option>';
    html += normalizadas.map(o => `<option value="${escapeHtml(o.value)}" ${o.value===valorAtual?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
    if(valorAtual && !normalizadas.find(o=>o.value===valorAtual)){
        html += `<option value="${escapeHtml(valorAtual)}" selected>${escapeHtml(valorAtual)} (removido)</option>`;
    }
    sel.innerHTML = html;
}
function fecharForm(){ document.getElementById('modalForm').classList.remove('active'); }

function mostrarTeletubies(){
    const el = document.getElementById('teletubiesOverlay');
    if(!el) return;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 5000);
}

function salvarEvento(){
    const dataInicio = document.getElementById('formDataInicio').value;
    const dataFimRaw = document.getElementById('formDataFim').value;
    const titulo = document.getElementById('formTitulo').value.trim();
    const responsavel = document.getElementById('formResponsavel').value;
    const area = document.getElementById('formArea').value;
    const descricao = document.getElementById('formDescricao').value.trim();
    const tipo = document.getElementById('formTipo').value;
    const id = document.getElementById('formId').value;

    if(!dataInicio){ alert('Informe a data de início.'); return; }
    if(!titulo){ alert('Informe o título.'); return; }
    const dataFim = dataFimRaw && dataFimRaw >= dataInicio ? dataFimRaw : dataInicio;

    if(id){
        const ev = data.eventos.find(e=>e.id===Number(id));
        if(ev){
            ev.dataInicio = dataInicio; ev.dataFim = dataFim;
            ev.titulo = titulo; ev.responsavel = responsavel;
            ev.area = area; ev.descricao = descricao; ev.tipo = tipo;
        }
    } else {
        data.eventos.push({ id: nextId++, dataInicio, dataFim, titulo, responsavel, area, descricao, tipo, ordem: nextId*10 });
        mostrarTeletubies();
    }
    cacheLocal(); fecharForm(); diaSelecionado = dataInicio; render(); abrirModalDia(dataInicio);
}
function duplicarEvento(id){
    const ev = data.eventos.find(e=>e.id===id); if(!ev) return;
    const novo = JSON.parse(JSON.stringify(ev));
    novo.id = nextId++; novo.ordem = nextId*10; novo.titulo = ev.titulo + ' (cópia)';
    data.eventos.push(novo);
    cacheLocal(); render(); renderListaDia();
}
function excluirEvento(id){
    if(!confirm('Excluir este evento?')) return;
    data.eventos = data.eventos.filter(e=>e.id!==id);
    cacheLocal(); renderListaDia(); render();
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
document.addEventListener('DOMContentLoaded', async ()=>{
    await loadData();
    const pref = localStorage.getItem(VIEW_KEY);
    if(pref) view = pref;
    else if(window.innerWidth < 560) view = 'lista';
    initSelects();
    sincronizarSelects();
    popularFiltros();
    render();

    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape'){ fecharForm(); fecharModalDia(); fecharAdmin(); return; }

        // Setas ← → navegam apenas na view "Dia" e quando não estiver digitando
        if(view === 'dia'){
            const tag = (e.target.tagName || '').toLowerCase();
            const digitando = (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable);
            const modalAberto = document.querySelector('.modal-overlay.active');
            if(digitando || modalAberto) return;
            if(e.key === 'ArrowLeft'){ e.preventDefault(); navDiaPrev(); }
            if(e.key === 'ArrowRight'){ e.preventDefault(); navDiaNext(); }
        }
    });
});
</script>
