<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA Planner</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    /* ============================================================
       VARIÁVEIS DE TEMA (default = index (1).html)
    ============================================================ */
    :root {
        /* Base */
        --bg-body: #f4f7fa;
        --bg-body-image: none;
        --bg-container: #ffffff;
        --bg-panel: #f8fafc;
        --bg-panel-alt: #ffffff;
        --bg-panel-dark: #f0f4f8;
        --bg-card: #ffffff;
        --border-color: #e6edf5;
        --border-color-strong: #d1d8e2;
        --border-style: solid;
        --border-width: 1px;

        /* Texto */
        --text-color: #333;
        --text-muted: #5a7ba3;
        --text-heading: #163c6d;
        --text-on-primary: #ffffff;

        /* Botões */
        --primary: #163c6d;
        --primary-hover: #0e2b4f;
        --secondary: #2b6ca3;
        --secondary-hover: #1f5280;
        --success: #1a9c4a;
        --success-hover: #13803b;
        --danger: #dc3545;
        --danger-hover: #a71d2a;
        --admin-bg: #7a4b00;
        --admin-hover: #5d3900;

        /* Filtros */
        --filter-bg: #fff7e6;
        --filter-border: #f5d99b;
        --filter-text: #7a4b00;

        /* Calendário */
        --cal-head-bg: #163c6d;
        --cal-head-weekend: #1f4d85;
        --cal-head-text: #ffffff;
        --cal-cell-bg: #ffffff;
        --cal-cell-hover: #f8fbff;
        --cal-cell-other: #f8fafc;
        --day-badge-bg: #163c6d;
        --day-badge-text: #ffffff;
        --day-number-color: #163c6d;
        --day-number-weekend: #2b6ca3;
        --day-number-other: #c5cdd6;

        /* Dia view */
        --day-header-bg: #163c6d;
        --day-header-text: #ffffff;
        --day-strip-bg: #ffffff;
        --day-strip-bg-active: #163c6d;
        --day-strip-text: #163c6d;
        --day-strip-text-active: #ffffff;
        --day-strip-hoje-bg: #f5a623;
        --day-strip-hoje-text: #ffffff;

        /* Toolbar/Modais */
        --toolbar-bg: #f8fafc;
        --toolbar-border: #e6edf5;
        --modal-bg: #ffffff;
        --modal-overlay: rgba(22,60,109,.55);
        --modal-border: none;

        /* Tipografia */
        --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --font-heading: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --font-mono: 'Courier New', monospace;
        --font-size-base: 15px;
        --font-size-h1: 40px;
        --font-weight-h1: 900;
        --letter-spacing-h1: 1px;
        --transform-h1: uppercase;
        --btn-font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --btn-font-size: 13px;
        --btn-text-transform: none;
        --btn-letter-spacing: 0;

        /* Formas */
        --radius: 8px;
        --radius-sm: 4px;
        --radius-lg: 12px;
        --btn-radius: 6px;

        /* Efeitos */
        --shadow: 0 4px 16px rgba(22,60,109,.08);
        --btn-shadow: none;
        --text-shadow-h1: none;
        --btn-border-style: none;
        --btn-border-width: 0px;
        --btn-border-color: transparent;

        /* HUD (só visível em temas com hudVisivel) */
        --hud-bg: #262626;
        --hud-panel-bg: linear-gradient(180deg, #5a5a5a 0%, #3f3f3f 60%, #2c2c2c 100%);
        --hud-panel-border-top: 2px solid #9a9a9a;
        --hud-panel-border-left: 2px solid #7a7a7a;
        --hud-panel-border-right: 2px solid #0a0a0a;
        --hud-panel-border-bottom: 2px solid #000;
        --hud-value-color: #c81010;
        --hud-value-green: #4ac04a;
        --hud-value-yellow: #d4a72c;
        --hud-label-color: #b0b0b0;
        --hud-face-bg: linear-gradient(180deg, #6a5a4a 0%, #3f3226 100%);
        --hud-face-border-top: 2px solid #9a8a7a;
        --hud-face-border-left: 2px solid #7a6a5a;
        --hud-face-border-right: 2px solid #0a0a0a;
        --hud-face-border-bottom: 2px solid #000;
        --hud-font-heading: 'Press Start 2P', monospace;
        --hud-font-body: 'VT323', monospace;
    }

    /* ============================================================
       BASE
    ============================================================ */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        font-family: var(--font-body);
        background-color: var(--bg-body);
        background-image: var(--bg-body-image);
        background-attachment: fixed;
        background-size: cover;
        background-position: center;
        color: var(--text-color);
        min-height: 100vh;
        font-size: var(--font-size-base);
    }
    .container {
        margin: 0 auto;
        background: var(--bg-container);
        box-shadow: var(--shadow);
        border: var(--border-width) var(--border-style) var(--border-color);
    }

    /* Header */
    .header-wrapper {
        display: flex; justify-content: flex-start; align-items: baseline;
        gap: 16px; flex-wrap: wrap; padding: 0 20px; margin-bottom: 12px;
    }
    .title-block { display: flex; align-items: baseline; gap: clamp(10px, 1.5vw, 22px); flex-wrap: wrap; }
    .title-block h1 {
        margin: 0; font-family: var(--font-heading); font-weight: var(--font-weight-h1);
        color: var(--text-heading); letter-spacing: var(--letter-spacing-h1);
        line-height: 1; text-transform: var(--transform-h1);
        text-shadow: var(--text-shadow-h1);
        font-size: var(--font-size-h1);
    }
    .year-inline {
        font-family: var(--font-body); font-size: clamp(16px, 2vw, 26px);
        color: var(--text-heading); letter-spacing: 2px;
        text-shadow: var(--text-shadow-h1);
    }

    /* Toolbar */
    .toolbar {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: var(--toolbar-bg);
        border: var(--border-width) var(--border-style) var(--toolbar-border);
        padding: 8px 12px; margin: 0 20px 10px;
        border-radius: var(--radius);
    }
    .toolbar select {
        border: var(--border-width) var(--border-style) var(--border-color-strong);
        background: var(--bg-panel-alt); color: var(--text-heading);
        font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer;
        padding: 5px 8px; border-radius: var(--radius-sm);
    }
    .toolbar .spacer { flex: 1; }

    /* Filtros */
    .filters {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: var(--filter-bg);
        border: var(--border-width) var(--border-style) var(--filter-border);
        padding: 8px 12px; margin: 0 20px 10px;
        border-radius: var(--radius);
    }
    .filters select {
        border: var(--border-width) var(--border-style) var(--filter-border);
        background: var(--bg-panel-alt); color: var(--filter-text);
        font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer;
        padding: 5px 8px; border-radius: var(--radius-sm);
    }
    .filters .lbl {
        font-family: var(--font-heading); font-size: 11px; color: var(--filter-text);
        text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
    }
    .filters .count {
        color: var(--filter-text); font-family: var(--font-body);
        font-size: 14px; font-weight: 700; margin-left: auto;
    }

    /* Botões */
    .btn {
        border: var(--btn-border-width) var(--btn-border-style) var(--btn-border-color);
        border-radius: var(--btn-radius); cursor: pointer;
        font-family: var(--btn-font-family); font-size: var(--btn-font-size); font-weight: 700;
        transition: .15s; white-space: nowrap;
        text-transform: var(--btn-text-transform); letter-spacing: var(--btn-letter-spacing);
        padding: 8px 12px; box-shadow: var(--btn-shadow);
        color: var(--text-on-primary);
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--secondary); }
    .btn-secondary:hover { background: var(--secondary-hover); }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: var(--success-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-admin { background: var(--admin-bg); }
    .btn-admin:hover { background: var(--admin-hover); }
    .btn-nav { background: var(--bg-panel-dark); color: var(--text-heading); min-width: 34px; padding: 6px 10px; }
    .btn-nav:hover { filter: brightness(.93); }
    .btn-toggle { background: var(--bg-panel-dark); color: var(--text-heading); }
    .btn-toggle.active { background: var(--primary); color: var(--text-on-primary); }
    .btn-mini {
        border: var(--btn-border-width) var(--btn-border-style) var(--btn-border-color);
        border-radius: var(--radius-sm); cursor: pointer;
        font-weight: 700; font-family: var(--font-body); font-size: 12px; padding: 3px 7px;
        color: var(--text-on-primary);
    }
    .btn-mini:active { transform: translateY(1px); }
    .btn-mini.edit { background: var(--secondary); }
    .btn-mini.del { background: var(--danger); }
    .btn-mini.dup { background: var(--success); }
    .btn-mini.up, .btn-mini.down { background: var(--bg-panel-dark); color: var(--text-heading); }
    .btn-mini.up:disabled, .btn-mini.down:disabled { opacity: .3; cursor: not-allowed; }

    /* Calendário */
    .calendar {
        width: calc(100% - 40px); margin: 0 20px;
        border-collapse: separate; border-spacing: 0; table-layout: fixed;
        border: var(--border-width) var(--border-style) var(--border-color);
        border-radius: var(--radius); overflow: hidden;
    }
    .calendar thead th {
        background: var(--cal-head-bg); color: var(--cal-head-text);
        font-family: var(--font-heading); font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px; padding: 8px 4px;
    }
    .calendar thead th.weekend { background: var(--cal-head-weekend); }
    .calendar td {
        background: var(--cal-cell-bg);
        border: var(--border-width) var(--border-style) var(--border-color);
        vertical-align: top; padding: 4px 5px; position: relative; cursor: pointer;
        transition: background .15s; overflow: hidden;
        height: clamp(85px, 12vh, 200px);
    }
    .calendar td:hover { background: var(--cal-cell-hover); }
    .calendar td.other-month { background: var(--cal-cell-other); cursor: default; opacity: .75; }
    .calendar td.other-month .day-number { color: var(--day-number-other); }
    .calendar td.weekend .day-number { color: var(--day-number-weekend); }
    .day-number {
        font-family: var(--font-heading); font-weight: 700;
        font-size: clamp(11px, 1.1vw, 16px);
        color: var(--day-number-color); display: inline-block; text-align: center;
        line-height: 1; margin-bottom: 4px;
    }
    .day-number.hoje {
        background: var(--primary); color: var(--text-on-primary) !important;
        border-radius: 50%; padding: 3px 5px; min-width: 24px;
    }
    .day-badge {
        position: absolute; top: 4px; right: 4px;
        background: var(--day-badge-bg); color: var(--day-badge-text);
        font-family: var(--font-heading); font-size: 9px; font-weight: 700;
        padding: 2px 5px; line-height: 1; border-radius: 10px;
    }

    /* Chips */
    .event-chip {
        border-left: 4px solid; cursor: grab; transition: filter .15s;
        display: block; word-break: break-word; white-space: normal; flex-shrink: 0;
        font-family: var(--font-body); font-size: 14px;
        padding: 4px 7px; border-radius: var(--radius-sm); line-height: 1.25;
    }
    .event-chip:hover { filter: brightness(1.08); }
    .event-chip.dragging { opacity: .4; }
    .chip-title { font-weight: 700; display: block; font-size: 15px; }
    .continuation-mark { display: inline-block; opacity: .7; font-weight: 700; }
    .events-list {
        display: flex; flex-direction: column; gap: 3px; margin-top: 3px;
        max-height: clamp(60px, 9vh, 150px); overflow-y: auto; overflow-x: hidden; padding-right: 2px;
    }
    .events-list::-webkit-scrollbar { width: 6px; }
    .events-list::-webkit-scrollbar-thumb { background: var(--border-color-strong); border-radius: 3px; }

    .chip-header { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; width: 100%; margin-bottom: 2px; }
    .badge {
        display: inline-block; border-radius: var(--radius-sm);
        font-family: var(--font-body); font-size: 12px; font-weight: 700;
        letter-spacing: .3px; line-height: 1.4; padding: 0 5px;
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badge-area { font-style: italic; font-weight: 600; }
    .badge-status { display: inline-flex; align-items: center; gap: 4px; }
    .badge-status .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* Semana */
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 20px; }
    .week-col {
        background: var(--cal-cell-bg);
        border: var(--border-width) var(--border-style) var(--border-color);
        border-radius: var(--radius);
        padding: 5px; min-height: clamp(220px, 42vh, 440px);
        display: flex; flex-direction: column; gap: 4px;
    }
    .week-col-header {
        background: var(--cal-head-bg); color: var(--cal-head-text);
        text-align: center; font-family: var(--font-heading); font-size: 10px;
        padding: 5px; border-radius: var(--radius-sm); margin: -5px -5px 4px;
    }
    .week-col-header.hoje { background: var(--primary); }
    .week-col-header .wk-day { display: block; font-size: 18px; line-height: 1.1; margin-top: 2px; }
    .week-col.weekend { background: var(--cal-cell-other); }

    /* Dia */
    .day-view { max-width: min(900px, 100%); margin: 0 auto; padding: 0 20px; }
    .day-view-header {
        background: var(--day-header-bg); color: var(--day-header-text);
        padding: 14px 18px;
        border-radius: var(--radius);
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        margin-bottom: 12px;
    }
    .day-view-header h2 { margin: 0; font-family: var(--font-heading); font-size: clamp(14px, 1.7vw, 20px); }
    .day-view-header .sub { font-family: var(--font-body); font-size: 15px; letter-spacing: 1px; opacity: .9; }
    .day-nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
    .day-strip-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        background: var(--day-strip-bg); color: var(--day-strip-text);
        border: var(--border-width) var(--border-style) var(--border-color);
        border-radius: var(--radius); padding: 6px 2px; cursor: pointer;
        font-family: var(--font-body); transition: .15s;
    }
    .day-strip-item:hover { filter: brightness(.96); }
    .day-strip-item .ds-wd { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: .75; }
    .day-strip-item .ds-num { font-family: var(--font-heading); font-size: 14px; font-weight: 900; }
    .day-strip-item.hoje .ds-num {
        background: var(--day-strip-hoje-bg); color: var(--day-strip-hoje-text);
        border-radius: 50%; padding: 2px 5px;
    }
    .day-strip-item.active { background: var(--day-strip-bg-active); color: var(--day-strip-text-active); }
    .day-strip-item.active .ds-wd, .day-strip-item.active .ds-num { color: var(--day-strip-text-active); }

    .day-view-list { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
    .day-view-list:empty::after {
        content: 'Nenhum evento neste dia. Arraste para cá ou clique em "Novo evento".';
        display: block; text-align: center; color: var(--text-muted);
        border: 2px dashed var(--border-color-strong); border-radius: var(--radius);
        padding: 40px 20px; font-family: var(--font-body); font-size: 16px;
    }
    .day-card {
        border-left: 6px solid; cursor: grab;
        padding: 10px 14px; border-radius: var(--radius);
        display: flex; flex-direction: column; gap: 5px; min-width: 0;
        font-family: var(--font-body); font-size: 15px;
    }
    .day-card:hover { filter: brightness(1.05); }
    .day-card.dragging { opacity: .4; }
    .day-card .dc-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 10px; width: 100%; }
    .day-card .dc-title { font-weight: 700; width: 100%; min-width: 0; word-break: break-word; overflow-wrap: anywhere; line-height: 1.3; font-size: 17px; }
    .day-card .dc-actions { display: flex; gap: 4px; flex-shrink: 0; align-self: flex-start; }
    .day-card .dc-meta { opacity: .9; display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
    .day-card .dc-desc { opacity: .92; word-break: break-word; font-size: 14px; line-height: 1.4; }

    /* Lista */
    .list-day {
        background: var(--bg-panel-alt);
        border: var(--border-width) var(--border-style) var(--border-color);
        border-radius: var(--radius);
        margin: 0 20px 10px; overflow: hidden;
    }
    .list-day-header {
        background: var(--cal-head-bg); color: var(--cal-head-text);
        padding: 8px 12px;
        font-family: var(--font-heading); font-size: 12px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .list-day-header.hoje { background: var(--primary); }
    .list-day-header .weekday { font-family: var(--font-body); font-size: 14px; opacity: .85; text-transform: uppercase; letter-spacing: 1.5px; }
    .list-day-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }

    /* Legenda */
    .legend {
        display: flex; flex-wrap: wrap; gap: 10px 16px;
        margin: 16px 20px 20px; padding: 12px;
        background: var(--bg-panel); border: var(--border-width) var(--border-style) var(--border-color);
        border-radius: var(--radius);
        font-family: var(--font-body); font-size: 14px; color: var(--text-color);
    }
    .legend .item { display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 14px; height: 14px; border-radius: var(--radius-sm); border-left: 3px solid; }
    .legend .sep { width: 1px; align-self: stretch; background: var(--border-color-strong); margin: 0 4px; }

    /* Modais */
    .modal-overlay { position: fixed; inset: 0; background: var(--modal-overlay); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal {
        background: var(--modal-bg); border: var(--modal-border);
        padding: 20px; max-width: min(620px, 100% - 16px); max-height: 92vh;
        overflow-y: auto; color: var(--text-color);
        border-radius: var(--radius-lg);
        box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    .modal.large { max-width: min(960px, 100% - 16px); }
    .modal h2 {
        margin: 0 0 14px; font-family: var(--font-heading); font-size: 20px;
        color: var(--text-heading); text-transform: var(--transform-h1);
        letter-spacing: var(--letter-spacing-h1);
    }
    .modal .field { margin-bottom: 10px; }
    .modal label {
        display: block; font-weight: 700; font-family: var(--font-body); font-size: 14px;
        color: var(--text-heading); margin-bottom: 3px;
        letter-spacing: .5px; text-transform: uppercase;
    }
    .modal .hint { font-family: var(--font-body); font-size: 13px; color: var(--text-muted); margin-top: 2px; display: block; }
    .modal input[type=text], .modal input[type=date], .modal input[type=number],
    .modal input[type=color], .modal textarea, .modal select {
        width: 100%; padding: 7px 9px;
        border: var(--border-width) var(--border-style) var(--border-color-strong);
        background: var(--bg-panel-alt); color: var(--text-color);
        font-family: var(--font-body); font-size: 15px;
        border-radius: var(--radius-sm);
    }
    .modal input[type=color] { height: 34px; padding: 2px; cursor: pointer; }
    .modal textarea { resize: vertical; min-height: 70px; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
    .modal .actions .left { margin-right: auto; }
    .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .modal .row2, .modal .row3 { grid-template-columns: 1fr; } }

    .events-day-list { margin: 12px 0; max-height: 340px; overflow-y: auto; }
    .events-day-list .event-row {
        padding: 8px 10px; margin-bottom: 6px; border-left: 5px solid;
        display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
        font-family: var(--font-body); border-radius: var(--radius-sm);
    }
    .events-day-list .event-row .info { flex: 1; min-width: 0; }
    .events-day-list .event-row .info .tipo-label {
        display: inline-block; font-family: var(--font-heading);
        font-size: 10px; font-weight: 900; text-transform: uppercase;
        opacity: .75; letter-spacing: 1px; margin-right: 6px;
    }
    .events-day-list .event-row .info strong { display: block; font-size: 16px; word-break: break-word; margin: 3px 0; }
    .events-day-list .event-row .info .periodo { opacity: .8; display: block; font-style: italic; font-size: 13px; }
    .events-day-list .event-row .info .desc { opacity: .85; display: block; font-size: 14px; margin-top: 3px; }
    .events-day-list .event-row .row-actions { display: flex; gap: 4px; flex-shrink: 0; flex-direction: column; }

    /* Admin */
    .admin-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border-color-strong); flex-wrap: wrap; }
    .admin-tab {
        background: var(--bg-panel-dark); color: var(--text-muted);
        border: var(--border-width) var(--border-style) var(--border-color);
        border-bottom: none; border-top-left-radius: var(--radius-sm); border-top-right-radius: var(--radius-sm);
        font-family: var(--font-body); font-size: 13px; font-weight: 700;
        cursor: pointer; padding: 9px 12px; margin-bottom: -2px;
        text-transform: uppercase; letter-spacing: .5px;
    }
    .admin-tab.active { background: var(--primary); color: var(--text-on-primary); border-color: var(--primary); }
    .admin-pane { display: none; padding: 14px 0 0; }
    .admin-pane.active { display: block; }

    .admin-list { list-style: none; padding: 0; margin: 0 0 14px; }
    .admin-list li {
        display: flex; align-items: center; gap: 8px;
        background: var(--bg-panel); border: var(--border-width) var(--border-style) var(--border-color);
        padding: 6px 8px; margin-bottom: 5px; border-radius: var(--radius-sm);
    }
    .admin-list li .item-color { width: 20px; height: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-color-strong); flex-shrink: 0; }
    .admin-list li .item-label {
        flex: 1; font-weight: 600; color: var(--text-heading);
        font-family: var(--font-body); font-size: 15px;
        border: 1px solid transparent; background: transparent;
    }
    .admin-list li input[type=color] { width: 34px; height: 28px; padding: 1px; border: 1px solid var(--border-color-strong); cursor: pointer; background: var(--bg-panel-alt); border-radius: var(--radius-sm); }
    .admin-list li .item-actions { display: flex; gap: 3px; }

    .admin-add {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: var(--bg-panel); border: var(--border-width) var(--border-style) var(--border-color);
        padding: 8px 10px; border-radius: var(--radius-sm);
    }
    .admin-add input[type=text], .admin-add input[type=number] {
        flex: 1; min-width: 100px; padding: 6px 8px;
        border: var(--border-width) var(--border-style) var(--border-color-strong);
        background: var(--bg-panel-alt); color: var(--text-color);
        font-family: var(--font-body); font-size: 15px;
        border-radius: var(--radius-sm);
    }
    .admin-add input[type=color] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border-color-strong); background: var(--bg-panel-alt); cursor: pointer; border-radius: var(--radius-sm); }
    .admin-empty {
        color: var(--text-muted); font-family: var(--font-body); text-align: center; padding: 12px;
        border: 2px dashed var(--border-color-strong); margin-bottom: 12px; font-size: 15px; border-radius: var(--radius-sm);
    }

    /* Lista de imagens (background e foto) */
    .bg-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
    .bg-item { border: 2px solid var(--border-color); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: .15s; background: var(--bg-panel-alt); position: relative; }
    .bg-item:hover { border-color: var(--secondary); }
    .bg-item.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,60,109,.15); }
    .bg-item img { display: block; width: 100%; height: 80px; object-fit: cover; }
    .bg-item .bg-nome { font-family: var(--font-body); font-size: 12px; padding: 5px; color: var(--text-heading); font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bg-item .bg-check { position: absolute; top: 5px; right: 5px; background: var(--primary); color: var(--text-on-primary); border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 12px; }
    .bg-item.selected .bg-check { display: flex; }
    .bg-vazio { color: var(--text-muted); font-family: var(--font-body); font-size: 14px; padding: 10px; text-align: center; border: 2px dashed var(--border-color-strong); border-radius: var(--radius-sm); }
    .bg-preview { height: 90px; border: 2px solid var(--border-color-strong); border-radius: var(--radius); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--text-heading); font-family: var(--font-body); font-weight: 600; font-size: 12px; }
    .bg-preview .preview-tag { background: var(--bg-container); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-color); }
    .foto-preview {
        height: 100px; width: 100px; border: 2px solid var(--border-color-strong); background: var(--bg-panel-alt);
        display: flex; align-items: center; justify-content: center; margin-bottom: 10px; border-radius: var(--radius);
    }
    .foto-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* HUD */
    .doom-hud {
        display: grid;
        grid-template-columns:
            minmax(80px, 1fr) minmax(100px, 1.2fr) minmax(90px, 1fr)
            minmax(96px, 1fr) minmax(90px, 1fr) minmax(80px, .8fr) minmax(160px, 1.8fr);
        gap: 5px;
        background: var(--hud-bg);
        border-top: 3px solid var(--border-color);
        border-bottom: 3px solid var(--border-color-strong);
        padding: 7px; margin: 0 0 14px;
        font-family: var(--hud-font-heading);
        position: sticky; top: 0; z-index: 50;
    }
    .doom-hud.oculto { display: none; }
    @media (max-width: 900px) {
        .doom-hud { grid-template-columns: repeat(4, 1fr); }
        .doom-hud .hud-block.hud-ammo { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
        .doom-hud { grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; }
    }
    .hud-block {
        background: var(--hud-panel-bg);
        border-top: var(--hud-panel-border-top);
        border-left: var(--hud-panel-border-left);
        border-right: var(--hud-panel-border-right);
        border-bottom: var(--hud-panel-border-bottom);
        padding: 8px 4px 6px; text-align: center;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; min-height: 76px; position: relative;
    }
    .hud-value {
        font-family: var(--hud-font-heading);
        font-size: clamp(15px, 1.7vw, 24px); font-weight: 900;
        color: var(--hud-value-color); line-height: 1; letter-spacing: -1px;
        text-shadow: 1px 1px 0 #000, 2px 2px 0 rgba(0,0,0,.4);
    }
    .hud-value.green { color: var(--hud-value-green); }
    .hud-value.yellow { color: var(--hud-value-yellow); }
    .hud-label {
        font-family: var(--hud-font-body);
        font-size: 11px; letter-spacing: 1.5px;
        color: var(--hud-label-color); text-transform: uppercase;
        text-shadow: 1px 1px 0 #000;
    }
    .hud-face {
        background: var(--hud-face-bg);
        border-top: var(--hud-face-border-top);
        border-left: var(--hud-face-border-left);
        border-right: var(--hud-face-border-right);
        border-bottom: var(--hud-face-border-bottom);
        padding: 4px; display: flex; align-items: center; justify-content: center;
        min-height: 76px; overflow: hidden;
    }
    .hud-face img { max-width: 100%; max-height: 72px; object-fit: contain; display: block; }
    .hud-arms { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 1px; background: #1a1a1a; padding: 1px; width: 100%; max-width: 84px; }
    .hud-arm {
        background: var(--hud-panel-bg); border: 1px solid #0a0a0a;
        color: var(--hud-value-color);
        font-family: var(--hud-font-heading); font-size: 10px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
        aspect-ratio: 1; min-height: 14px; cursor: pointer; transition: filter .1s;
    }
    .hud-arm:hover { filter: brightness(1.25); }
    .hud-arm.ativo { background: var(--hud-value-yellow); color: #2a1a00; }
    .hud-arm .arm-cor { display: block; width: 5px; height: 5px; border-radius: 50%; position: absolute; top: 2px; right: 2px; border: 1px solid #000; }
    .hud-keys { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .hud-key {
        width: 13px; height: 18px;
        border: 1px solid #000; border-top-color: #bbb; border-left-color: #999;
        border-radius: 2px 2px 4px 4px; position: relative;
        background: var(--hud-panel-bg); cursor: pointer;
    }
    .hud-key::before { content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border: 1px solid #000; border-radius: 50%; background: inherit; }
    .hud-key:hover { filter: brightness(1.3); }
    .hud-key.ativo { box-shadow: 0 0 8px currentColor, inset 0 0 4px currentColor; }
    .hud-ammo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 8px; width: 100%; padding: 3px 5px; align-items: center; }
    .hud-ammo-item { display: grid; grid-template-columns: 1fr auto; gap: 5px; align-items: baseline; }
    .hud-ammo-item .lbl { color: var(--hud-label-color); text-shadow: 1px 1px 0 #000; font-family: var(--hud-font-body); font-size: 12px; letter-spacing: 1px; text-align: left; }
    .hud-ammo-item .num { color: var(--hud-value-yellow); text-shadow: 1px 1px 0 #000; font-weight: 900; text-align: right; font-family: var(--hud-font-heading); font-size: 10px; }

    /* Teletubies */
    .teletubies-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 2000; pointer-events: none; }
    .teletubies-overlay.active { display: flex; }
    .teletubies-img { max-width: 60vw; max-height: 60vh; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6)); animation: popTubies .35s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popTubies {
        0%   { transform: scale(.5) rotate(-8deg); opacity: 0; }
        60%  { transform: scale(1.08) rotate(3deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* Drop targets */
    td.drop-target, .week-col.drop-target, .day-view-list.drop-target, .list-day-body.drop-target {
        box-shadow: inset 0 0 0 3px var(--primary) !important;
        filter: brightness(1.15);
    }

    /* Editor de tema */
    .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .theme-field {
        display: flex; align-items: center; gap: 8px;
        background: var(--bg-panel); border: var(--border-width) var(--border-style) var(--border-color);
        padding: 6px 8px; border-radius: var(--radius-sm);
    }
    .theme-field label {
        flex: 1; font-size: 12px; font-weight: 600; color: var(--text-heading);
        text-transform: none; margin: 0; letter-spacing: 0; font-family: var(--font-body);
    }
    .theme-field input[type=color] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border-color-strong); cursor: pointer; background: var(--bg-panel-alt); border-radius: var(--radius-sm); }
    .theme-field input[type=text], .theme-field input[type=number] {
        width: 130px; padding: 5px 7px; border: var(--border-width) var(--border-style) var(--border-color-strong);
        background: var(--bg-panel-alt); color: var(--text-color);
        font-family: var(--font-body); font-size: 13px; border-radius: var(--radius-sm);
    }
    .theme-field select {
        width: 130px; padding: 5px 7px; border: var(--border-width) var(--border-style) var(--border-color-strong);
        background: var(--bg-panel-alt); color: var(--text-color);
        font-family: var(--font-body); font-size: 13px; border-radius: var(--radius-sm); cursor: pointer;
    }
    .theme-preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .theme-preset-card {
        border: 2px solid var(--border-color); border-radius: var(--radius); cursor: pointer;
        padding: 12px; text-align: center; transition: .15s; background: var(--bg-panel-alt);
        position: relative;
    }
    .theme-preset-card:hover { border-color: var(--secondary); }
    .theme-preset-card.selected { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,60,109,.15); }
    .theme-preset-card .preset-nome { font-weight: 700; color: var(--text-heading); font-family: var(--font-body); font-size: 14px; margin-bottom: 4px; }
    .theme-preset-card .preset-badge {
        position: absolute; top: 5px; right: 5px; background: var(--secondary); color: var(--text-on-primary);
        font-size: 9px; padding: 1px 6px; border-radius: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .5px;
    }
    .theme-preset-card .preset-preview {
        height: 60px; border-radius: var(--radius-sm); margin-bottom: 6px; display: flex; align-items: center; justify-content: center;
        font-family: var(--font-body); font-size: 22px; font-weight: 900;
    }

    /* Responsivo */
    *, *::before, *::after { min-width: 0; }
    img, table { max-width: 100%; }
    body { padding: clamp(4px, 1vw, 14px); }
    .container { width: 100%; max-width: min(1800px, 100%); padding: clamp(10px, 2vw, 26px); border-radius: var(--radius-lg); }
    .header-wrapper { padding: 0 clamp(10px, 1.5vw, 20px); gap: clamp(8px, 1.5vw, 20px); }
    .title-block h1 { font-size: clamp(22px, 3.5vw, var(--font-size-h1)); }

    @media (max-width: 800px) {
        .toolbar, .filters { margin: 0 10px 10px; padding: 6px 10px; }
        .toolbar .btn { flex: 1 1 auto; min-width: 70px; justify-content: center; }
        .toolbar .spacer { display: none; }
        .calendar, .list-day, .legend { margin-left: 10px; margin-right: 10px; }
        .week-grid { padding: 0 10px; grid-template-columns: repeat(7, minmax(120px, 1fr)); overflow-x: auto; }
        .day-view { padding: 0 10px; }
    }
    @media (max-width: 560px) {
        .container { padding: 12px 0; }
        .day-view-header { flex-direction: column; align-items: stretch; text-align: center; padding: 10px; }
        .day-nav { justify-content: center; }
        .day-strip { gap: 2px; }
        .day-strip-item { padding: 4px 1px; }
        .modal { padding: 14px; }
        .modal .row2, .modal .row3 { grid-template-columns: 1fr; }
        .theme-grid { grid-template-columns: 1fr; }
        .theme-field { flex-wrap: wrap; }
        .theme-field input[type=text], .theme-field input[type=number], .theme-field select { width: 100%; }
    }
</style>
</head>
<body>

<div class="container">

    <!-- HUD -->
    <div class="doom-hud" id="doomHud">
        <div class="hud-block">
            <span class="hud-value" id="hudTotalEventos">0</span>
            <span class="hud-label">Eventos</span>
        </div>
        <div class="hud-block">
            <span class="hud-value green" id="hudPctFinalizados">0%</span>
            <span class="hud-label">Feito</span>
        </div>
        <div class="hud-block" style="padding:5px;">
            <div class="hud-arms" id="hudArms"></div>
            <span class="hud-label" style="margin-top:3px;">Tipos</span>
        </div>
        <div class="hud-face" title="Foto" id="hudFaceWrap">
            <img id="hudFaceImg" src="img/mini-me.png" alt="Foto"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:28px;color:#c81010;\'>:(</span>';">
        </div>
        <div class="hud-block">
            <span class="hud-value yellow" id="hudPctAndamento">0%</span>
            <span class="hud-label">Andando</span>
        </div>
        <div class="hud-block" style="padding:8px 4px;">
            <div class="hud-keys" id="hudKeys"></div>
            <span class="hud-label" style="margin-top:3px;">Status</span>
        </div>
        <div class="hud-block hud-ammo">
            <div class="hud-ammo-item"><span class="lbl">RESP</span><span class="num" id="hudResp">0</span></div>
            <div class="hud-ammo-item"><span class="lbl">ÁREA</span><span class="num" id="hudArea">0</span></div>
            <div class="hud-ammo-item"><span class="lbl">TIPO</span><span class="num" id="hudTipo">0</span></div>
            <div class="hud-ammo-item"><span class="lbl">STAT</span><span class="num" id="hudStat">0</span></div>
        </div>
    </div>

    <div class="header-wrapper">
        <div class="title-block">
            <h1 id="monthTitle">PLANNER</h1>
            <span class="year-inline" id="yearTitle"></span>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-nav" onclick="navPrev()" title="Anterior">‹</button>
        <select id="selectMes"></select>
        <select id="selectAno"></select>
        <button class="btn btn-nav" onclick="navNext()" title="Próximo">›</button>
        <button class="btn btn-primary" onclick="irHoje()">📅 Hoje</button>
        <button class="btn btn-toggle" data-view="mes" onclick="setView('mes')">Mês</button>
        <button class="btn btn-toggle" data-view="semana" onclick="setView('semana')">Semana</button>
        <button class="btn btn-toggle" data-view="dia" onclick="setView('dia')">Dia</button>
        <button class="btn btn-toggle" data-view="lista" onclick="setView('lista')">Lista</button>
        <span class="spacer"></span>
        <button class="btn btn-secondary" onclick="novoEventoHoje()">➕ Novo</button>
        <button class="btn btn-admin" id="btnAdmin" onclick="abrirAdmin()">🔧 Admin</button>
        <button class="btn btn-success" onclick="salvarTudo()">💾 Salvar</button>
    </div>

    <div class="filters" id="filtersBar">
        <span class="lbl">Filtros:</span>
        <select id="filterTipo" onchange="aplicarFiltros()"></select>
        <select id="filterStatus" onchange="aplicarFiltros()"></select>
        <select id="filterResp" onchange="aplicarFiltros()"></select>
        <select id="filterArea" onchange="aplicarFiltros()"></select>
        <button class="btn btn-mini" style="background:var(--filter-text);color:var(--filter-bg);" onclick="limparFiltros()">Limpar</button>
        <span class="count" id="filterCount"></span>
    </div>

    <div id="viewContainer"></div>
    <div class="legend" id="legend"></div>
</div>

<!-- Modal do dia -->
<div class="modal-overlay" id="modalDia" onclick="if(event.target===this) fecharModalDia()">
    <div class="modal">
        <h2 id="modalDiaTitulo">Eventos do dia</h2>
        <div class="events-day-list" id="eventsDayList"></div>
        <div class="actions">
            <button class="btn btn-secondary left" onclick="abrirFormEvento(null, diaSelecionado)">➕ Adicionar evento</button>
            <button class="btn btn-primary" onclick="fecharModalDia()">Fechar</button>
        </div>
    </div>
</div>

<!-- Modal do formulário -->
<div class="modal-overlay" id="modalForm" onclick="if(event.target===this) fecharForm()">
    <div class="modal">
        <h2 id="formTituloModal">Novo evento</h2>
        <input type="hidden" id="formId">
        <div class="row2">
            <div class="field"><label>Data de início</label><input type="date" id="formDataInicio"></div>
            <div class="field"><label>Data de término</label><input type="date" id="formDataFim"></div>
        </div>
        <div class="field"><label>Título</label><input type="text" id="formTitulo" placeholder="Ex.: Disponibilização da planilha"></div>
        <div class="row2">
            <div class="field"><label>Responsável</label><select id="formResponsavel"></select></div>
            <div class="field"><label>Área</label><select id="formArea"></select></div>
        </div>
        <div class="field"><label>Descrição (opcional)</label><textarea id="formDescricao" placeholder="Detalhes do evento..."></textarea></div>
        <div class="row2">
            <div class="field"><label>Tipo</label><select id="formTipo"></select></div>
            <div class="field"><label>Status</label><select id="formStatus"></select></div>
        </div>
        <div class="actions">
            <button class="btn btn-danger left" id="btnExcluirForm" style="display:none;" onclick="excluirEventoForm()">🗑 Excluir</button>
            <button class="btn btn-primary" onclick="salvarEvento()">Salvar</button>
            <button class="btn btn-secondary" onclick="fecharForm()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Admin -->
<div class="modal-overlay" id="modalAdmin" onclick="if(event.target===this) fecharAdmin()">
    <div class="modal large">
        <h2>🔧 Painel de Administrador</h2>
        <div class="admin-tabs">
            <button class="admin-tab active" data-pane="tipos" onclick="switchAdminTab('tipos')">Tipos</button>
            <button class="admin-tab" data-pane="status" onclick="switchAdminTab('status')">Status</button>
            <button class="admin-tab" data-pane="responsaveis" onclick="switchAdminTab('responsaveis')">Respon.</button>
            <button class="admin-tab" data-pane="areas" onclick="switchAdminTab('areas')">Áreas</button>
            <button class="admin-tab" data-pane="aparencia" onclick="switchAdminTab('aparencia')">Aparência</button>
            <button class="admin-tab" data-pane="foto" onclick="switchAdminTab('foto')">Foto</button>
            <button class="admin-tab" data-pane="tema" onclick="switchAdminTab('tema')">🎨 Tema</button>
        </div>

        <div class="admin-pane active" id="pane-tipos">
            <ul class="admin-list" id="listaTipos"></ul>
            <div class="admin-add">
                <input type="color" id="novoTipoCor" value="#4caf50">
                <input type="text" id="novoTipoLabel" placeholder="Nome do tipo (ex.: Urgente)">
                <button class="btn btn-primary" onclick="addTipo()">Adicionar</button>
            </div>
        </div>

        <div class="admin-pane" id="pane-status">
            <ul class="admin-list" id="listaStatus"></ul>
            <div class="admin-add">
                <input type="color" id="novoStatusCor" value="#9e9e9e">
                <input type="text" id="novoStatusLabel" placeholder="Nome do status (ex.: Pausado)">
                <button class="btn btn-primary" onclick="addStatus()">Adicionar</button>
            </div>
        </div>

        <div class="admin-pane" id="pane-responsaveis">
            <ul class="admin-list" id="listaResponsaveis"></ul>
            <div class="admin-add">
                <input type="text" id="novoResponsavel" placeholder="Nome do responsável" onkeydown="if(event.key==='Enter') addResponsavel()">
                <button class="btn btn-primary" onclick="addResponsavel()">Adicionar</button>
            </div>

/* ============================================================

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dateKeyFromDate(dt){ return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(k){ const [y,m,d]=k.split('-'); return `${Number(d)}/${Number(m)}/${Number(y)}`; }
function addDays(key,n){ const d = parseDateKey(key); d.setDate(d.getDate()+n); return dateKeyFromDate(d); }
function daysBetween(a,b){ return Math.round((parseDateKey(b)-parseDateKey(a))/86400000); }
function escapeHtml(t){ if(t==null) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function hexToRgb(hex){ const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i); if(!m) return {r:128,g:128,b:128}; return {r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}; }
function mix(a,b,t){ return {r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t)}; }
function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tipoCss(cor){ const base = hexToRgb(cor||'#888'); const bg = rgbToHex(mix(base,{r:255,g:255,b:255},.85)); const txt = rgbToHex(mix(base,{r:0,g:0,b:0},.45)); return `background:${bg};border-left-color:${cor||'#888'};color:${txt};`; }
function getTipo(id){ return (data.config.tipos||[]).find(t=>t.id===id) || {id, label:id||'Sem tipo', cor:'#888'}; }
function getStatus(id){ if(!id) return null; return (data.config.status||[]).find(s=>s.id===id) || {id, label:id, cor:'#888'}; }
function corAutomatica(label){
    let h = 0;
    for(let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return PALETA[h % PALETA.length];
}
function getRespCor(label){ const r = (data.config.responsaveis || []).find(x => x.label === label); return r ? r.cor : '#888'; }
function getAreaCor(label){ const a = (data.config.areas || []).find(x => x.label === label); return a ? a.cor : '#888'; }
function badgeStyle(cor){
    const base = hexToRgb(cor || '#888');
    const bg = rgbToHex(mix(base, {r:255,g:255,b:255}, 0.82));
    const txt = rgbToHex(mix(base, {r:0,g:0,b:0}, 0.35));
    return `background:${bg};color:${txt};`;
}

function getTemaAtivo(){
    const id = data.config.temaAtivo || 'default';
    return (data.config.temas || []).find(t => t.id === id) || (data.config.temas || [])[0];
}

function aplicarTema(){
    const tema = getTemaAtivo();
    if(!tema) return;
    const root = document.documentElement;
    const vars = tema.vars || {};
    for (const [key, value] of Object.entries(vars)) {
        root.style.setProperty(key, value);
    }
    // Aplica a cor de fundo do body (respeitando o background configurado em Aparência)
    aplicarBackground();
    // HUD
    const hud = document.getElementById('doomHud');
    if(hud) hud.classList.toggle('oculto', !tema.hudVisivel);
    // Foto
    aplicarUserPhoto();
}

function selecionarTema(id){
    data.config.temaAtivo = id;
    cacheLocal();
    aplicarTema();
    renderThemeAdmin();
    render();
}

function duplicarTemaAtivo(){
    const atual = getTemaAtivo();
    if(!atual) return;
    const nome = prompt('Nome do novo tema:', atual.nome + ' (cópia)');
    if(!nome) return;
    const novo = {
        id: 'tema-' + Date.now(),
        nome: nome.trim(),
        builtIn: false,
        hudVisivel: atual.hudVisivel,
        vars: JSON.parse(JSON.stringify(atual.vars))
    };
    data.config.temas.push(novo);
    data.config.temaAtivo = novo.id;
    cacheLocal();
    aplicarTema();
    renderThemeAdmin();
    render();
}

function excluirTemaAtivo(){
    const atual = getTemaAtivo();
    if(!atual) return;
    if(atual.builtIn){ alert('Temas predefinidos não podem ser excluídos.'); return; }
    if(!confirm(`Excluir o tema "${atual.nome}"?`)) return;
    data.config.temas = data.config.temas.filter(t => t.id !== atual.id);
    data.config.temaAtivo = 'default';
    cacheLocal();
    aplicarTema();
    renderThemeAdmin();
    render();
}

function resetarTemaAtivo(){
    const atual = getTemaAtivo();
    if(!atual) return;
    if(atual.builtIn){
        // Resetar um tema builtIn = voltar ao padrão original
        if(!confirm(`Restaurar o tema "${atual.nome}" ao padrão?`)) return;
        if(atual.id === 'default') atual.vars = JSON.parse(JSON.stringify(THEME_VARS_DEFAULT));
        else if(atual.id === 'doom') atual.vars = JSON.parse(JSON.stringify(THEME_VARS_DOOM));
    } else {
        if(!confirm('Restaurar o tema atual ao padrão (Default)?')) return;
        atual.vars = JSON.parse(JSON.stringify(THEME_VARS_DEFAULT));
        atual.hudVisivel = false;
    }
    cacheLocal();
    aplicarTema();
    renderThemeAdmin();
    render();
}

function renomearTemaAtivo(nome){
    const atual = getTemaAtivo();
    if(!atual) return;
    nome = (nome || '').trim();
    if(!nome) return;
    atual.nome = nome;
    cacheLocal();
    renderThemeAdmin();
}

function editarVarTema(key, value){
    const atual = getTemaAtivo();
    if(!atual) return;
    atual.vars[key] = value;
    cacheLocal();
    aplicarTema();
    render();
}

function toggleHudTema(visivel){
    const atual = getTemaAtivo();
    if(!atual) return;
    atual.hudVisivel = !!visivel;
    cacheLocal();
    aplicarTema();
}

async function loadFromGitHub(){
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try { const r = await fetch(url+'?t='+Date.now()); if(!r.ok) throw new Error('nf'); return await r.json(); }
    catch(e){ console.warn('Sem dados remotos:', e); return null; }
}
async function loadData(){
    const raw = localStorage.getItem(CACHE_KEY);
    const t = Number(localStorage.getItem(CACHE_TIME_KEY)||0);
    if(raw && t && (Date.now()-t < CACHE_DURATION)){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    const remote = await loadFromGitHub();
    if(remote){ data = remote; prepararDados(); cacheLocal(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); return; }
    if(raw){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    cacheLocal();
}
function prepararDados(){
    if(!data.eventos) data.eventos = [];
    if(!data.config) data.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if(!data.config.tipos) data.config.tipos = JSON.parse(JSON.stringify(DEFAULT_CONFIG.tipos));
    if(!data.config.status) data.config.status = JSON.parse(JSON.stringify(DEFAULT_CONFIG.status));
    if(!data.config.background) data.config.background = { tipo:'cor', cor:'#f4f7fa', imagem:'' };
    if(data.config.userPhoto === undefined) data.config.userPhoto = '';
    if(!data.config.temas || !Array.isArray(data.config.temas) || data.config.temas.length === 0){
        data.config.temas = [
            { id: 'default', nome: 'Default', builtIn: true, hudVisivel: false, vars: JSON.parse(JSON.stringify(THEME_VARS_DEFAULT)) },
            { id: 'doom',    nome: 'Doom',    builtIn: true, hudVisivel: true,  vars: JSON.parse(JSON.stringify(THEME_VARS_DOOM)) }
        ];
    }
    // Garante que os temas built-in existam
    if(!data.config.temas.find(t => t.id === 'default')){
        data.config.temas.unshift({ id: 'default', nome: 'Default', builtIn: true, hudVisivel: false, vars: JSON.parse(JSON.stringify(THEME_VARS_DEFAULT)) });
    }
    if(!data.config.temas.find(t => t.id === 'doom')){
        data.config.temas.push({ id: 'doom', nome: 'Doom', builtIn: true, hudVisivel: true, vars: JSON.parse(JSON.stringify(THEME_VARS_DOOM)) });
    }
    if(!data.config.temaAtivo) data.config.temaAtivo = 'default';

    data.config.responsaveis = (data.config.responsaveis || []).map(r =>
        typeof r === 'string' ? { label: r, cor: corAutomatica(r) } : r
    );
    data.config.areas = (data.config.areas || []).map(a =>
        typeof a === 'string' ? { label: a, cor: corAutomatica(a) } : a
    );

    data.eventos.forEach(ev=>{
        if(!ev.dataInicio && ev.data){ ev.dataInicio = ev.data; delete ev.data; }
        if(!ev.dataFim) ev.dataFim = ev.dataInicio;
        if(ev.responsavel === undefined) ev.responsavel = '';
        if(ev.area === undefined) ev.area = '';
        if(ev.status === undefined) ev.status = '';
        if(ev.ordem === undefined) ev.ordem = ev.id*10;
    });
    let max = 0;
    data.eventos.forEach(e=>{ if(e.id > max) max = e.id; });
    nextId = max+1;
}
function cacheLocal(){ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }

   HUD
============================================================ */
function atualizarHud(){
    const mesAtual = currentDate.getFullYear() + '-' + pad(currentDate.getMonth()+1);
    const evsDoMes = data.eventos.filter(ev => (ev.dataInicio||'').startsWith(mesAtual) || (ev.dataFim||'').startsWith(mesAtual));
    const total = evsDoMes.length;
    document.getElementById('hudResp').textContent = (data.config.responsaveis||[]).length;
    document.getElementById('hudArea').textContent = (data.config.areas||[]).length;
    document.getElementById('hudTipo').textContent = (data.config.tipos||[]).length;
    document.getElementById('hudStat').textContent = (data.config.status||[]).length;
    document.getElementById('hudTotalEventos').textContent = total;

    const statusFinal = (data.config.status||[]).find(s => /finaliz/i.test(s.label));
    const statusAndando = (data.config.status||[]).find(s => /andamento/i.test(s.label));
    const finalizados = statusFinal ? evsDoMes.filter(e => e.status === statusFinal.id).length : 0;
    const andando = statusAndando ? evsDoMes.filter(e => e.status === statusAndando.id).length : 0;
    const pctF = total > 0 ? Math.round((finalizados/total)*100) : 0;
    const pctA = total > 0 ? Math.round((andando/total)*100) : 0;
    document.getElementById('hudPctFinalizados').textContent = pctF + '%';
    document.getElementById('hudPctAndamento').textContent = pctA + '%';

    const armsEl = document.getElementById('hudArms');
    const tipos = (data.config.tipos||[]).slice(0, 6);
    let armsHtml = '';
    for(let i=0;i<6;i++){
        const t = tipos[i];
        if(t){
            const ativo = filtros.tipo === t.id;
            armsHtml += `<div class="hud-arm ${ativo?'ativo':''}" onclick="toggleFiltroTipo('${escapeHtml(t.id)}')" title="${escapeHtml(t.label)}" style="position:relative;">${i+1}<span class="arm-cor" style="background:${escapeHtml(t.cor)}"></span></div>`;
        } else {
            armsHtml += `<div class="hud-arm" style="opacity:.25;">·</div>`;
        }
    }
    armsEl.innerHTML = armsHtml;

    const keysEl = document.getElementById('hudKeys');
    keysEl.innerHTML = (data.config.status||[]).slice(0,5).map(s => {
        const ativo = filtros.status === s.id;
        return `<div class="hud-key ${ativo?'ativo':''}" style="background:linear-gradient(180deg, ${s.cor} 0%, #2a2a2a 100%);color:${s.cor};" onclick="toggleFiltroStatus('${escapeHtml(s.id)}')" title="${escapeHtml(s.label)}"></div>`;
    }).join('');
}
function toggleFiltroTipo(id){ filtros.tipo = (filtros.tipo === id) ? '' : id; popularFiltros(); render(); }
function toggleFiltroStatus(id){ filtros.status = (filtros.status === id) ? '' : id; popularFiltros(); render(); }

    }

async function listarArquivosPasta(pasta){
    const caminhos = [pasta, 'calendario/' + pasta];
    for(const p of caminhos){
        try{
            const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${p}?ref=${GITHUB_BRANCH}`);
            if(!r.ok) continue;
            const lista = await r.json();
            if(Array.isArray(lista)){
                const imgs = lista.filter(f => f.type === 'file' && /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(f.name))
                    .map(f => f.name).sort((a,b)=>a.localeCompare(b, 'pt-BR', {numeric:true}));
                if(imgs.length) return imgs;
            }
        }catch(e){}
    }
    return [];
}

    if(backgroundsCarregados) return;
    backgroundsCarregados = true;
    backgroundsDisponiveis = await listarArquivosPasta(BG_FOLDER);

}

async function salvarTudo(){
    if(!authToken){ alert('Faça login como admin (🔧 Admin) antes de salvar.'); return; }
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha;
    try { const r = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}`, {headers:{Authorization:`Bearer ${authToken}`}}); if(r.ok) sha = (await r.json()).sha; } catch(e){}
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = { message:`Atualiza planner - ${new Date().toLocaleString('pt-BR')}`, content, branch:GITHUB_BRANCH };
    if(sha) body.sha = sha;
    try {
        const put = await fetch(apiUrl, { method:'PUT', headers:{Authorization:`Bearer ${authToken}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if(!put.ok) throw new Error((await put.json()).message||'Erro');
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal();
        alert('✅ Salvo no GitHub com sucesso!');
    } catch(e){ alert('Erro ao salvar: '+e.message); }
}

async function validarToken(token){
    try {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {headers:{Authorization:`Bearer ${token}`}});
        if(!r.ok) return false;
        const info = await r.json();
        return info.permissions && info.permissions.push === true;
    } catch(e){ return false; }
}
async function abrirAdmin(){
    if(!authToken){
        const t = prompt('Cole seu token do GitHub (com permissão de escrita):');
        if(!t) return;

        authToken = t;
        sessionStorage.setItem(TOKEN_KEY, t);

    const cor = document.getElementById('novoStatusCor').value;
    if(!label){ alert('Informe o nome.'); return; }
    let id = slug(label) || ('status-'+Date.now());
    if(data.config.status.find(s=>s.id===id)) id = id+'-'+Date.now();
    data.config.status.push({id,label,cor});
    document.getElementById('novoStatusLabel').value = '';
    cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render();
}
function editarStatusLabel(i,v){ data.config.status[i].label = v.trim()||data.config.status[i].label; cacheLocal(); popularFiltros(); atualizarHud(); render(); }
function editarStatusCor(i,v){ data.config.status[i].cor = v; cacheLocal(); renderAdminListas(); atualizarHud(); render(); }
function delStatus(i){ const s=data.config.status[i]; if(!confirm(`Remover "${s.label}"?`)) return; data.config.status.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function moverStatus(i,d){ moverItem(data.config.status, i, d, renderAdminListas); }

function addResponsavel(){

function editarRespLabel(i,v){ v=v.trim(); if(!v){ renderAdminListas(); return; } data.config.responsaveis[i].label = v; cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function editarRespCor(i,v){ data.config.responsaveis[i].cor = v; cacheLocal(); renderAdminListas(); atualizarHud(); render(); }

function addArea(){

    if(data.config.areas.find(a => a.label === v)){ alert('Já cadastrada.'); return; }

function delArea(i){ if(!confirm('Remover?')) return; data.config.areas.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function editarAreaLabel(i,v){ v=v.trim(); if(!v){ renderAdminListas(); return; } data.config.areas[i].label = v; cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function editarAreaCor(i,v){ data.config.areas[i].cor = v; cacheLocal(); renderAdminListas(); atualizarHud(); render(); }
function moverArea(i,d){ moverItem(data.config.areas, i, d, renderAdminListas); }

function moverItem(lista, i, dir, rerender){
    const j = i + dir;
    if(j < 0 || j >= lista.length) return;
    const tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp;
    cacheLocal();
    if(rerender) rerender();
    popularFiltros(); atualizarHud(); render();
}

function popularFiltros(){
    const ft = document.getElementById('filterTipo');
    const fs = document.getElementById('filterStatus');
    const fr = document.getElementById('filterResp');
    const fa = document.getElementById('filterArea');
    ft.innerHTML = '<option value="">Tipo: todos</option>' + (data.config.tipos||[]).map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.label)}</option>`).join('');
    fs.innerHTML = '<option value="">Status: todos</option>' + (data.config.status||[]).map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.label)}</option>`).join('');
    fr.innerHTML = '<option value="">Resp: todos</option>' + (data.config.responsaveis||[]).map(r=>`<option value="${escapeHtml(r.label)}">${escapeHtml(r.label)}</option>`).join('');
    fa.innerHTML = '<option value="">Área: todas</option>' + (data.config.areas||[]).map(a=>`<option value="${escapeHtml(a.label)}">${escapeHtml(a.label)}</option>`).join('');
    ft.value = filtros.tipo; fs.value = filtros.status; fr.value = filtros.responsavel; fa.value = filtros.area;
}
function aplicarFiltros(){
    filtros.tipo = document.getElementById('filterTipo').value;
    filtros.status = document.getElementById('filterStatus').value;
    filtros.responsavel = document.getElementById('filterResp').value;
    filtros.area = document.getElementById('filterArea').value;
    render();
}
function limparFiltros(){ filtros = {tipo:'',status:'',responsavel:'',area:''}; popularFiltros(); render(); }
function passaFiltro(ev){
    if(filtros.tipo && ev.tipo !== filtros.tipo) return false;
    if(filtros.status && ev.status !== filtros.status) return false;
    if(filtros.responsavel && ev.responsavel !== filtros.responsavel) return false;
    if(filtros.area && ev.area !== filtros.area) return false;
    return true;
}
function temFiltroAtivo(){ return filtros.tipo || filtros.status || filtros.responsavel || filtros.area; }

============================================================ */
function navPrev(){
    const y = currentDate.getFullYear(), m = currentDate.getMonth(), d = currentDate.getDate();
    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m-1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d-7);
    else currentDate = new Date(y, m, d-1);
    sincronizarSelects(); render();
}
function navNext(){
    const y = currentDate.getFullYear(), m = currentDate.getMonth(), d = currentDate.getDate();
    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m+1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d+7);
    else currentDate = new Date(y, m, d+1);
    sincronizarSelects(); render();
}
function irHoje(){ currentDate = new Date(); sincronizarSelects(); render(); }
function sincronizarSelects(){
    document.getElementById('selectMes').value = currentDate.getMonth();
    document.getElementById('selectAno').value = currentDate.getFullYear();
}
function initSelects(){
    const sm = document.getElementById('selectMes');

function setView(v){ view = v; localStorage.setItem(VIEW_KEY, v); render(); }
function navDiaPrev(){ currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()-1); sincronizarSelects(); render(); }
function navDiaNext(){ currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()+1); sincronizarSelects(); render(); }
function irParaDia(key){ currentDate = parseDateKey(key); sincronizarSelects(); render(); }

/* ============================================================
   MAPA
============================================================ */
function construirMapa(){
    const mapa = {};
    const evs = data.eventos.filter(passaFiltro).sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    evs.forEach(ev=>{
        const ini = ev.dataInicio, fim = ev.dataFim||ini;
        if(!ini||!fim) return;
        let cur = ini;
        while(cur <= fim){
            if(!mapa[cur]) mapa[cur] = [];
            const position = ini===fim ? 'single' : (cur===ini ? 'start' : (cur===fim ? 'end' : 'middle'));
            mapa[cur].push({ev, position});
            cur = addDays(cur, 1);
        }
    });
    return mapa;
}
