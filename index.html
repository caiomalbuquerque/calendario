<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMA Planner — DOOM Edition</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    :root {
        --doom-bg: #3a3a3a;
        --doom-panel: #4a4a4a;
        --doom-panel-dark: #2a2a2a;
        --doom-light: #8a8a8a;
        --doom-dark: #1a1a1a;
        --doom-red: #c81010;
        --doom-red-bright: #e81818;
        --doom-yellow: #d4a72c;
        --doom-text: #d0d0d0;
        --doom-cyan: #4ac0d0;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        font-family: 'VT323', 'Courier New', monospace;
        background: #1a1a1a; color: var(--doom-text);
        min-height: 100vh;
        background-attachment: fixed; background-size: cover; background-position: center;
        letter-spacing: .5px;
        font-size: 17px;
    }

    .container {
        margin: 0 auto;
        background: linear-gradient(180deg, #565656 0%, #4a4a4a 50%, #404040 100%);
        border-top: 3px solid #b0b0b0;
        border-left: 3px solid #8a8a8a;
        border-right: 3px solid #1a1a1a;
        border-bottom: 3px solid #0a0a0a;
        padding: 0;
    }

    /* ============================================================
       HUD (maior, com face expandida)
    ============================================================ */
    .doom-hud {
        display: grid;
        grid-template-columns:
            minmax(80px, 1fr)
            minmax(100px, 1.2fr)
            minmax(90px, 1fr)
            minmax(96px, 1fr)
            minmax(90px, 1fr)
            minmax(80px, .8fr)
            minmax(160px, 1.8fr);
        gap: 5px;
        background: #262626;
        border-top: 3px solid #0a0a0a;
        border-bottom: 3px solid #b0b0b0;
        padding: 7px;
        margin: 0 0 14px;
        font-family: 'Press Start 2P', monospace;
        position: sticky; top: 0; z-index: 50;
    }
    @media (max-width: 900px) {
        .doom-hud { grid-template-columns: repeat(4, 1fr); }
        .doom-hud .hud-block.hud-ammo { grid-column: 1 / -1; }
    }
    @media (max-width: 560px) {
        .doom-hud { grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 4px; }
    }

    .hud-block {
        background: linear-gradient(180deg, #5a5a5a 0%, #3f3f3f 60%, #2c2c2c 100%);
        border-top: 2px solid #9a9a9a;
        border-left: 2px solid #7a7a7a;
        border-right: 2px solid #0a0a0a;
        border-bottom: 2px solid #000;
        padding: 8px 4px 6px;
        text-align: center;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px;
        min-height: 76px;
        position: relative;
    }

    .hud-value {
        font-family: 'Press Start 2P', monospace;
        font-size: clamp(15px, 1.7vw, 24px);
        font-weight: 900;
        color: var(--doom-red);
        text-shadow: 1px 1px 0 #5a0000, 2px 2px 0 #000, 0 0 8px rgba(232,24,24,.4);
        line-height: 1; letter-spacing: -1px;
    }
    .hud-value.small { font-size: clamp(12px, 1.2vw, 16px); }
    .hud-value.yellow { color: var(--doom-yellow); text-shadow: 1px 1px 0 #4a3a00, 2px 2px 0 #000, 0 0 8px rgba(212,167,44,.5); }
    .hud-value.cyan { color: var(--doom-cyan); text-shadow: 1px 1px 0 #003a4a, 2px 2px 0 #000, 0 0 8px rgba(74,192,208,.5); }
    .hud-value.green { color: #4ac04a; text-shadow: 1px 1px 0 #003a00, 2px 2px 0 #000, 0 0 8px rgba(74,192,74,.5); }

    .hud-label {
        font-family: 'VT323', monospace;
        font-size: 11px; letter-spacing: 1.5px;
        color: #b0b0b0; text-transform: uppercase;
        text-shadow: 1px 1px 0 #000;
    }

    /* FACE — maior */
    .hud-face {
        background: linear-gradient(180deg, #6a5a4a 0%, #3f3226 100%);
        border-top: 2px solid #9a8a7a;
        border-left: 2px solid #7a6a5a;
        border-right: 2px solid #0a0a0a;
        border-bottom: 2px solid #000;
        padding: 4px;
        display: flex; align-items: center; justify-content: center;
        min-height: 76px;
        overflow: hidden;
    }
    .hud-face img {
        max-width: 100%; max-height: 72px;
        object-fit: contain;
        image-rendering: pixelated;
        filter: contrast(1.08) saturate(1.05);
        display: block;
    }

    .hud-arms {
        display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
        gap: 1px; background: #1a1a1a; padding: 1px;
        width: 100%; max-width: 84px;
    }
    .hud-arm {
        background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
        border: 1px solid #0a0a0a;
        color: var(--doom-red);
        font-family: 'Press Start 2P', monospace;
        font-size: 10px; font-weight: 900;
        display: flex; align-items: center; justify-content: center;
        aspect-ratio: 1; min-height: 14px;
        text-shadow: 1px 1px 0 #000;
        cursor: pointer; transition: filter .1s;
    }
    .hud-arm:hover { filter: brightness(1.25); }
    .hud-arm.ativo { background: linear-gradient(180deg, var(--doom-yellow) 0%, #8a6a00 100%); color: #2a1a00; }
    .hud-arm .arm-cor { display: block; width: 5px; height: 5px; border-radius: 50%; position: absolute; top: 2px; right: 2px; border: 1px solid #000; }

    .hud-keys { display: flex; gap: 4px; align-items: center; justify-content: center; }
    .hud-key {
        width: 13px; height: 18px;
        border: 1px solid #000; border-top-color: #bbb; border-left-color: #999;
        border-radius: 2px 2px 4px 4px;
        position: relative;
        background: linear-gradient(180deg, #777 0%, #3a3a3a 100%);
        cursor: pointer; transition: filter .1s;
    }
    .hud-key::before {
        content: ''; position: absolute;
        top: -3px; left: 50%; transform: translateX(-50%);
        width: 6px; height: 6px;
        border: 1px solid #000; border-radius: 50%; background: inherit;
    }
    .hud-key:hover { filter: brightness(1.3); }
    .hud-key.ativo { box-shadow: 0 0 8px currentColor, inset 0 0 4px currentColor; }

    .hud-ammo { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px 8px; width: 100%; padding: 3px 5px; align-items: center; }
    .hud-ammo-item { display: grid; grid-template-columns: 1fr auto; gap: 5px; align-items: baseline; }
    .hud-ammo-item .lbl { color: #b0b0b0; text-shadow: 1px 1px 0 #000; font-family: 'VT323', monospace; font-size: 12px; letter-spacing: 1px; text-align: left; }
    .hud-ammo-item .num { color: var(--doom-yellow); text-shadow: 1px 1px 0 #000; font-weight: 900; text-align: right; font-family: 'Press Start 2P', monospace; font-size: 10px; }

    /* ============================================================
       HEADER (título inline)
    ============================================================ */
    .header-wrapper {
        display: flex; justify-content: flex-start; align-items: baseline;
        gap: 16px; flex-wrap: wrap;
        padding: 0 20px;
        margin-bottom: 12px;
    }
    .title-block {
        display: flex;
        align-items: baseline;
        gap: clamp(10px, 1.5vw, 22px);
        flex-wrap: wrap;
    }
    .title-block h1 {
        margin: 0;
        font-family: 'Press Start 2P', monospace;
        font-weight: 900; color: var(--doom-red);
        letter-spacing: 2px; line-height: 1;
        text-transform: uppercase;
        text-shadow: 2px 2px 0 #000, 0 0 12px rgba(232,24,24,.5);
        font-size: clamp(20px, 4vw, 46px);
    }
    .year-inline {
        font-family: 'VT323', monospace;
        font-size: clamp(16px, 2vw, 26px);
        color: #b0b0b0;
        letter-spacing: 2px;
        text-shadow: 1px 1px 0 #000;
    }

    /* ============================================================
       Toolbar
    ============================================================ */
    .toolbar {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
        border-top: 2px solid #6a6a6a;
        border-left: 2px solid #5a5a5a;
        border-right: 2px solid #0a0a0a;
        border-bottom: 2px solid #000;
        padding: 8px 12px; margin: 0 20px 10px;
    }
    .toolbar select {
        border: 2px inset #5a5a5a; background: #3a3a3a; color: var(--doom-yellow);
        font-family: 'VT323', monospace; font-size: 15px; font-weight: 600; cursor: pointer;
        padding: 4px 8px; text-shadow: 1px 1px 0 #000;
    }
    .toolbar .spacer { flex: 1; }

    .filters {
        display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
        background: linear-gradient(180deg, #3a2a00 0%, #2a1a00 100%);
        border-top: 2px solid #7a5a1a;
        border-left: 2px solid #5a3a0a;
        border-right: 2px solid #0a0600;
        border-bottom: 2px solid #000;
        padding: 8px 12px; margin: 0 20px 10px;
    }
    .filters select {
        border: 2px inset #5a4a1a; background: #3a2a00; color: var(--doom-yellow);
        font-family: 'VT323', monospace; font-size: 15px; font-weight: 600; cursor: pointer;
        padding: 4px 8px; text-shadow: 1px 1px 0 #000;
    }
    .filters .lbl { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--doom-yellow); text-transform: uppercase; letter-spacing: 1px; text-shadow: 1px 1px 0 #000; }
    .filters .count { color: var(--doom-yellow); font-family: 'VT323', monospace; font-size: 14px; font-weight: 700; margin-left: auto; text-shadow: 1px 1px 0 #000; }

    .btn {
        border: 2px outset #7a7a7a; border-radius: 0; cursor: pointer;
        font-family: 'Press Start 2P', monospace; font-size: 9px; font-weight: 900;
        transition: .08s; white-space: nowrap; text-transform: uppercase; letter-spacing: .5px;
        padding: 8px 12px; text-shadow: 1px 1px 0 rgba(0,0,0,.5);
    }
    .btn:active { border-style: inset; transform: translateY(1px); }
    .btn-primary { background: #8a1010; color: #fff; border-color: #c04040; }
    .btn-primary:hover { background: #a81818; }
    .btn-secondary { background: #2a4a6a; color: #fff; border-color: #6a8aa8; }
    .btn-secondary:hover { background: #3a6a8a; }
    .btn-success { background: #1a6a2a; color: #fff; border-color: #4a9a5a; }
    .btn-success:hover { background: #2a8a3a; }
    .btn-danger { background: #8a1010; color: #fff; }
    .btn-nav { background: #5a5a5a; color: var(--doom-yellow); min-width: 34px; padding: 6px 10px; }
    .btn-nav:hover { background: #6a6a6a; }
    .btn-toggle { background: #3a3a3a; color: #b0b0b0; border-color: #6a6a6a; }
    .btn-toggle.active { background: #8a1010; color: #fff; border-color: #c04040; }
    .btn-admin { background: #6a4a00; color: #f5d99b; border-color: #a08040; }
    .btn-admin:hover { background: #8a5a00; }
    .btn-mini {
        border: 1px outset #666; border-radius: 0; cursor: pointer;
        font-weight: 700; font-family: 'VT323', monospace; font-size: 13px; padding: 3px 7px;
        text-shadow: 1px 1px 0 rgba(0,0,0,.5);
    }
    .btn-mini:active { border-style: inset; }
    .btn-mini.edit { background: #2a4a6a; color: #fff; border-color: #5a7a9a; }
    .btn-mini.del { background: #8a1010; color: #fff; border-color: #b04040; }
    .btn-mini.dup { background: #1a6a2a; color: #fff; border-color: #4a8a5a; }
    .btn-mini.up, .btn-mini.down { background: #5a5a5a; color: #f5d99b; border-color: #8a8a8a; }
    .btn-mini.up:disabled, .btn-mini.down:disabled { opacity: .3; cursor: not-allowed; }

    /* ============================================================
       Calendário
    ============================================================ */
    .calendar { width: calc(100% - 40px); margin: 0 20px; border-collapse: separate; border-spacing: 2px; table-layout: fixed; }
    .calendar thead th {
        background: linear-gradient(180deg, #8a1010 0%, #5a0808 100%);
        color: #f0d0d0; font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: 900;
        text-transform: uppercase; letter-spacing: 1px; padding: 8px 4px;
        text-shadow: 1px 1px 0 #000;
        border-top: 2px solid #c04040; border-left: 2px solid #a02020;
        border-right: 2px solid #300000; border-bottom: 2px solid #1a0000;
    }
    .calendar thead th.weekend { background: linear-gradient(180deg, #6a0808 0%, #3a0404 100%); }
    .calendar td {
        background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
        border-top: 2px solid #9a9a9a; border-left: 2px solid #7a7a7a;
        border-right: 2px solid #0a0a0a; border-bottom: 2px solid #000;
        vertical-align: top; padding: 4px 5px; position: relative; cursor: pointer;
        transition: filter .1s; overflow: hidden;
        height: clamp(85px, 12vh, 200px);
    }
    .calendar td:hover { filter: brightness(1.15); }
    .calendar td.other-month { background: linear-gradient(180deg, #3a3a3a 0%, #262626 100%); cursor: default; opacity: .55; }
    .calendar td.other-month .day-number { color: #666; }
    .calendar td.weekend .day-number { color: var(--doom-yellow); }

    .day-number {
        font-family: 'Press Start 2P', monospace; font-weight: 900;
        font-size: clamp(11px, 1.1vw, 16px);
        color: #e0e0e0; display: inline-block; text-align: center;
        text-shadow: 1px 1px 0 #000; line-height: 1; margin-bottom: 4px;
    }
    .day-number.hoje {
        background: linear-gradient(180deg, #e81818 0%, #8a0808 100%);
        color: #fff !important; border: 2px outset #ff3030;
        padding: 3px 5px; min-width: 24px; text-shadow: 1px 1px 0 #000;
    }
    .day-badge {
        position: absolute; top: 4px; right: 4px;
        background: linear-gradient(180deg, #e81818 0%, #8a0808 100%);
        border: 1px outset #ff4040; color: #fff;
        font-family: 'Press Start 2P', monospace; font-size: 9px; font-weight: 900;
        padding: 2px 5px; line-height: 1; text-shadow: 1px 1px 0 #000;
    }

    .event-chip {
        border-left: 4px solid; cursor: grab; transition: filter .1s;
        display: block; word-break: break-word; white-space: normal; flex-shrink: 0;
        font-family: 'VT323', monospace; font-size: 14px;
        padding: 4px 7px;
        border-top: 1px solid rgba(255,255,255,.15);
        border-right: 1px solid rgba(0,0,0,.4);
        border-bottom: 1px solid rgba(0,0,0,.6);
        text-shadow: 1px 1px 0 rgba(0,0,0,.15);
        line-height: 1.25;
    }
    .event-chip:hover { filter: brightness(1.15); }
    .event-chip.dragging { opacity: .4; }
    .chip-title { font-weight: 700; display: block; font-size: 15px; }
    .continuation-mark { display: inline-block; opacity: .7; font-weight: 700; }

    .events-list {
        display: flex; flex-direction: column; gap: 3px; margin-top: 3px;
        max-height: clamp(60px, 9vh, 150px); overflow-y: auto; overflow-x: hidden; padding-right: 2px;
    }
    .events-list::-webkit-scrollbar { width: 6px; }
    .events-list::-webkit-scrollbar-track { background: #1a1a1a; }
    .events-list::-webkit-scrollbar-thumb { background: #6a6a6a; border: 1px solid #0a0a0a; }

    .chip-header { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; width: 100%; margin-bottom: 2px; }
    .chip-header .continuation-mark { margin-right: 2px; font-size: 13px; }
    .badge {
        display: inline-block; border-radius: 0;
        font-family: 'VT323', monospace; font-size: 12px; font-weight: 700;
        letter-spacing: .3px; line-height: 1.4; padding: 0 5px;
        max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        border: 1px outset rgba(0,0,0,.4);
        text-shadow: 1px 1px 0 rgba(255,255,255,.25);
    }
    .badge-area { font-style: italic; font-weight: 600; }
    .badge-status { display: inline-flex; align-items: center; gap: 4px; }
    .badge-status .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.5); }

    /* Semana */
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 20px; }
    .week-col {
        background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
        border-top: 2px solid #9a9a9a; border-left: 2px solid #7a7a7a;
        border-right: 2px solid #0a0a0a; border-bottom: 2px solid #000;
        padding: 5px; min-height: clamp(220px, 42vh, 440px);
        display: flex; flex-direction: column; gap: 4px;
    }
    .week-col-header {
        background: linear-gradient(180deg, #8a1010 0%, #5a0808 100%);
        border: 2px outset #c04040; color: #fff; text-align: center;
        font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 5px;
        text-shadow: 1px 1px 0 #000; margin: -5px -5px 4px;
    }
    .week-col-header.hoje { background: linear-gradient(180deg, #e81818 0%, #8a0808 100%); box-shadow: inset 0 0 0 2px var(--doom-yellow); }
    .week-col-header .wk-day { display: block; font-size: 18px; line-height: 1.1; margin-top: 2px; }
    .week-col.weekend { background: linear-gradient(180deg, #4a3a3a 0%, #2a1a1a 100%); }

    /* Dia */
    .day-view { max-width: min(900px, 100%); margin: 0 auto; padding: 0 20px; }
    .day-view-header {
        background: linear-gradient(180deg, #8a1010 0%, #5a0808 100%);
        border: 3px outset #c04040; padding: 14px 18px; color: #fff;
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        margin-bottom: 12px; text-shadow: 1px 1px 0 #000;
    }
    .day-view-header h2 { margin: 0; font-family: 'Press Start 2P', monospace; font-size: clamp(14px, 1.7vw, 20px); text-shadow: 2px 2px 0 #000; }
    .day-view-header .sub { font-family: 'VT323', monospace; font-size: 15px; letter-spacing: 1px; opacity: .9; }
    .day-nav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    .day-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
    .day-strip-item {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
        border-top: 2px solid #9a9a9a; border-left: 2px solid #7a7a7a;
        border-right: 2px solid #0a0a0a; border-bottom: 2px solid #000;
        padding: 6px 2px; cursor: pointer; font-family: 'VT323', monospace; color: #d0d0d0; transition: .1s;
    }
    .day-strip-item:hover { filter: brightness(1.2); }
    .day-strip-item .ds-wd { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: .75; text-shadow: 1px 1px 0 #000; }
    .day-strip-item .ds-num { font-family: 'Press Start 2P', monospace; font-size: 14px; font-weight: 900; color: var(--doom-yellow); text-shadow: 1px 1px 0 #000; }
    .day-strip-item.hoje .ds-num { background: linear-gradient(180deg, #e81818 0%, #8a0808 100%); color: #fff; border: 1px outset #ff4040; padding: 2px 5px; }
    .day-strip-item.active { background: linear-gradient(180deg, #8a1010 0%, #5a0808 100%); border-color: #c04040; }
    .day-strip-item.active .ds-wd, .day-strip-item.active .ds-num { color: #fff; }
    .day-strip-item.weekend:not(.active) { background: linear-gradient(180deg, #4a3a3a 0%, #2a1a1a 100%); }

    .day-view-list { display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
    .day-view-list:empty::after {
        content: 'Nenhum evento neste dia. Arraste para cá ou clique em "Novo evento".';
        display: block; text-align: center; color: #888;
        border: 2px dashed #4a4a4a; padding: 40px 20px;
        font-family: 'VT323', monospace; font-size: 16px;
    }
    .day-card {
        border-left: 6px solid; padding: 10px 14px; cursor: grab;
        display: flex; flex-direction: column; gap: 5px; min-width: 0;
        border-top: 2px solid rgba(255,255,255,.2);
        border-right: 2px solid rgba(0,0,0,.5);
        border-bottom: 2px solid rgba(0,0,0,.7);
        font-family: 'VT323', monospace; font-size: 15px;
    }
    .day-card:hover { filter: brightness(1.06); }
    .day-card.dragging { opacity: .4; }
    .day-card .dc-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 10px; width: 100%; }
    .day-card .dc-title { font-weight: 700; width: 100%; min-width: 0; word-break: break-word; overflow-wrap: anywhere; line-height: 1.3; font-size: 17px; }
    .day-card .dc-actions { display: flex; gap: 4px; flex-shrink: 0; align-self: flex-start; }
    .day-card .dc-meta { opacity: .9; display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
    .day-card .dc-desc { opacity: .92; word-break: break-word; font-size: 14px; line-height: 1.4; }

    /* Lista */
    .list-day {
        background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 100%);
        border-top: 2px solid #9a9a9a; border-left: 2px solid #7a7a7a;
        border-right: 2px solid #0a0a0a; border-bottom: 2px solid #000;
        margin: 0 20px 10px; overflow: hidden;
    }
    .list-day-header {
        background: linear-gradient(180deg, #8a1010 0%, #5a0808 100%);
        color: #fff; padding: 8px 12px;
        font-family: 'Press Start 2P', monospace; font-size: 11px;
        display: flex; justify-content: space-between; align-items: center;
        text-shadow: 1px 1px 0 #000; letter-spacing: 1px;
    }
    .list-day-header.hoje { background: linear-gradient(180deg, #e81818 0%, #8a0808 100%); }

    .modal {
        background: linear-gradient(180deg, #565656 0%, #3a3a3a 100%);

    }
    .modal .field { margin-bottom: 10px; }
    .modal label {
        display: block; font-weight: 700; font-family: 'VT323', monospace; font-size: 15px;

    .events-day-list { margin: 12px 0; max-height: 340px; overflow-y: auto; }

    .events-day-list .event-row .info strong { display: block; font-size: 16px; word-break: break-word; margin: 3px 0; }

    .events-day-list .event-row .info .desc { opacity: .85; display: block; font-size: 14px; margin-top: 3px; }

    /* Admin */

    /* Aparência / Foto */
    .bg-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 6px; }
    .bg-item { border: 2px outset #5a5a5a; background: #2a2a2a; overflow: hidden; cursor: pointer; position: relative; }
    .bg-item:hover { border-color: var(--doom-yellow); }
    .bg-item.selected { border-color: var(--doom-red); box-shadow: 0 0 0 3px rgba(232,24,24,.3); }
    .bg-item img { display: block; width: 100%; height: 80px; object-fit: cover; }
    .bg-item .bg-nome { font-family: 'VT323', monospace; font-size: 12px; padding: 5px; color: #d0d0d0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bg-item .bg-check { position: absolute; top: 5px; right: 5px; background: var(--doom-red); color: #fff; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
    .bg-item.selected .bg-check { display: flex; }

    .bg-preview { height: 90px; border: 2px inset #2a2a2a; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: #d0d0d0; font-family: 'VT323', monospace; font-size: 14px; }
    .bg-preview .preview-tag { background: rgba(0,0,0,.7); padding: 4px 10px; border: 1px solid #6a6a6a; }
    .foto-preview {
        height: 100px; width: 100px; border: 2px inset #2a2a2a; background: #1a1a1a;
        display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .foto-preview img { max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }

    /* Teletubies */
    .teletubies-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 2000; pointer-events: none; }
    .teletubies-overlay.active { display: flex; }
    .teletubies-img { max-width: 60vw; max-height: 60vh; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6)); animation: popTubies .35s cubic-bezier(.34,1.56,.64,1); image-rendering: pixelated; }
    @keyframes popTubies {
        0%   { transform: scale(.5) rotate(-8deg); opacity: 0; }
        60%  { transform: scale(1.08) rotate(3deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    td.drop-target, .week-col.drop-target, .day-view-list.drop-target, .list-day-body.drop-target {
        box-shadow: inset 0 0 0 3px var(--doom-yellow) !important;

    }

    /* Responsivo */
    *, *::before, *::after { min-width: 0; }
    img, table { max-width: 100%; }
    body { padding: clamp(4px, 1vw, 14px); }
    .container { width: 100%; max-width: min(1800px, 100%); }
    .header-wrapper { padding: 0 clamp(10px, 1.5vw, 20px); gap: clamp(8px, 1.5vw, 20px); }

    @media (max-width: 800px) {
        .toolbar, .filters { margin: 0 10px 10px; padding: 6px 10px; }
        .toolbar .btn { flex: 1 1 auto; min-width: 70px; justify-content: center; }
        .toolbar .spacer { display: none; }
        .calendar, .list-day, .legend { margin-left: 10px; margin-right: 10px; }
        .week-grid { padding: 0 10px; grid-template-columns: repeat(7, minmax(120px, 1fr)); overflow-x: auto; }
        .day-view { padding: 0 10px; }
    }

    @media (max-width: 560px) {
        .container { padding: 8px 0; }
        .day-view-header { flex-direction: column; align-items: stretch; text-align: center; padding: 10px; }
        .day-nav { justify-content: center; }
        .day-strip { gap: 2px; }
        .day-strip-item { padding: 4px 1px; }
        .day-strip-item .ds-num { font-size: 11px; }
        .day-strip-item .ds-wd { font-size: 8px; }
        .modal { padding: 14px; }
        .modal .row2 { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="container">

    <!-- ============================================================
         HUD DOOM

            <span class="hud-label">Eventos</span>

        <div class="hud-block">

        <div class="hud-block" style="padding:5px;">

        <div class="hud-face" title="Mini-me" id="hudFaceWrap">

                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'font-size:28px;color:#c81010;font-family:Press Start 2P,monospace;\'>:(</span>';">

        <div class="hud-block">

        </div>

        <div class="hud-block hud-ammo">
            <div class="hud-ammo-item">
                <span class="lbl">RESP</span><span class="num" id="hudResp">0</span>
            </div>
            <div class="hud-ammo-item">
                <span class="lbl">ÁREA</span><span class="num" id="hudArea">0</span>
            </div>
            <div class="hud-ammo-item">
                <span class="lbl">TIPO</span><span class="num" id="hudTipo">0</span>
            </div>
            <div class="hud-ammo-item">
                <span class="lbl">STAT</span><span class="num" id="hudStat">0</span>
            </div>
        </div>
    </div>

    <!-- Header: título inline, sem logo à direita -->
    <div class="header-wrapper">

            <h1 id="monthTitle">PLANNER</h1>
            <span class="year-inline" id="yearTitle"></span>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-nav" onclick="navPrev()" title="Anterior">◄</button>
        <select id="selectMes"></select>
        <select id="selectAno"></select>
        <button class="btn btn-nav" onclick="navNext()" title="Próximo">►</button>
        <button class="btn btn-primary" onclick="irHoje()">📅 HOJE</button>
        <button class="btn btn-toggle" data-view="mes" onclick="setView('mes')">MÊS</button>
        <button class="btn btn-toggle" data-view="semana" onclick="setView('semana')">SEM</button>
        <button class="btn btn-toggle" data-view="dia" onclick="setView('dia')">DIA</button>
        <button class="btn btn-toggle" data-view="lista" onclick="setView('lista')">LISTA</button>
        <span class="spacer"></span>
        <button class="btn btn-secondary" onclick="novoEventoHoje()">+ NOVO</button>

        <button class="btn btn-success" onclick="salvarTudo()">💾 SALVAR</button>

    <div class="filters" id="filtersBar">

        <select id="filterStatus" onchange="aplicarFiltros()"></select>
        <select id="filterResp" onchange="aplicarFiltros()"></select>
        <select id="filterArea" onchange="aplicarFiltros()"></select>

    <div id="viewContainer"></div>

</div>

<!-- Modal do dia -->
<div class="modal-overlay" id="modalDia" onclick="if(event.target===this) fecharModalDia()">

        <div class="events-day-list" id="eventsDayList"></div>

<!-- Modal do formulário -->

</div>

/* ============================================================
   HELPERS
============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dateKeyFromDate(dt){ return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(k){ const [y,m,d]=k.split('-'); return `${Number(d)}/${Number(m)}/${Number(y)}`; }
function addDays(key,n){ const d = parseDateKey(key); d.setDate(d.getDate()+n); return dateKeyFromDate(d); }
function daysBetween(a,b){ return Math.round((parseDateKey(b)-parseDateKey(a))/86400000); }
function escapeHtml(t){ if(t==null) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function hexToRgb(hex){ const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i); if(!m) return {r:128,g:128,b:128}; return {r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}; }
function mix(a,b,t){ return {r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t)}; }
function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tipoCss(cor){ const base = hexToRgb(cor||'#888'); const bg = rgbToHex(mix(base,{r:255,g:255,b:255},.85)); const txt = rgbToHex(mix(base,{r:0,g:0,b:0},.45)); return `background:${bg};border-left-color:${cor||'#888'};color:${txt};`; }
function getTipo(id){ return (data.config.tipos||[]).find(t=>t.id===id) || {id, label:id||'Sem tipo', cor:'#888'}; }
function getStatus(id){ if(!id) return null; return (data.config.status||[]).find(s=>s.id===id) || {id, label:id, cor:'#888'}; }
function corAutomatica(label){
    let h = 0;
    for(let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return PALETA[h % PALETA.length];
}
function getRespCor(label){ const r = (data.config.responsaveis || []).find(x => x.label === label); return r ? r.cor : '#888'; }
function getAreaCor(label){ const a = (data.config.areas || []).find(x => x.label === label); return a ? a.cor : '#888'; }
function badgeStyle(cor){
    const base = hexToRgb(cor || '#888');
    const bg = rgbToHex(mix(base, {r:255,g:255,b:255}, 0.82));
    const txt = rgbToHex(mix(base, {r:0,g:0,b:0}, 0.35));
    return `background:${bg};color:${txt};`;
}

/* ============================================================

async function loadFromGitHub(){
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try { const r = await fetch(url+'?t='+Date.now()); if(!r.ok) throw new Error('nf'); return await r.json(); }
    catch(e){ console.warn('Sem dados remotos:', e); return null; }
}
async function loadData(){
    const raw = localStorage.getItem(CACHE_KEY);
    const t = Number(localStorage.getItem(CACHE_TIME_KEY)||0);
    if(raw && t && (Date.now()-t < CACHE_DURATION)){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    const remote = await loadFromGitHub();
    if(remote){ data = remote; prepararDados(); cacheLocal(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); return; }
    if(raw){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    cacheLocal();
}
function prepararDados(){
    if(!data.eventos) data.eventos = [];
    if(!data.config) data.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if(!data.config.tipos) data.config.tipos = JSON.parse(JSON.stringify(DEFAULT_CONFIG.tipos));
    if(!data.config.status) data.config.status = JSON.parse(JSON.stringify(DEFAULT_CONFIG.status));
    if(!data.config.background) data.config.background = { tipo:'cor', cor:'#1a1a1a', imagem:'' };
    if(data.config.userPhoto === undefined) data.config.userPhoto = '';

    data.config.responsaveis = (data.config.responsaveis || []).map(r =>
        typeof r === 'string' ? { label: r, cor: corAutomatica(r) } : r
    );
    data.config.areas = (data.config.areas || []).map(a =>
        typeof a === 'string' ? { label: a, cor: corAutomatica(a) } : a
    );

    data.eventos.forEach(ev=>{
        if(!ev.dataInicio && ev.data){ ev.dataInicio = ev.data; delete ev.data; }
        if(!ev.dataFim) ev.dataFim = ev.dataInicio;
        if(ev.responsavel === undefined) ev.responsavel = '';
        if(ev.area === undefined) ev.area = '';
        if(ev.status === undefined) ev.status = '';
        if(ev.ordem === undefined) ev.ordem = ev.id*10;
    });
    let max = 0;
    data.eventos.forEach(e=>{ if(e.id > max) max = e.id; });
    nextId = max+1;
}
function cacheLocal(){ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }

/* ============================================================
   HUD
============================================================ */
function atualizarHud(){
    const mesAtual = currentDate.getFullYear() + '-' + pad(currentDate.getMonth()+1);
    const evsDoMes = data.eventos.filter(ev => (ev.dataInicio||'').startsWith(mesAtual) || (ev.dataFim||'').startsWith(mesAtual));
    const total = evsDoMes.length;

    document.getElementById('hudResp').textContent = (data.config.responsaveis||[]).length;
    document.getElementById('hudArea').textContent = (data.config.areas||[]).length;
    document.getElementById('hudTipo').textContent = (data.config.tipos||[]).length;
    document.getElementById('hudStat').textContent = (data.config.status||[]).length;
    document.getElementById('hudTotalEventos').textContent = total;

    const statusFinal = (data.config.status||[]).find(s => /finaliz/i.test(s.label));
    const statusAndando = (data.config.status||[]).find(s => /andamento/i.test(s.label));
    const finalizados = statusFinal ? evsDoMes.filter(e => e.status === statusFinal.id).length : 0;
    const andando = statusAndando ? evsDoMes.filter(e => e.status === statusAndando.id).length : 0;
    const pctF = total > 0 ? Math.round((finalizados/total)*100) : 0;
    const pctA = total > 0 ? Math.round((andando/total)*100) : 0;
    document.getElementById('hudPctFinalizados').textContent = pctF + '%';
    document.getElementById('hudPctAndamento').textContent = pctA + '%';

    // ARMS
    const armsEl = document.getElementById('hudArms');
    const tipos = (data.config.tipos||[]).slice(0, 6);
    let armsHtml = '';
    for(let i=0;i<6;i++){
        const t = tipos[i];
        if(t){
            const ativo = filtros.tipo === t.id;
            armsHtml += `<div class="hud-arm ${ativo?'ativo':''}" onclick="toggleFiltroTipo('${escapeHtml(t.id)}')" title="${escapeHtml(t.label)}" style="position:relative;">${i+1}<span class="arm-cor" style="background:${escapeHtml(t.cor)}"></span></div>`;
        } else {
            armsHtml += `<div class="hud-arm" style="opacity:.25;">·</div>`;
        }
    }
    armsEl.innerHTML = armsHtml;

    // KEYS
    const keysEl = document.getElementById('hudKeys');
    keysEl.innerHTML = (data.config.status||[]).slice(0,5).map(s => {
        const ativo = filtros.status === s.id;
        return `<div class="hud-key ${ativo?'ativo':''}" style="background:linear-gradient(180deg, ${s.cor} 0%, #2a2a2a 100%);color:${s.cor};" onclick="toggleFiltroStatus('${escapeHtml(s.id)}')" title="${escapeHtml(s.label)}"></div>`;
    }).join('');
}
function toggleFiltroTipo(id){ filtros.tipo = (filtros.tipo === id) ? '' : id; popularFiltros(); render(); }
function toggleFiltroStatus(id){ filtros.status = (filtros.status === id) ? '' : id; popularFiltros(); render(); }

function aplicarBackground(){
    const bg = data.config.background || { tipo:'cor', cor:'#1a1a1a', imagem:'' };
    document.body.classList.toggle('bg-imagem', bg.tipo === 'imagem' && !!bg.imagem);
    if(bg.tipo === 'imagem' && bg.imagem){
        document.body.style.backgroundImage = `url('${BG_FOLDER}/${encodeURI(bg.imagem)}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundColor = '';
    } else {
        document.body.style.backgroundImage = '';
        document.body.style.background = bg.cor || '#1a1a1a';
    }
}
async function listarArquivosPasta(pasta){
    const caminhos = [pasta, 'calendario/' + pasta];
    for(const p of caminhos){
        try{
            const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${p}?ref=${GITHUB_BRANCH}`);
            if(!r.ok) continue;
            const lista = await r.json();
            if(Array.isArray(lista)){
                const imgs = lista.filter(f => f.type === 'file' && /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(f.name))
                    .map(f => f.name).sort((a,b)=>a.localeCompare(b, 'pt-BR', {numeric:true}));
                if(imgs.length) return imgs;
            }
        }catch(e){}
    }
    return [];
}
async function carregarBackgroundsSeNecessario(){
    if(backgroundsCarregados) return;
    backgroundsCarregados = true;
    backgroundsDisponiveis = await listarArquivosPasta(BG_FOLDER);
    renderBgLista();
}

/* ============================================================
   SALVAR NO GITHUB
============================================================ */
async function salvarTudo(){
    if(!authToken){ alert('Faça login como admin (🔧 ADMIN) antes de salvar.'); return; }
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha;
    try { const r = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}`, {headers:{Authorization:`Bearer ${authToken}`}}); if(r.ok) sha = (await r.json()).sha; } catch(e){}
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = { message:`Atualiza planner - ${new Date().toLocaleString('pt-BR')}`, content, branch:GITHUB_BRANCH };
    if(sha) body.sha = sha;
    try {
        const put = await fetch(apiUrl, { method:'PUT', headers:{Authorization:`Bearer ${authToken}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if(!put.ok) throw new Error((await put.json()).message||'Erro');
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal();
        alert('✅ Salvo no GitHub com sucesso!');
    } catch(e){ alert('Erro ao salvar: '+e.message); }
}

async function validarToken(token){
    try {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {headers:{Authorization:`Bearer ${token}`}});
        if(!r.ok) return false;
        const info = await r.json();
        return info.permissions && info.permissions.push === true;
    } catch(e){ return false; }
}
async function abrirAdmin(){
    if(!authToken){
        const t = prompt('Cole seu token do GitHub (com permissão de escrita):');
        if(!t) return;
        const ok = await validarToken(t);
        if(!ok){ alert('Token inválido ou sem permissão de escrita.'); return; }
        authToken = t;
        sessionStorage.setItem(TOKEN_KEY, t);
    }
    renderAdminListas();
    renderBgAdmin();
    renderFotoPreview();
    document.getElementById('modalAdmin').classList.add('active');
    carregarBackgroundsSeNecessario();
    carregarUserPhotosSeNecessario();
}
function fecharAdmin(){ document.getElementById('modalAdmin').classList.remove('active'); }
function fazerLogout(){ if(!confirm('Sair do modo admin?')) return; authToken = ''; sessionStorage.removeItem(TOKEN_KEY); fecharAdmin(); }

    if(data.config.areas.find(a => a.label === v)){ alert('Já cadastrada.'); return; }
    data.config.areas.push({ label: v, cor: corAutomatica(v) });
    document.getElementById('novaArea').value = '';
    cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud();
}
function delArea(i){ if(!confirm('Remover?')) return; data.config.areas.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function editarAreaLabel(i,v){ v=v.trim(); if(!v){ renderAdminListas(); return; } data.config.areas[i].label = v; cacheLocal(); renderAdminListas(); popularFiltros(); atualizarHud(); render(); }
function editarAreaCor(i,v){ data.config.areas[i].cor = v; cacheLocal(); renderAdminListas(); atualizarHud(); render(); }
function moverArea(i,d){ moverItem(data.config.areas, i, d, renderAdminListas); }

function moverItem(lista, i, dir, rerender){
    const j = i + dir;
    if(j < 0 || j >= lista.length) return;
    const tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp;
    cacheLocal();
    if(rerender) rerender();
    popularFiltros(); atualizarHud(); render();
}

}
function aplicarFiltros(){
    filtros.tipo = document.getElementById('filterTipo').value;
    filtros.status = document.getElementById('filterStatus').value;
    filtros.responsavel = document.getElementById('filterResp').value;
    filtros.area = document.getElementById('filterArea').value;
    render();
}
function limparFiltros(){ filtros = {tipo:'',status:'',responsavel:'',area:''}; popularFiltros(); render(); }
function passaFiltro(ev){
    if(filtros.tipo && ev.tipo !== filtros.tipo) return false;
    if(filtros.status && ev.status !== filtros.status) return false;
    if(filtros.responsavel && ev.responsavel !== filtros.responsavel) return false;
    if(filtros.area && ev.area !== filtros.area) return false;
    return true;
}
function temFiltroAtivo(){ return filtros.tipo || filtros.status || filtros.responsavel || filtros.area; }

   NAVEGAÇÃO
============================================================ */
function navPrev(){

    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m-1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d-7);
    else currentDate = new Date(y, m, d-1);

}
function navNext(){
    const y = currentDate.getFullYear(), m = currentDate.getMonth(), d = currentDate.getDate();
    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m+1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d+7);
    else currentDate = new Date(y, m, d+1);
    sincronizarSelects(); render();
}
function irHoje(){ currentDate = new Date(); sincronizarSelects(); render(); }
function sincronizarSelects(){
    document.getElementById('selectMes').value = currentDate.getMonth();
    document.getElementById('selectAno').value = currentDate.getFullYear();
}
function initSelects(){

function setView(v){ view = v; localStorage.setItem(VIEW_KEY, v); render(); }
function navDiaPrev(){ currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()-1); sincronizarSelects(); render(); }
function navDiaNext(){ currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()+1); sincronizarSelects(); render(); }
function irParaDia(key){ currentDate = parseDateKey(key); sincronizarSelects(); render(); }

/* ============================================================
   MAPA
============================================================ */
function construirMapa(){
    const mapa = {};
    const evs = data.eventos.filter(passaFiltro).sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    evs.forEach(ev=>{
        const ini = ev.dataInicio, fim = ev.dataFim||ini;
        if(!ini||!fim) return;
        let cur = ini;
        while(cur <= fim){
            if(!mapa[cur]) mapa[cur] = [];
            const position = ini===fim ? 'single' : (cur===ini ? 'start' : (cur===fim ? 'end' : 'middle'));
            mapa[cur].push({ev, position});
            cur = addDays(cur, 1);
        }
    });
    return mapa;
}

/* ============================================================
   RENDER
============================================================ */
function render(){
    document.querySelectorAll('.btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    atualizarTitulo();
    const c = document.getElementById('viewContainer');
    if(view === 'mes') c.innerHTML = renderMes();
    else if(view === 'semana') c.innerHTML = renderSemana();
    else if(view === 'dia') c.innerHTML = renderDia();
    else c.innerHTML = renderLista();
    renderLegend();
    atualizarContadorFiltro();
    atualizarHud();
}
function atualizarContadorFiltro(){
    const el = document.getElementById('filterCount');
    if(!temFiltroAtivo()){ el.textContent = ''; return; }
    const total = data.eventos.length;
    const visiveis = data.eventos.filter(passaFiltro).length;
    el.textContent = `${visiveis}/${total}`;
}
function atualizarTitulo(){
    const mt = document.getElementById('monthTitle');
    const yt = document.getElementById('yearTitle');
    if(view === 'dia'){
        const d = currentDate;
        mt.textContent = DIAS_SEMANA_LONGO[d.getDay()].toUpperCase();
        yt.textContent = `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
    } else if(view === 'semana'){
        const ini = new Date(currentDate); ini.setDate(currentDate.getDate() - currentDate.getDay());
        const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
        mt.textContent = 'SEMANA';
        yt.textContent = `${ini.getDate()}/${ini.getMonth()+1} a ${fim.getDate()}/${fim.getMonth()+1} de ${fim.getFullYear()}`;
    } else {
        mt.textContent = MESES[currentDate.getMonth()];
        yt.textContent = currentDate.getFullYear();
    }
}

function renderChipHeader(ev, isContinuation){
    const parts = [];
    if(isContinuation) parts.push('<span class="continuation-mark" title="Continuação">↳</span>');
    if(ev.status){
        const s = getStatus(ev.status);
        if(s) parts.push(`<span class="badge badge-status" style="${badgeStyle(s.cor)}" title="Status: ${escapeHtml(s.label)}"><span class="status-dot" style="background:${escapeHtml(s.cor)}"></span>${escapeHtml(s.label)}</span>`);
    }
    if(ev.responsavel){
        const cor = getRespCor(ev.responsavel);
        parts.push(`<span class="badge badge-resp" style="${badgeStyle(cor)}" title="Responsável: ${escapeHtml(ev.responsavel)}">@${escapeHtml(ev.responsavel)}</span>`);
    }
    if(ev.area){
        const cor = getAreaCor(ev.area);
        parts.push(`<span class="badge badge-area" style="${badgeStyle(cor)}" title="Área: ${escapeHtml(ev.area)}">${escapeHtml(ev.area)}</span>`);
    }
    if(parts.length === 0) return '';
    return `<div class="chip-header">${parts.join('')}</div>`;
}

function renderMes(){
    const ano = currentDate.getFullYear(), mes = currentDate.getMonth();
    const primeiro = new Date(ano, mes, 1);
    const diaSemanaIni = primeiro.getDay();
    const ultimoDia = new Date(ano, mes+1, 0).getDate();
    const ultimoAnt = new Date(ano, mes, 0).getDate();
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '<table class="calendar"><thead><tr>';
    ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].forEach((d,i)=>{ html += `<th class="${(i===0||i===6)?'weekend':''}">${d}</th>`; });
    html += '</tr></thead><tbody>';

    const total = Math.ceil((diaSemanaIni + ultimoDia)/7)*7;
    for(let i=0;i<total;i++){
        if(i%7===0) html += '<tr>';
        const dia = i - diaSemanaIni + 1;
        let cy=ano, cm=mes, cd, other=false;
        if(dia<1){ other=true; cm=mes-1; cy=ano; if(cm<0){cm=11;cy--;} cd=ultimoAnt+dia; }
        else if(dia>ultimoDia){ other=true; cm=mes+1; cy=ano; if(cm>11){cm=0;cy++;} cd=dia-ultimoDia; }
        else cd = dia;
        const key = dateKey(cy, cm, cd);
        const evs = (!other && mapa[key]) ? mapa[key] : [];
        const wknd = (i%7===0||i%7===6);
        const hj = key === hojeKey;
        let cls = ''; if(other) cls += ' other-month'; if(wknd) cls += ' weekend';
        html += `<td class="${cls}" data-day="${key}" ${other?'':'onclick="cellClick(event, \''+key+'\')"'} ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        if(!other){
            html += `<span class="day-number ${hj?'hoje':''}">${cd}</span>`;
            if(evs.length > 0){
                html += `<span class="day-badge">${evs.length}</span><div class="events-list">`;
                evs.slice(0,8).forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
                if(evs.length>8) html += `<div style="font-size:11px;text-align:center;color:#e81818;font-weight:700;">+${evs.length-8}</div>`;
                html += '</div>';
            }
        } else {
            html += `<span class="day-number" style="color:#666">${cd}</span>`;
        }
        html += '</td>';
        if(i%7===6) html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

function renderSemana(){
    const ini = new Date(currentDate);
    ini.setDate(currentDate.getDate() - currentDate.getDay());
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();
    let html = '<div class="week-grid">';
    for(let i=0;i<7;i++){
        const d = new Date(ini); d.setDate(ini.getDate()+i);
        const key = dateKeyFromDate(d);
        const evs = mapa[key] || [];
        const hj = key === hojeKey;
        const wknd = (i===0||i===6);
        html += `<div class="week-col ${wknd?'weekend':''}" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        html += `<div class="week-col-header ${hj?'hoje':''}">
                    <span style="font-size:9px;text-transform:uppercase;letter-spacing:1px;">${DIAS_SEMANA_CURTO[i]}</span>
                    <span class="wk-day">${d.getDate()}</span>
                 </div>`;
        evs.forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function renderDia(){
    const key = dateKeyFromDate(currentDate);
    const mapa = construirMapa();
    const evs = mapa[key] || [];
    const dt = currentDate;
    const hj = key === dateKeyFromDate(new Date());
    let html = '<div class="day-view">';
    html += `<div class="day-view-header">
                <div>
                    <h2>${dt.getDate()} ${MESES[dt.getMonth()]} ${dt.getFullYear()}</h2>
                    <div class="sub">${DIAS_SEMANA_LONGO[dt.getDay()]} ${hj?'• HOJE':''}</div>
                </div>
                <div class="day-nav">
                    <button class="btn btn-nav" onclick="navDiaPrev()">◄</button>
                    <button class="btn btn-primary" onclick="irHoje()">📅 HOJE</button>
                    <button class="btn btn-nav" onclick="navDiaNext()">►</button>
                    <button class="btn btn-secondary" onclick="abrirFormEvento(null, '${key}')">+ NOVO</button>
                </div>
             </div>`;
    html += renderDayStrip();
    html += `<div class="day-view-list" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
    evs.forEach(({ev, position})=>{ html += renderDayCard(ev, position, key); });
    html += '</div></div>';
    return html;
}

function renderDayStrip(){
    const ini = new Date(currentDate);
    ini.setDate(currentDate.getDate() - currentDate.getDay());
    const hojeKey = dateKeyFromDate(new Date());
    const curKey = dateKeyFromDate(currentDate);
    let html = '<div class="day-strip">';
    for(let i=0;i<7;i++){
        const d = new Date(ini); d.setDate(ini.getDate()+i);
        const k = dateKeyFromDate(d);
        const cls = ['day-strip-item'];
        if(k === curKey) cls.push('active');
        if(k === hojeKey) cls.push('hoje');
        if(i === 0 || i === 6) cls.push('weekend');
        html += `<button type="button" class="${cls.join(' ')}" onclick="irParaDia('${k}')">
                    <span class="ds-wd">${DIAS_SEMANA_CURTO[i]}</span>
                    <span class="ds-num">${d.getDate()}</span>
                 </button>`;
    }
    html += '</div>';
    return html;
}

function renderDayCard(ev, position, dayKey){
    const t = getTipo(ev.tipo);
    const isMulti = ev.dataInicio !== ev.dataFim;
    const isCont = isMulti && position !== 'start' && position !== 'single';
    const header = renderChipHeader(ev, isCont);
    const periodo = isMulti ? `<div class="dc-meta">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</div>` : '';
    const desc = ev.descricao ? `<div class="dc-desc">${escapeHtml(ev.descricao)}</div>` : '';
    return `<div class="day-card" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"
                 ondragstart="onChipDragStart(event, ${ev.id}, '${dayKey}')"
                 ondragend="onChipDragEnd(event)"
                 onclick="abrirFormEvento(${ev.id})">
                <div class="dc-header">
                    <div style="flex:1;min-width:0;">${header}</div>
                    <div class="dc-actions">
                        <button class="btn-mini edit" onclick="event.stopPropagation(); abrirFormEvento(${ev.id})">✎</button>
                        <button class="btn-mini dup" onclick="event.stopPropagation(); duplicarEvento(${ev.id})">⎘</button>
                        <button class="btn-mini del" onclick="event.stopPropagation(); excluirEvento(${ev.id})">✕</button>
                    </div>
                </div>
                <div class="dc-title">${escapeHtml(ev.titulo)}</div>
                ${periodo}${desc}
                <div class="dc-meta"><span style="opacity:.7;font-weight:700;text-transform:uppercase;font-size:11px;">${escapeHtml(t.label)}</span></div>
            </div>`;
}

function renderLista(){
    const ano = currentDate.getFullYear(), mes = currentDate.getMonth();
    const ultimo = new Date(ano, mes+1, 0).getDate();
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();
    let html = '', count = 0;
    for(let d=1; d<=ultimo; d++){
        const key = dateKey(ano, mes, d);
        const evs = mapa[key] || [];
        if(evs.length === 0) continue;
        count += evs.length;
        const dt = new Date(ano, mes, d);
        const hj = key === hojeKey;
        html += `<div class="list-day">
                    <div class="list-day-header ${hj?'hoje':''}">
                        <span>${d} ${MESES[mes]} ${hj?'• HOJE':''}</span>
                        <span class="weekday">${DIAS_SEMANA_LONGO[dt.getDay()]}</span>
                    </div>
                    <div class="list-day-body" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">
                        ${evs.map(({ev, position})=>renderChip(ev, position, key, true)).join('')}
                    </div>
                 </div>`;
    }
    if(count === 0) html = `<p style="text-align:center;color:#888;padding:40px 20px;font-family:VT323,monospace;font-size:16px;">${temFiltroAtivo()?'Nenhum evento corresponde aos filtros.':'Nenhum evento neste mês.'}</p>`;
    return html;
}

function renderChip(ev, position, dayKey, expandido){
    const t = getTipo(ev.tipo);
    const isMulti = ev.dataInicio !== ev.dataFim;
    const isCont = isMulti && position !== 'start' && position !== 'single';
    const header = renderChipHeader(ev, isCont);
    const periodo = (expandido && isMulti) ? `<div style="font-size:13px;opacity:.75;margin-top:3px;font-style:italic;">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</div>` : '';
    const desc = (expandido && ev.descricao) ? `<div style="font-size:14px;opacity:.85;margin-top:3px;">${escapeHtml(ev.descricao)}</div>` : '';
    const tipoLabel = expandido ? `<div style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.7;margin-top:3px;">${escapeHtml(t.label)}</div>` : '';
    const statusLabel = ev.status ? (getStatus(ev.status) ? getStatus(ev.status).label : ev.status) : '';
    const tooltip = [statusLabel?'Status: '+statusLabel:'', ev.responsavel?'Resp: '+ev.responsavel:'', ev.area?'Área: '+ev.area:'', ev.titulo, isMulti?`${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}`:'', ev.descricao||''].filter(Boolean).join(' • ');
    return `<div class="event-chip" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"
                 title="${escapeHtml(tooltip)}"
                 ondragstart="onChipDragStart(event, ${ev.id}, '${dayKey}')"
                 ondragend="onChipDragEnd(event)"
                 onclick="event.stopPropagation(); abrirFormEvento(${ev.id})">
                ${header}
                <span class="chip-title">${escapeHtml(ev.titulo)}</span>
                ${periodo}${desc}${tipoLabel}
            </div>`;
}

function renderLegend(){
    const l = document.getElementById('legend');
    const tipos = (data.config.tipos||[]).map(t=>`
        <div class="item">
            <div class="dot" style="background:${rgbToHex(mix(hexToRgb(t.cor),{r:255,g:255,b:255},.85))};border-left-color:${escapeHtml(t.cor)}"></div>
            ${escapeHtml(t.label)}
        </div>`).join('');
    const status = (data.config.status||[]).map(s=>`
        <div class="item">
            <div class="dot" style="background:${rgbToHex(mix(hexToRgb(s.cor),{r:255,g:255,b:255},.85))};border-left-color:${escapeHtml(s.cor)}"></div>
            ${escapeHtml(s.label)}
        </div>`).join('');
    l.innerHTML = tipos + (tipos && status ? '<div class="sep"></div>' : '') + status;
}

/* ============================================================
   DRAG & DROP
============================================================ */
function onChipDragStart(e, id, dayKey){
    dragState.eventId = id; dragState.sourceDay = dayKey;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(id));
    e.currentTarget.classList.add('dragging');
}
function onChipDragEnd(e){
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
    dragState.eventId = null; dragState.sourceDay = null;
}
function onDayDragOver(e, el){ e.preventDefault(); e.dataTransfer.dropEffect = 'move'; el.classList.add('drop-target'); }
function onDayDragLeave(e, el){ if(!el.contains(e.relatedTarget)) el.classList.remove('drop-target'); }
function onDayDrop(e, el){
    e.preventDefault(); e.stopPropagation();
    el.classList.remove('drop-target');
    let srcId = dragState.eventId;
    if(!srcId){ const raw = e.dataTransfer.getData('text/plain'); srcId = raw ? Number(raw) : null; }
    if(!srcId) return;
    const dayKey = el.dataset.day; if(!dayKey) return;
    const ev = data.eventos.find(x=>x.id === srcId); if(!ev) return;
    const jaEstaNoDia = ev.dataInicio <= dayKey && dayKey <= ev.dataFim;
    if(!jaEstaNoDia){
        const diff = daysBetween(ev.dataInicio, dayKey);
        ev.dataInicio = addDays(ev.dataInicio, diff);
        ev.dataFim = addDays(ev.dataFim, diff);
    }
    const chips = Array.from(el.querySelectorAll('.event-chip')).filter(c => Number(c.dataset.eventId) !== srcId);
    const mouseY = e.clientY;
    let insertBeforeIdx = chips.length;
    for(let i=0;i<chips.length;i++){
        const rect = chips[i].getBoundingClientRect();
        if(mouseY < rect.top + rect.height/2){ insertBeforeIdx = i; break; }
    }
    const diaEvs = data.eventos.filter(x => x.id !== srcId && x.dataInicio <= dayKey && dayKey <= x.dataFim)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    diaEvs.splice(insertBeforeIdx, 0, ev);
    diaEvs.forEach((x,i)=>{ x.ordem = (i+1)*10; });
    dragState.eventId = null; dragState.sourceDay = null;
    cacheLocal(); render();
}

function cellClick(e, key){
    if(e.target.closest('.event-chip')) return;
    abrirModalDia(key);
}

/* ============================================================
   MODAL DO DIA
============================================================ */
function abrirModalDia(key){
    if(!key) key = dateKeyFromDate(currentDate);
    diaSelecionado = key;
    const [y,m,d] = key.split('-');
    document.getElementById('modalDiaTitulo').textContent = `${Number(d)} ${MESES[Number(m)-1]} ${y}`;
    renderListaDia();
    document.getElementById('modalDia').classList.add('active');
}
function renderListaDia(){
    const evs = data.eventos.filter(ev => ev.dataInicio <= diaSelecionado && diaSelecionado <= ev.dataFim)
        .filter(passaFiltro).sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    const c = document.getElementById('eventsDayList');
    if(evs.length === 0){ c.innerHTML = '<p style="color:#888;text-align:center;padding:20px;font-family:VT323,monospace;">Nenhum evento neste dia.</p>'; return; }
    c.innerHTML = evs.map(ev => {
        const t = getTipo(ev.tipo);
        const periodo = ev.dataInicio !== ev.dataFim ? `<span class="periodo">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</span>` : '';
        const header = renderChipHeader(ev, false);
        return `<div class="event-row" style="${tipoCss(t.cor)}">
                    <div class="info">
                        <span class="tipo-label">${escapeHtml(t.label)}</span>
                        ${header}
                        <strong>${escapeHtml(ev.titulo)}</strong>
                        ${periodo}
                        ${ev.descricao ? `<span class="desc">${escapeHtml(ev.descricao)}</span>` : ''}
                    </div>
                    <div class="row-actions">
                        <button class="btn-mini edit" onclick="abrirFormEvento(${ev.id})">Editar</button>
                        <button class="btn-mini dup" onclick="duplicarEvento(${ev.id})">Duplicar</button>
                        <button class="btn-mini del" onclick="excluirEvento(${ev.id})">Excluir</button>
                    </div>
                </div>`;
    }).join('');
}
function fecharModalDia(){ document.getElementById('modalDia').classList.remove('active'); }

/* ============================================================
   FORMULÁRIO
============================================================ */
function novoEventoHoje(){ diaSelecionado = dateKeyFromDate(currentDate); abrirFormEvento(); }
function abrirFormEvento(id, diaForcado){
    fecharModalDia();
    const ev = id ? data.eventos.find(e=>e.id===id) : null;
    if(diaForcado) diaSelecionado = diaForcado;
    else if(!ev && !diaSelecionado) diaSelecionado = dateKeyFromDate(new Date());
    document.getElementById('formTituloModal').textContent = ev ? 'Editar evento' : 'Novo evento';
    document.getElementById('formId').value = ev ? ev.id : '';
    document.getElementById('formDataInicio').value = ev ? ev.dataInicio : diaSelecionado;
    document.getElementById('formDataFim').value = ev ? (ev.dataFim !== ev.dataInicio ? ev.dataFim : '') : '';
    document.getElementById('formTitulo').value = ev ? ev.titulo : '';
    document.getElementById('formDescricao').value = ev ? (ev.descricao||'') : '';
    document.getElementById('btnExcluirForm').style.display = ev ? 'inline-block' : 'none';
    preencherSelect('formResponsavel', data.config.responsaveis.map(r => r.label), ev ? ev.responsavel : '');
    preencherSelect('formArea', data.config.areas.map(a => a.label), ev ? ev.area : '');
    const tipoDefault = (data.config.tipos[0] && data.config.tipos[0].id) || '';
    preencherSelect('formTipo', data.config.tipos.map(t=>({value:t.id,label:t.label})), ev ? ev.tipo : tipoDefault);
    const statusDefault = ev ? (ev.status || '') : ((data.config.status[0] && data.config.status[0].id) || '');
    preencherSelect('formStatus', data.config.status.map(s=>({value:s.id,label:s.label})), statusDefault);
    document.getElementById('modalForm').classList.add('active');
    setTimeout(()=>document.getElementById('formTitulo').focus(), 100);
}
function preencherSelect(id, opcoes, valorAtual){
    const sel = document.getElementById(id);
    const normalizadas = opcoes.map(o => (typeof o === 'string' ? {value:o,label:o} : o));
    let html = '<option value="">— Nenhum —</option>';
    html += normalizadas.map(o => `<option value="${escapeHtml(o.value)}" ${o.value===valorAtual?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
    if(valorAtual && !normalizadas.find(o=>o.value===valorAtual)){
        html += `<option value="${escapeHtml(valorAtual)}" selected>${escapeHtml(valorAtual)} (removido)</option>`;
    }
    sel.innerHTML = html;
}
function fecharForm(){ document.getElementById('modalForm').classList.remove('active'); }
function mostrarTeletubies(){
    const el = document.getElementById('teletubiesOverlay');
    if(!el) return;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 1000);
}
function salvarEvento(){
    const dataInicio = document.getElementById('formDataInicio').value;
    const dataFimRaw = document.getElementById('formDataFim').value;
    const titulo = document.getElementById('formTitulo').value.trim();
    const responsavel = document.getElementById('formResponsavel').value;
    const area = document.getElementById('formArea').value;
    const descricao = document.getElementById('formDescricao').value.trim();
    const tipo = document.getElementById('formTipo').value;
    const status = document.getElementById('formStatus').value;
    const id = document.getElementById('formId').value;
    if(!dataInicio){ alert('Informe a data de início.'); return; }
    if(!titulo){ alert('Informe o título.'); return; }
    const dataFim = dataFimRaw && dataFimRaw >= dataInicio ? dataFimRaw : dataInicio;
    if(id){
        const ev = data.eventos.find(e=>e.id===Number(id));
        if(ev){
            ev.dataInicio = dataInicio; ev.dataFim = dataFim;
            ev.titulo = titulo; ev.responsavel = responsavel;
            ev.area = area; ev.descricao = descricao;
            ev.tipo = tipo; ev.status = status;
        }
    } else {
        data.eventos.push({ id: nextId++, dataInicio, dataFim, titulo, responsavel, area, descricao, tipo, status, ordem: nextId*10 });
        mostrarTeletubies();
    }
    cacheLocal(); fecharForm(); diaSelecionado = dataInicio; render(); abrirModalDia(dataInicio);
}
function duplicarEvento(id){
    const ev = data.eventos.find(e=>e.id===id); if(!ev) return;
    const novo = JSON.parse(JSON.stringify(ev));
    novo.id = nextId++; novo.ordem = nextId*10; novo.titulo = ev.titulo + ' (cópia)';
    data.eventos.push(novo);
    cacheLocal(); render(); renderListaDia();
}
function excluirEvento(id){
    if(!confirm('Excluir este evento?')) return;
    data.eventos = data.eventos.filter(e=>e.id!==id);
    cacheLocal(); renderListaDia(); render();
}
function excluirEventoForm(){
    const id = Number(document.getElementById('formId').value);
    if(!id) return;
    if(!confirm('Excluir este evento?')) return;
    data.eventos = data.eventos.filter(e=>e.id!==id);
    cacheLocal();
    fecharForm();
    if(document.getElementById('modalDia').classList.contains('active')) renderListaDia();
    render();
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
document.addEventListener('DOMContentLoaded', async ()=>{
    await loadData();
    aplicarBackground();
    aplicarUserPhoto();
    const pref = localStorage.getItem(VIEW_KEY);
    if(pref) view = pref;
    else if(window.innerWidth < 560) view = 'lista';
    initSelects();
    sincronizarSelects();
    popularFiltros();
    render();

    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape'){ fecharForm(); fecharModalDia(); fecharAdmin(); return; }
        if(view === 'dia'){
            const tag = (e.target.tagName || '').toLowerCase();
            const digitando = (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable);
            const modalAberto = document.querySelector('.modal-overlay.active');
            if(digitando || modalAberto) return;
            if(e.key === 'ArrowLeft'){ e.preventDefault(); navDiaPrev(); }
            if(e.key === 'ArrowRight'){ e.preventDefault(); navDiaNext(); }
        }
    });
});
