<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário de Eventos FGH</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fa; margin: 20px; color: #333; }
    .container { max-width: 1300px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 16px rgba(22, 60, 109, 0.08); border: 1px solid #e6edf5; }

    .header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; }
    .title-block h1 { margin: 0; font-size: 56px; font-weight: 900; color: #163c6d; letter-spacing: 1px; line-height: 1; text-transform: uppercase; }
    .title-block .year-row { display: flex; align-items: center; gap: 15px; margin-top: 10px; font-size: 22px; color: #163c6d; font-weight: 500; }
    .title-block .year-row .line { flex: 1; height: 2px; background: #163c6d; max-width: 110px; }
    .logo-block { text-align: right; }
    .logo-block img { height: 90px; }
    .logo-fallback { font-size: 48px; font-weight: 900; color: #163c6d; line-height: 1; text-align: center; }
    .logo-fallback small { display: block; font-size: 34px; letter-spacing: 2px; margin-top: -4px; }

    .toolbar { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; padding: 12px 15px; background: #f8fafc; border: 1px solid #e6edf5; border-radius: 8px; }
    .toolbar label { font-weight: 600; color: #163c6d; font-size: 14px; }
    .toolbar select { padding: 8px 12px; border: 1px solid #d1d8e2; border-radius: 6px; font-size: 14px; color: #163c6d; background: #ffffff; font-weight: 600; cursor: pointer; }
    .btn { border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; padding: 8px 16px; font-size: 14px; }
    .btn-primary { background: #163c6d; color: white; }
    .btn-primary:hover { background: #0e2b4f; }
    .btn-secondary { background: #2b6ca3; color: white; }
    .btn-secondary:hover { background: #1f5280; }
    .btn-success { background: #1a9c4a; color: white; }
    .btn-success:hover { background: #13803b; }
    .btn-nav { background: #e9edf2; color: #163c6d; padding: 8px 14px; font-size: 18px; min-width: 44px; }
    .btn-nav:hover { background: #d3dde8; }

    .calendar { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1px solid #dbe0e5; border-radius: 8px; overflow: hidden; }
    .calendar thead th { background: #163c6d; color: #ffffff; padding: 14px 8px; font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; border: none; }
    .calendar thead th.weekend { background: #1f4d85; }
    .calendar td { border: 1px solid #e6edf5; padding: 8px; vertical-align: top; height: 130px; background: #ffffff; position: relative; cursor: pointer; transition: background 0.15s; }
    .calendar td:hover { background: #f8fbff; }
    .calendar td.other-month { background: #f8fafc; cursor: default; }
    .calendar td.other-month .day-number { color: #c5cdd6; }
    .calendar td.other-month:hover { background: #f8fafc; }
    .calendar td.weekend .day-number { color: #2b6ca3; }
    .day-number { font-size: 18px; font-weight: 600; color: #163c6d; margin-bottom: 6px; display: block; }
    .calendar td.other-month .day-number { font-weight: 500; }

    .events-list { display: flex; flex-direction: column; gap: 4px; max-height: 100px; overflow-y: auto; }
    .event-chip { padding: 6px 8px; border-radius: 6px; font-size: 11px; line-height: 1.25; border-left: 3px solid; cursor: pointer; transition: filter 0.15s; }
    .event-chip:hover { filter: brightness(0.95); }
    .event-chip .chip-title { font-weight: 700; display: block; margin-bottom: 2px; }
    .event-chip .chip-desc { display: none; }
    .event-chip.expanded .chip-desc { display: block; margin-top: 3px; font-size: 10.5px; }

    /* Cores dos tipos de evento */
    .tipo-info     { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
    .tipo-prazo    { background: #fff8e1; border-color: #f5a623; color: #7a4b00; }
    .tipo-tarefa   { background: #e3f2fd; border-color: #2196f3; color: #0d3c6e; }
    .tipo-comunicado { background: #f3e5f5; border-color: #9c27b0; color: #4a148c; }
    .tipo-feriado  { background: #ffebee; border-color: #e53935; color: #8e0000; }

    .day-badge { position: absolute; top: 6px; right: 6px; background: #163c6d; color: white; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(22, 60, 109, 0.55); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 25px; max-width: 520px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.25); max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin: 0 0 18px 0; color: #163c6d; font-size: 22px; }
    .modal .field { margin-bottom: 14px; }
    .modal label { display: block; font-weight: 600; color: #163c6d; font-size: 13px; margin-bottom: 5px; }
    .modal input[type="text"], .modal input[type="date"], .modal textarea, .modal select { width: 100%; padding: 10px; border: 1px solid #d1d8e2; border-radius: 6px; font-size: 14px; font-family: inherit; color: #333; }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #2b6ca3; box-shadow: 0 0 0 3px rgba(43,108,163,0.1); }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
    .modal .actions .left { margin-right: auto; }

    .events-day-list { margin: 15px 0; max-height: 250px; overflow-y: auto; }
    .events-day-list .event-row { padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .events-day-list .event-row .info { flex: 1; }
    .events-day-list .event-row .info strong { display: block; margin-bottom: 3px; font-size: 14px; }
    .events-day-list .event-row .info span { font-size: 12px; opacity: 0.85; }
    .events-day-list .event-row .row-actions { display: flex; gap: 4px; }
    .btn-mini { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; }
    .btn-mini.edit { background: #2b6ca3; color: white; }
    .btn-mini.del { background: #dc3545; color: white; }

    .legend { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e6edf5; font-size: 12px; color: #555; }
    .legend .item { display: flex; align-items: center; gap: 6px; }
    .legend .dot { width: 12px; height: 12px; border-radius: 3px; border-left: 3px solid; }

    @media (max-width: 800px) {
        body { margin: 8px; padding: 0; }
        .container { padding: 14px; }
        .title-block h1 { font-size: 34px; }
        .title-block .year-row { font-size: 16px; }
        .logo-block img { height: 55px; }
        .logo-fallback { font-size: 32px; } .logo-fallback small { font-size: 22px; }
        .toolbar { padding: 10px; gap: 8px; }
        .toolbar select, .toolbar .btn { font-size: 12px; padding: 6px 10px; }
        .calendar thead th { font-size: 11px; padding: 8px 3px; }
        .calendar td { height: 85px; padding: 4px; }
        .day-number { font-size: 13px; margin-bottom: 3px; }
        .event-chip { font-size: 9px; padding: 3px 5px; }
        .event-chip .chip-desc { font-size: 8.5px; }
        .day-badge { font-size: 9px; padding: 1px 5px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <div class="title-block">
            <h1 id="monthTitle">JUNHO</h1>
            <div class="year-row">
                <span class="line"></span>
                <span id="yearTitle">2026</span>
                <span class="line"></span>
            </div>
        </div>
        <div class="logo-block" id="logoBlock">
            <img src="images/logo_fgh.png" alt="Logo FGH" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
            <div id="logoFallback" class="logo-fallback" style="display:none;">FGH</div>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-nav" onclick="mudarMes(-1)">‹</button>
        <select id="selectMes"></select>
        <select id="selectAno"></select>
        <button class="btn btn-nav" onclick="mudarMes(1)">›</button>
        <button class="btn btn-primary" onclick="hoje()">📅 Hoje</button>
        <span style="flex:1"></span>
        <button class="btn btn-secondary" onclick="abrirModalDia()">➕ Novo evento</button>
        <button class="btn btn-success" onclick="saveDataToGitHub()">💾 Salvar</button>
    </div>

    <div id="calendarContainer"></div>

    <div class="legend">
        <div class="item"><div class="dot tipo-info"></div> Informativo</div>
        <div class="item"><div class="dot tipo-prazo"></div> Prazo / Deadline</div>
        <div class="item"><div class="dot tipo-tarefa"></div> Tarefa</div>
        <div class="item"><div class="dot tipo-comunicado"></div> Comunicado</div>
        <div class="item"><div class="dot tipo-feriado"></div> Feriado / Recesso</div>
    </div>
</div>

<!-- Modal de dia -->
<div class="modal-overlay" id="modalDia" onclick="if(event.target===this) fecharModalDia()">
    <div class="modal">
        <h2 id="modalDiaTitulo">Eventos do dia</h2>
        <div class="events-day-list" id="eventsDayList"></div>
        <div class="actions">
            <button class="btn btn-secondary left" onclick="abrirFormEvento()">➕ Adicionar evento neste dia</button>
            <button class="btn btn-primary" onclick="fecharModalDia()">Fechar</button>
        </div>
    </div>
</div>

<!-- Modal de formulário -->
<div class="modal-overlay" id="modalForm" onclick="if(event.target===this) fecharForm()">
    <div class="modal">
        <h2 id="formTitulo">Novo evento</h2>
        <input type="hidden" id="formId">
        <input type="hidden" id="formDataOriginal">

        <div class="field">
            <label>Data</label>
            <input type="date" id="formData">
        </div>
        <div class="field">
            <label>Título</label>
            <input type="text" id="formTitulo" placeholder="Ex.: Disponibilização da planilha">
        </div>
        <div class="field">
            <label>Descrição (opcional)</label>
            <textarea id="formDescricao" placeholder="Detalhes do evento ou comunicado..."></textarea>
        </div>
        <div class="field">
            <label>Tipo</label>
            <select id="formTipo">
                <option value="info">Informativo</option>
                <option value="prazo">Prazo / Deadline</option>
                <option value="tarefa">Tarefa</option>
                <option value="comunicado">Comunicado</option>
                <option value="feriado">Feriado / Recesso</option>
            </select>
        </div>
        <div class="actions">
            <button class="btn btn-primary" onclick="salvarEvento()">Salvar</button>
            <button class="btn btn-secondary" onclick="fecharForm()">Cancelar</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO GITHUB
============================================================ */
const GITHUB_OWNER = 'caiomalbuquerque';
const GITHUB_REPO = 'programacao_de_eventos';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'calendario.json';
const CACHE_KEY = 'calendario_fgh';
const CACHE_TIME_KEY = 'calendario_fgh_cache_time';
const CACHE_DURATION = 5 * 60 * 1000;

const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const MESES_CURTOS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* ============================================================
   ESTADO
============================================================ */
let data = { eventos: [] };
let nextId = 1;
let mesAtual, anoAtual;
let diaSelecionado = null;

/* ============================================================
   PERSISTÊNCIA
============================================================ */
async function loadDataFromGitHub() {
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try {
        const r = await fetch(url + '?t=' + Date.now());
        if (!r.ok) throw new Error('Arquivo não encontrado');
        return await r.json();
    } catch(e) { console.warn('Sem dados remotos:', e); return null; }
}

async function saveDataToGitHub() {
    const token = prompt('Cole seu token do GitHub para salvar:');
    if (!token) return;
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha;
    try {
        const r = await fetch(apiUrl + `?ref=${GITHUB_BRANCH}`, { headers: { Authorization: `Bearer ${token}` }});
        if (r.ok) sha = (await r.json()).sha;
    } catch(e) {}
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: `Atualiza calendário - ${new Date().toLocaleString('pt-BR')}`, content, branch: GITHUB_BRANCH };
    if (sha) body.sha = sha;
    try {
        const put = await fetch(apiUrl, { method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
        if (!put.ok) throw new Error((await put.json()).message || 'Erro');
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal();
        alert('Salvo no GitHub com sucesso!');
    } catch(e) { alert('Erro ao salvar: ' + e.message); }
}

function cacheLocal() { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }

async function loadData() {
    const raw = localStorage.getItem(CACHE_KEY);
    const t = Number(localStorage.getItem(CACHE_TIME_KEY) || 0);
    if (raw && t && (Date.now() - t < CACHE_DURATION)) {
        try { data = JSON.parse(raw); prepararIds(); return; } catch(e) {}
    }
    const remote = await loadDataFromGitHub();
    if (remote) {
        data = remote;
        if (!data.eventos) data.eventos = [];
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal(); prepararIds(); return;
    }
    if (raw) { try { data = JSON.parse(raw); if (!data.eventos) data.eventos = []; prepararIds(); return; } catch(e) {} }
    data = { eventos: [] };
    cacheLocal();
}

function prepararIds() {
    let max = 0;
    (data.eventos || []).forEach(e => { if (e.id > max) max = e.id; });
    nextId = max + 1;
}

/* ============================================================
   NAVEGAÇÃO
============================================================ */
function mudarMes(delta) {
    let m = mesAtual + delta;
    let a = anoAtual;
    if (m < 0) { m = 11; a--; }
    if (m > 11) { m = 0; a++; }
    mesAtual = m; anoAtual = a;
    sincronizarSelects();
    render();
}

function hoje() {
    const d = new Date();
    mesAtual = d.getMonth();
    anoAtual = d.getFullYear();
    sincronizarSelects();
    render();
}

function sincronizarSelects() {
    document.getElementById('selectMes').value = mesAtual;
    document.getElementById('selectAno').value = anoAtual;
}

function initSelects() {
    const sm = document.getElementById('selectMes');
    const sa = document.getElementById('selectAno');
    sm.innerHTML = MESES_CURTOS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
    const anoCorrente = new Date().getFullYear();
    const anos = [];
    for (let y = anoCorrente - 3; y <= anoCorrente + 5; y++) anos.push(y);
    sa.innerHTML = anos.map(y=>`<option value="${y}">${y}</option>`).join('');
    sm.addEventListener('change', () => { mesAtual = Number(sm.value); render(); });
    sa.addEventListener('change', () => { anoAtual = Number(sa.value); render(); });
}

/* ============================================================
   HELPERS
============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y, m, d){ return `${y}-${pad(m+1)}-${pad(d)}`; }

function eventosDoDia(key) {
    return (data.eventos || []).filter(e => e.data === key).sort((a,b)=> (a.tipo||'').localeCompare(b.tipo||''));
}

function escapeHtml(t) {
    if (t == null) return '';
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

/* ============================================================
   RENDER
============================================================ */
function render() {
    document.getElementById('monthTitle').textContent = MESES[mesAtual];
    document.getElementById('yearTitle').textContent = anoAtual;

    const primeiroDia = new Date(anoAtual, mesAtual, 1);
    const diaSemanaIni = primeiroDia.getDay(); // 0=Dom
    const ultimoDia = new Date(anoAtual, mesAtual + 1, 0).getDate();
    const ultimoDiaAnt = new Date(anoAtual, mesAtual, 0).getDate();

    const hojeKey = (() => { const d = new Date(); return dateKey(d.getFullYear(), d.getMonth(), d.getDate()); })();

    let html = '<table class="calendar"><thead><tr>';
    ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].forEach((d,i) => {
        html += `<th class="${(i===0||i===6)?'weekend':''}">${d}</th>`;
    });
    html += '</tr></thead><tbody>';

    const totalCelulas = Math.ceil((diaSemanaIni + ultimoDia) / 7) * 7;

    for (let i = 0; i < totalCelulas; i++) {
        if (i % 7 === 0) html += '<tr>';
        const dia = i - diaSemanaIni + 1;
        let cellY = anoAtual, cellM = mesAtual, cellD, other = false;

        if (dia < 1) {
            other = true;
            cellM = mesAtual - 1; cellY = anoAtual;
            if (cellM < 0) { cellM = 11; cellY--; }
            cellD = ultimoDiaAnt + dia;
        } else if (dia > ultimoDia) {
            other = true;
            cellM = mesAtual + 1; cellY = anoAtual;
            if (cellM > 11) { cellM = 0; cellY++; }
            cellD = dia - ultimoDia;
        } else {
            cellD = dia;
        }

        const key = dateKey(cellY, cellM, cellD);
        const evs = eventosDoDia(key);
        const isWeekend = (i % 7 === 0 || i % 7 === 6);
        const isHoje = key === hojeKey;

        let classes = 'day-cell';
        if (other) classes += ' other-month';
        if (isWeekend) classes += ' weekend';

        html += `<td class="${classes}" ${other ? '' : `onclick="abrirModalDia('${key}')"`}>`;
        html += `<span class="day-number" ${isHoje ? 'style="background:#163c6d;color:white;display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;font-size:14px;padding:0;"' : ''}>${cellD}</span>`;
        if (evs.length > 0) {
            html += `<span class="day-badge">${evs.length}</span>`;
            html += '<div class="events-list">';
            evs.slice(0, 4).forEach(ev => {
                html += `<div class="event-chip tipo-${escapeHtml(ev.tipo || 'info')}" onclick="event.stopPropagation(); abrirFormEvento(${ev.id})" title="${escapeHtml(ev.descricao || ev.titulo)}">
                    <span class="chip-title">${escapeHtml(ev.titulo)}</span>
                    ${ev.descricao ? `<span class="chip-desc">${escapeHtml(ev.descricao)}</span>` : ''}
                </div>`;
            });
            if (evs.length > 4) html += `<div style="font-size:10px;text-align:center;color:#163c6d;font-weight:600;">+${evs.length - 4} mais</div>`;
            html += '</div>';
        }
        html += '</td>';
        if (i % 7 === 6) html += '</tr>';
    }

    html += '</tbody></table>';
    document.getElementById('calendarContainer').innerHTML = html;
}

/* ============================================================
   MODAL DO DIA
============================================================ */
function abrirModalDia(key) {
    if (!key) {
        const d = new Date();
        key = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    }
    diaSelecionado = key;
    const [y,m,dd] = key.split('-');
    document.getElementById('modalDiaTitulo').textContent = `${Number(dd)} de ${MESES[Number(m)-1]} de ${y}`;
    renderListaDia();
    document.getElementById('modalDia').classList.add('active');
}

function renderListaDia() {
    const evs = eventosDoDia(diaSelecionado);
    const container = document.getElementById('eventsDayList');
    if (evs.length === 0) {
        container.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Nenhum evento neste dia.</p>';
        return;
    }
    container.innerHTML = evs.map(ev => `
        <div class="event-row tipo-${escapeHtml(ev.tipo || 'info')}">
            <div class="info">
                <strong>${escapeHtml(ev.titulo)}</strong>
                ${ev.descricao ? `<span>${escapeHtml(ev.descricao)}</span>` : ''}
            </div>
            <div class="row-actions">
                <button class="btn-mini edit" onclick="abrirFormEvento(${ev.id})">Editar</button>
                <button class="btn-mini del" onclick="excluirEvento(${ev.id})">Excluir</button>
            </div>
        </div>
    `).join('');
}

function fecharModalDia() {
    document.getElementById('modalDia').classList.remove('active');
}

/* ============================================================
   MODAL DE FORMULÁRIO
============================================================ */
function abrirFormEvento(id) {
    document.getElementById('modalDia').classList.remove('active');
    const ev = id ? (data.eventos || []).find(e => e.id === id) : null;
    document.getElementById('formTitulo').textContent = ev ? 'Editar evento' : 'Novo evento';
    document.getElementById('formId').value = ev ? ev.id : '';
    document.getElementById('formDataOriginal').value = ev ? ev.data : '';
    document.getElementById('formData').value = ev ? ev.data : (diaSelecionado || '');
    document.getElementById('formTitulo').value = ev ? ev.titulo : '';
    document.getElementById('formDescricao').value = ev ? (ev.descricao || '') : '';
    document.getElementById('formTipo').value = ev ? (ev.tipo || 'info') : 'info';
    document.getElementById('modalForm').classList.add('active');
    setTimeout(() => document.getElementById('formTitulo').focus(), 100);
}

function fecharForm() {
    document.getElementById('modalForm').classList.remove('active');
}

function salvarEvento() {
    const data_ = document.getElementById('formData').value;
    const titulo = document.getElementById('formTitulo').value.trim();
    const descricao = document.getElementById('formDescricao').value.trim();
    const tipo = document.getElementById('formTipo').value;
    const id = document.getElementById('formId').value;

    if (!data_) { alert('Informe a data.'); return; }
    if (!titulo) { alert('Informe o título.'); return; }

    if (id) {
        const ev = data.eventos.find(e => e.id === Number(id));
        if (ev) {
            ev.data = data_;
            ev.titulo = titulo;
            ev.descricao = descricao;
            ev.tipo = tipo;
        }
    } else {
        data.eventos.push({ id: nextId++, data: data_, titulo, descricao, tipo });
    }

    cacheLocal();
    fecharForm();
    diaSelecionado = data_;
    render();
}

function excluirEvento(id) {
    if (!confirm('Excluir este evento?')) return;
    data.eventos = data.eventos.filter(e => e.id !== id);
    cacheLocal();
    renderListaDia();
    render();
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
document.addEventListener('DOMContentLoaded', async () => {
    await loadData();
    const d = new Date();
    mesAtual = d.getMonth();
    anoAtual = d.getFullYear();
    initSelects();
    sincronizarSelects();
    render();
});
</script>
