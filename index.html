<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner FGH</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7fa; color: #333; padding: 12px; min-height: 100vh; }
    .container { max-width: 1700px; margin: 0 auto; background: #fff; padding: 20px 22px; border-radius: 12px; box-shadow: 0 4px 16px rgba(22,60,109,.08); border: 1px solid #e6edf5; }

    /* Cabeçalho */
    .header-wrapper { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:16px; flex-wrap:wrap; }
    .title-block h1 { margin:0; font-size:clamp(26px,4.5vw,50px); font-weight:900; color:#163c6d; letter-spacing:1px; line-height:1; text-transform:uppercase; }
    .title-block .year-row { display:flex; align-items:center; gap:12px; margin-top:6px; font-size:clamp(13px,1.8vw,18px); color:#163c6d; font-weight:500; }
    .title-block .year-row .line { flex:1; height:2px; background:#163c6d; max-width:100px; }
    .logo-block { text-align:right; flex-shrink:0; }
    .logo-block img { height:clamp(46px,7vw,84px); }
    .logo-fallback { font-size:clamp(26px,5vw,44px); font-weight:900; color:#163c6d; line-height:1; }
    .logo-fallback small { display:block; font-size:.7em; letter-spacing:2px; margin-top:-4px; }

    /* Toolbar + filtros */
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; padding:10px 14px; background:#f8fafc; border:1px solid #e6edf5; border-radius:8px; }
    .toolbar select { padding:7px 10px; border:1px solid #d1d8e2; border-radius:6px; font-size:13px; color:#163c6d; background:#fff; font-weight:600; cursor:pointer; }
    .toolbar .spacer { flex:1; }
    .filters { display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; padding:8px 14px; background:#fff7e6; border:1px solid #f5d99b; border-radius:8px; }
    .filters select { padding:7px 10px; border:1px solid #e8c98c; border-radius:6px; font-size:13px; background:#fff; font-weight:600; color:#7a4b00; cursor:pointer; }
    .filters .lbl { font-size:12px; font-weight:700; color:#7a4b00; text-transform:uppercase; letter-spacing:.5px; }
    .filters .count { font-size:12px; color:#7a4b00; font-weight:600; margin-left:auto; }

    .btn { border:none; border-radius:6px; cursor:pointer; font-weight:600; transition:.15s; padding:8px 13px; font-size:13.5px; white-space:nowrap; }
    .btn-primary { background:#163c6d; color:#fff; } .btn-primary:hover { background:#0e2b4f; }
    .btn-secondary { background:#2b6ca3; color:#fff; } .btn-secondary:hover { background:#1f5280; }
    .btn-success { background:#1a9c4a; color:#fff; } .btn-success:hover { background:#13803b; }
    .btn-nav { background:#e9edf2; color:#163c6d; padding:8px 12px; font-size:18px; min-width:40px; }
    .btn-nav:hover { background:#d3dde8; }
    .btn-toggle { background:#eef3f9; color:#163c6d; border:1px solid #d1d8e2; }
    .btn-toggle.active { background:#163c6d; color:#fff; border-color:#163c6d; }
    .btn-admin { background:#7a4b00; color:#fff; } .btn-admin:hover { background:#5d3900; }
    .btn-mini { padding:5px 9px; font-size:12px; border-radius:4px; border:none; cursor:pointer; font-weight:600; }
    .btn-mini.edit { background:#2b6ca3; color:#fff; } .btn-mini.del { background:#dc3545; color:#fff; }
    .btn-mini.dup { background:#1a9c4a; color:#fff; }

    /* Mês */
    .calendar { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; border:1px solid #dbe0e5; border-radius:8px; overflow:hidden; }
    .calendar thead th { background:#163c6d; color:#fff; padding:11px 6px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
    .calendar thead th.weekend { background:#1f4d85; }
    .calendar td { border:1px solid #e6edf5; padding:6px; vertical-align:top; height:185px; background:#fff; position:relative; cursor:pointer; transition:background .15s; overflow:hidden; }
    .calendar td:hover { background:#f8fbff; }
    .calendar td.other-month { background:#f8fafc; cursor:default; }
    .calendar td.other-month .day-number { color:#c5cdd6; }
    .calendar td.weekend .day-number { color:#2b6ca3; }
    .day-number { font-size:16px; font-weight:600; color:#163c6d; margin-bottom:4px; display:inline-block; line-height:26px; width:26px; text-align:center; }
    .day-number.hoje { background:#163c6d; color:#fff !important; border-radius:50%; }
    .day-badge { position:absolute; top:6px; right:6px; background:#163c6d; color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:10px; line-height:1.4; }

    /* Semana */
    .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .week-col { border:1px solid #e6edf5; border-radius:8px; background:#fff; min-height:360px; padding:8px; display:flex; flex-direction:column; gap:5px; }
    .week-col-header { background:#163c6d; color:#fff; border-radius:6px; padding:7px 8px; text-align:center; font-weight:700; margin:-8px -8px 6px; font-size:13px; }
    .week-col-header .wk-day { font-size:22px; display:block; line-height:1.1; }
    .week-col-header.hoje { background:#0e2b4f; box-shadow:inset 0 0 0 2px #f5a623; }
    .week-col.weekend { background:#f8fafc; }

    /* Dia */
    .day-view { max-width:820px; margin:0 auto; }
    .day-view-header { background:#163c6d; color:#fff; border-radius:10px; padding:16px 20px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .day-view-header h2 { margin:0; font-size:24px; }
    .day-view-header .sub { font-size:14px; opacity:.85; }
    .day-view-list { display:flex; flex-direction:column; gap:10px; min-height:150px; }
    .day-view-list:empty::after { content:'Nenhum evento neste dia. Arraste para cá ou clique em "Novo evento".'; display:block; text-align:center; color:#888; padding:40px 20px; border:2px dashed #dbe0e5; border-radius:10px; font-size:14px; }

    .day-card {
        border-radius:8px; padding:14px 16px; border-left:5px solid;
        cursor:grab; transition:.15s;
        display:flex; flex-direction:column; gap:6px;
        min-width:0;
    }
    .day-card:hover { filter:brightness(.97); }
    .day-card.dragging { opacity:.4; }
    .day-card .dc-header {
        display:flex; justify-content:space-between; align-items:flex-start;
        gap:12px;
        min-width:0;
    }
    .day-card .dc-title {
        font-weight:700; font-size:17px;
        flex:1; min-width:0;
        word-break:break-word;
        overflow-wrap:anywhere;
        line-height:1.3;
    }
    .day-card .dc-title .chip-resp,
    .day-card .dc-title .chip-area {
        margin-right:6px;
        word-break:normal;
        overflow-wrap:normal;
    }
    .day-card .dc-actions {
        display:flex; gap:4px; flex-shrink:0;
        align-self:flex-start;
    }
    .day-card .dc-meta {
        font-size:13px; opacity:.85;
        display:flex; gap:8px; flex-wrap:wrap;
        word-break:break-word;
    }
    .day-card .dc-desc {
        font-size:13.5px; opacity:.9;
        word-break:break-word;
        overflow-wrap:anywhere;
        line-height:1.4;
    }

    /* Lista */
    .list-day { border:1px solid #e6edf5; border-radius:8px; margin-bottom:10px; background:#fff; overflow:hidden; }
    .list-day-header { background:#f0f4f8; padding:9px 12px; font-weight:700; color:#163c6d; font-size:15px; display:flex; justify-content:space-between; align-items:center; }
    .list-day-header.hoje { background:#163c6d; color:#fff; }
    .list-day-header .weekday { font-weight:600; font-size:12.5px; color:#5a7ba3; text-transform:uppercase; letter-spacing:.5px; }
    .list-day-header.hoje .weekday { color:#c8d6e8; }
    .list-day-body { padding:8px 10px; display:flex; flex-direction:column; gap:6px; }

    /* Chips */
    .event-chip { font-size:12.5px; line-height:1.35; padding:6px 9px; border-radius:5px; border-left:3px solid; cursor:grab; transition:filter .15s; display:block; word-break:break-word; white-space:normal; flex-shrink:0; position:relative; }
    .event-chip:hover { filter:brightness(.95); }
    .event-chip.dragging { opacity:.4; }
    .chip-title { font-weight:700; }
    .chip-resp, .chip-area { display:inline-block; background:rgba(0,0,0,.10); padding:0 6px; border-radius:3px; font-size:10.5px; font-weight:700; letter-spacing:.2px; margin-right:5px; vertical-align:middle; white-space:nowrap; }
    .chip-area { background:rgba(0,0,0,.06); font-style:italic; }
    .continuation-mark { display:inline-block; font-size:11px; opacity:.6; margin-right:3px; font-weight:700; }
    .events-list { display:flex; flex-direction:column; gap:3px; margin-top:3px; max-height:140px; overflow-y:auto; overflow-x:hidden; padding-right:2px; }
    .events-list::-webkit-scrollbar { width:5px; }
    .events-list::-webkit-scrollbar-thumb { background:#c8d6e8; border-radius:3px; }

    /* Drop targets */
    td.drop-target, .week-col.drop-target, .day-view-list.drop-target, .list-day-body.drop-target { background:#fffbe6 !important; box-shadow:inset 0 0 0 2px #f5a623; }

    /* Legenda */
    .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid #e6edf5; font-size:12.5px; color:#555; }
    .legend .item { display:flex; align-items:center; gap:6px; }
    .legend .dot { width:13px; height:13px; border-radius:3px; border-left:3px solid; }

    /* Modais */
    .modal-overlay { position:fixed; inset:0; background:rgba(22,60,109,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; border-radius:12px; padding:22px; max-width:600px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,.25); max-height:92vh; overflow-y:auto; }
    .modal.large { max-width:900px; }
    .modal h2 { margin:0 0 16px; color:#163c6d; font-size:21px; }
    .modal .field { margin-bottom:12px; }
    .modal label { display:block; font-weight:600; color:#163c6d; font-size:13.5px; margin-bottom:4px; }
    .modal .hint { font-size:11.5px; color:#7a8ba3; margin-top:3px; display:block; }
    .modal input[type=text], .modal input[type=date], .modal input[type=color], .modal textarea, .modal select { width:100%; padding:9px 10px; border:1px solid #d1d8e2; border-radius:6px; font-size:14px; font-family:inherit; color:#333; }
    .modal textarea { resize:vertical; min-height:70px; }
    .modal input:focus, .modal textarea:focus, .modal select:focus { outline:none; border-color:#2b6ca3; box-shadow:0 0 0 3px rgba(43,108,163,.1); }
    .modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
    .modal .actions .left { margin-right:auto; }
    .modal .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:480px) { .modal .row2 { grid-template-columns:1fr; } }

    .events-day-list { margin:12px 0; max-height:340px; overflow-y:auto; }
    .events-day-list .event-row { padding:11px; border-radius:6px; margin-bottom:8px; border-left:4px solid; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .events-day-list .event-row .info { flex:1; min-width:0; }
    .events-day-list .event-row .info .tipo-label { display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; opacity:.75; margin-bottom:3px; letter-spacing:.4px; }
    .events-day-list .event-row .info strong { display:block; margin-bottom:3px; font-size:15px; word-break:break-word; }
    .events-day-list .event-row .info .periodo { font-size:12px; opacity:.8; display:block; margin-bottom:3px; font-style:italic; }
    .events-day-list .event-row .info .desc { font-size:13px; opacity:.85; display:block; word-break:break-word; }
    .events-day-list .event-row .row-actions { display:flex; gap:4px; flex-shrink:0; flex-direction:column; }

    /* Admin */
    .admin-tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:2px solid #e6edf5; }
    .admin-tab { background:none; border:none; padding:10px 16px; font-weight:700; font-size:14px; color:#5a7ba3; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
    .admin-tab.active { color:#163c6d; border-bottom-color:#163c6d; }
    .admin-pane { display:none; }
    .admin-pane.active { display:block; }
    .admin-list { list-style:none; padding:0; margin:0 0 14px; }
    .admin-list li { display:flex; align-items:center; gap:8px; padding:8px 10px; border:1px solid #e6edf5; border-radius:6px; margin-bottom:6px; background:#f8fafc; }
    .admin-list li .item-color { width:22px; height:22px; border-radius:4px; border:1px solid #ccc; flex-shrink:0; }
    .admin-list li .item-label { flex:1; font-weight:600; color:#163c6d; }
    .admin-list li .item-actions { display:flex; gap:4px; }
    .admin-add { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px; background:#f0f4f8; border-radius:6px; }
    .admin-add input[type=text] { flex:1; min-width:140px; padding:8px; border:1px solid #d1d8e2; border-radius:6px; font-size:13px; }
    .admin-add input[type=color] { width:44px; height:36px; padding:2px; cursor:pointer; border:1px solid #d1d8e2; border-radius:6px; }
    .admin-empty { color:#888; font-size:13px; padding:12px; text-align:center; border:1px dashed #dbe0e5; border-radius:6px; margin-bottom:12px; }

    /* Responsivo */
    @media (max-width:900px) {
        body { padding:8px; } .container { padding:14px; border-radius:8px; }
        .toolbar, .filters { padding:8px 10px; gap:6px; }
        .toolbar select, .toolbar .btn, .filters select { font-size:12px; padding:6px 10px; }
        .calendar thead th { font-size:11px; padding:8px 2px; }
        .calendar td { height:140px; padding:4px; }
        .day-number { font-size:13px; line-height:20px; width:20px; }
        .event-chip { font-size:11px; padding:4px 6px; }
        .events-list { max-height:98px; }
        .week-grid { grid-template-columns:repeat(7,minmax(130px,1fr)); overflow-x:auto; }
    }
    @media (max-width:560px) {
        .title-block h1 { font-size:24px; }
        .toolbar .btn { flex:1; justify-content:center; }
        .toolbar .spacer { display:none; }
        .calendar thead th { font-size:10px; padding:6px 1px; }
        .calendar td { height:105px; padding:3px; }
        .event-chip { font-size:9.5px; padding:3px 4px; }
        .events-list { max-height:72px; }
    }
        /* Popup Teletubies */
    .teletubies-overlay {
        position: fixed;
        inset: 0;
        background: rgba(22, 60, 109, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        pointer-events: none;
        animation: fadeInTubies .15s ease-out;
    }
    .teletubies-overlay.active { display: flex; }
    .teletubies-img {
        max-width: 60vw;
        max-height: 60vh;
        filter: drop-shadow(0 10px 30px rgba(0,0,0,.4));
        animation: popTubies .35s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes fadeInTubies {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
    @keyframes popTubies {
        0%   { transform: scale(.5) rotate(-8deg); opacity: 0; }
        60%  { transform: scale(1.08) rotate(3deg); opacity: 1; }
        100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @media (max-width: 560px) {
        .teletubies-img { max-width: 80vw; max-height: 50vh; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <div class="title-block">
            <h1 id="monthTitle">PLANNER</h1>
            <div class="year-row"><span class="line"></span><span id="yearTitle"></span><span class="line"></span></div>
        </div>
        <div class="logo-block">
            <img src="img/mini-me.png" alt="Mini-me" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
            <div id="logoFallback" class="logo-fallback" style="display:none;">FGH</div>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-nav" onclick="navPrev()" title="Anterior">‹</button>
        <select id="selectMes"></select>
        <select id="selectAno"></select>
        <button class="btn btn-nav" onclick="navNext()" title="Próximo">›</button>
        <button class="btn btn-primary" onclick="irHoje()">📅 Hoje</button>
        <button class="btn btn-toggle" data-view="mes" onclick="setView('mes')">Mês</button>
        <button class="btn btn-toggle" data-view="semana" onclick="setView('semana')">Semana</button>
        <button class="btn btn-toggle" data-view="dia" onclick="setView('dia')">Dia</button>
        <button class="btn btn-toggle" data-view="lista" onclick="setView('lista')">Lista</button>
        <span class="spacer"></span>
        <button class="btn btn-secondary" onclick="novoEventoHoje()">➕ Novo</button>
        <button class="btn btn-admin" id="btnAdmin" onclick="abrirAdmin()">🔧 Admin</button>
        <button class="btn btn-success" onclick="salvarTudo()">💾 Salvar</button>
    </div>

    <div class="filters" id="filtersBar">
        <span class="lbl">Filtros:</span>
        <select id="filterTipo" onchange="aplicarFiltros()"></select>
        <select id="filterResp" onchange="aplicarFiltros()"></select>
        <select id="filterArea" onchange="aplicarFiltros()"></select>
        <button class="btn btn-mini" style="background:#f5d99b;color:#7a4b00;" onclick="limparFiltros()">Limpar</button>
        <span class="count" id="filterCount"></span>
    </div>

    <div id="viewContainer"></div>
    <div class="legend" id="legend"></div>
</div>

<!-- Modal do dia -->
<div class="modal-overlay" id="modalDia" onclick="if(event.target===this) fecharModalDia()">
    <div class="modal">
        <h2 id="modalDiaTitulo">Eventos do dia</h2>
        <div class="events-day-list" id="eventsDayList"></div>
        <div class="actions">
            <button class="btn btn-secondary left" onclick="abrirFormEvento()">➕ Adicionar evento neste dia</button>
            <button class="btn btn-primary" onclick="fecharModalDia()">Fechar</button>
        </div>
    </div>
</div>

<!-- Modal do formulário -->
<div class="modal-overlay" id="modalForm" onclick="if(event.target===this) fecharForm()">
    <div class="modal">
        <h2 id="formTituloModal">Novo evento</h2>
        <input type="hidden" id="formId">
        <div class="row2">
            <div class="field"><label>Data de início</label><input type="date" id="formDataInicio"></div>
            <div class="field"><label>Data de término (opcional)</label><input type="date" id="formDataFim"></div>
        </div>
        <div class="field"><label>Título</label><input type="text" id="formTitulo" placeholder="Ex.: Disponibilização da planilha"></div>
        <div class="row2">
            <div class="field"><label>Responsável</label><select id="formResponsavel"></select></div>
            <div class="field"><label>Área</label><select id="formArea"></select></div>
        </div>
        <div class="field"><label>Descrição (opcional)</label><textarea id="formDescricao" placeholder="Detalhes do evento..."></textarea></div>
        <div class="field"><label>Tipo</label><select id="formTipo"></select></div>
        <div class="actions">
            <button class="btn btn-primary" onclick="salvarEvento()">Salvar</button>
            <button class="btn btn-secondary" onclick="fecharForm()">Cancelar</button>
        </div>
    </div>
</div>

<!-- Modal Admin -->
<div class="modal-overlay" id="modalAdmin" onclick="if(event.target===this) fecharAdmin()">
    <div class="modal large">
        <h2>🔧 Painel de Administrador</h2>
        <div class="admin-tabs">
            <button class="admin-tab active" data-pane="tipos" onclick="switchAdminTab('tipos')">Tipos</button>
            <button class="admin-tab" data-pane="responsaveis" onclick="switchAdminTab('responsaveis')">Responsáveis</button>
            <button class="admin-tab" data-pane="areas" onclick="switchAdminTab('areas')">Áreas</button>
        </div>
        <div class="admin-pane active" id="pane-tipos">
            <ul class="admin-list" id="listaTipos"></ul>
            <div class="admin-add">
                <input type="color" id="novoTipoCor" value="#4caf50">
                <input type="text" id="novoTipoLabel" placeholder="Nome do tipo (ex.: Urgente)">
                <button class="btn btn-primary" onclick="addTipo()">Adicionar tipo</button>
            </div>
        </div>
        <div class="admin-pane" id="pane-responsaveis">
            <ul class="admin-list" id="listaResponsaveis"></ul>
            <div class="admin-add">
                <input type="text" id="novoResponsavel" placeholder="Nome do responsável" onkeydown="if(event.key==='Enter') addResponsavel()">
                <button class="btn btn-primary" onclick="addResponsavel()">Adicionar</button>
            </div>
        </div>
        <div class="admin-pane" id="pane-areas">
            <ul class="admin-list" id="listaAreas"></ul>
            <div class="admin-add">
                <input type="text" id="novaArea" placeholder="Nome da área" onkeydown="if(event.key==='Enter') addArea()">
                <button class="btn btn-primary" onclick="addArea()">Adicionar</button>
            </div>
        </div>
        <div class="actions">
            <button class="btn btn-secondary left" onclick="fazerLogout()">Sair</button>
            <button class="btn btn-primary" onclick="fecharAdmin()">Fechar</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   CONFIG
============================================================ */
const GITHUB_OWNER = 'caiomalbuquerque';
const GITHUB_REPO = 'programacao_de_eventos';
const GITHUB_BRANCH = 'main';
const GITHUB_FILE_PATH = 'calendario.json';
const CACHE_KEY = 'planner_fgh';
const CACHE_TIME_KEY = 'planner_fgh_time';
const TOKEN_KEY = 'planner_fgh_token';

/* ============================================================
   HELPERS
============================================================ */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function dateKeyFromDate(dt){ return dateKey(dt.getFullYear(), dt.getMonth(), dt.getDate()); }
function parseDateKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(k){ const [y,m,d]=k.split('-'); return `${Number(d)}/${Number(m)}/${y}`; }
function addDays(key,n){ const d = parseDateKey(key); d.setDate(d.getDate()+n); return dateKeyFromDate(d); }
function daysBetween(a,b){ return Math.round((parseDateKey(b)-parseDateKey(a))/86400000); }
function escapeHtml(t){ if(t==null) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function slug(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* Cores */
function hexToRgb(hex){ const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i); if(!m) return {r:128,g:128,b:128}; return {r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}; }
function mix(a,b,t){ return {r:Math.round(a.r+(b.r-a.r)*t), g:Math.round(a.g+(b.g-a.g)*t), b:Math.round(a.b+(b.b-a.b)*t)}; }
function rgbToHex(c){ return '#'+[c.r,c.g,c.b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function tipoCss(cor){ const base = hexToRgb(cor||'#888'); const bg = rgbToHex(mix(base,{r:255,g:255,b:255},.85)); const txt = rgbToHex(mix(base,{r:0,g:0,b:0},.45)); return `background:${bg};border-left-color:${cor||'#888'};color:${txt};`; }
function getTipo(id){ return (data.config.tipos||[]).find(t=>t.id===id) || {id, label:id||'Sem tipo', cor:'#888'}; }

/* ============================================================
   PERSISTÊNCIA
============================================================ */
async function loadFromGitHub(){
    const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_FILE_PATH}`;
    try { const r = await fetch(url+'?t='+Date.now()); if(!r.ok) throw new Error('nf'); return await r.json(); }
    catch(e){ console.warn('Sem dados remotos:', e); return null; }
}
async function loadData(){
    const raw = localStorage.getItem(CACHE_KEY);
    const t = Number(localStorage.getItem(CACHE_TIME_KEY)||0);
    if(raw && t && (Date.now()-t < CACHE_DURATION)){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    const remote = await loadFromGitHub();
    if(remote){ data = remote; prepararDados(); cacheLocal(); localStorage.setItem(CACHE_TIME_KEY, String(Date.now())); return; }
    if(raw){ try{ data = JSON.parse(raw); prepararDados(); return; }catch(e){} }
    cacheLocal();
}
function prepararDados(){
    if(!data.eventos) data.eventos = [];
    if(!data.config) data.config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    if(!data.config.tipos) data.config.tipos = JSON.parse(JSON.stringify(DEFAULT_CONFIG.tipos));
    if(!data.config.responsaveis) data.config.responsaveis = [];
    if(!data.config.areas) data.config.areas = [];
    data.eventos.forEach(ev=>{
        if(!ev.dataInicio && ev.data){ ev.dataInicio = ev.data; delete ev.data; }
        if(!ev.dataFim) ev.dataFim = ev.dataInicio;
        if(ev.responsavel === undefined) ev.responsavel = '';
        if(ev.area === undefined) ev.area = '';
        if(ev.ordem === undefined) ev.ordem = ev.id*10;
    });
    let max = 0;
    data.eventos.forEach(e=>{ if(e.id > max) max = e.id; });
    nextId = max+1;
}
function cacheLocal(){ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }

/* ============================================================
   SALVAR NO GITHUB
============================================================ */
async function salvarTudo(){
    if(!authToken){ alert('Faça login como admin (🔧 Admin) antes de salvar.'); return; }
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
    let sha;
    try { const r = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}`, {headers:{Authorization:`Bearer ${authToken}`}}); if(r.ok) sha = (await r.json()).sha; } catch(e){}
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = { message:`Atualiza planner - ${new Date().toLocaleString('pt-BR')}`, content, branch:GITHUB_BRANCH };
    if(sha) body.sha = sha;
    try {
        const put = await fetch(apiUrl, { method:'PUT', headers:{Authorization:`Bearer ${authToken}`,'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if(!put.ok) throw new Error((await put.json()).message||'Erro');
        localStorage.setItem(CACHE_TIME_KEY, String(Date.now()));
        cacheLocal();
        alert('✅ Salvo no GitHub com sucesso!');
    } catch(e){ alert('Erro ao salvar: '+e.message); }
}

/* ============================================================
   AUTENTICAÇÃO
============================================================ */
async function validarToken(token){
    try {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {headers:{Authorization:`Bearer ${token}`}});
        if(!r.ok) return false;
        const info = await r.json();
        return info.permissions && info.permissions.push === true;
    } catch(e){ return false; }
}
async function abrirAdmin(){
    if(!authToken){
        const t = prompt('Cole seu token do GitHub (com permissão de escrita neste repositório):');
        if(!t) return;
        const ok = await validarToken(t);
        if(!ok){ alert('Token inválido ou sem permissão de escrita.'); return; }
        authToken = t;
        sessionStorage.setItem(TOKEN_KEY, t);
    }
    renderAdminListas();
    document.getElementById('modalAdmin').classList.add('active');
}
function fecharAdmin(){ document.getElementById('modalAdmin').classList.remove('active'); }
function fazerLogout(){ if(!confirm('Sair do modo admin?')) return; authToken = ''; sessionStorage.removeItem(TOKEN_KEY); fecharAdmin(); }

function addTipo(){
    const label = document.getElementById('novoTipoLabel').value.trim();
    const cor = document.getElementById('novoTipoCor').value;
    if(!label){ alert('Informe o nome do tipo.'); return; }
    let id = slug(label) || ('tipo-'+Date.now());
    if(data.config.tipos.find(t=>t.id===id)) id = id+'-'+Date.now();
    data.config.tipos.push({id,label,cor});
    document.getElementById('novoTipoLabel').value = '';
    cacheLocal(); renderAdminListas(); renderLegend(); popularFiltros();
}
function editarTipoLabel(i,v){ data.config.tipos[i].label = v.trim()||data.config.tipos[i].label; cacheLocal(); renderLegend(); popularFiltros(); }
function editarTipoCor(i,v){ data.config.tipos[i].cor = v; cacheLocal(); renderAdminListas(); renderLegend(); }
function delTipo(i){ const t=data.config.tipos[i]; if(!confirm(`Remover o tipo "${t.label}"?`)) return; data.config.tipos.splice(i,1); cacheLocal(); renderAdminListas(); renderLegend(); popularFiltros(); }
function addResponsavel(){ const v=document.getElementById('novoResponsavel').value.trim(); if(!v) return; if(data.config.responsaveis.includes(v)){alert('Já cadastrado.');return;} data.config.responsaveis.push(v); data.config.responsaveis.sort((a,b)=>a.localeCompare(b)); document.getElementById('novoResponsavel').value=''; cacheLocal(); renderAdminListas(); popularFiltros(); }
function delResponsavel(i){ if(!confirm(`Remover "${data.config.responsaveis[i]}"?`)) return; data.config.responsaveis.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); }
function addArea(){ const v=document.getElementById('novaArea').value.trim(); if(!v) return; if(data.config.areas.includes(v)){alert('Já cadastrada.');return;} data.config.areas.push(v); data.config.areas.sort((a,b)=>a.localeCompare(b)); document.getElementById('novaArea').value=''; cacheLocal(); renderAdminListas(); popularFiltros(); }
function delArea(i){ if(!confirm(`Remover "${data.config.areas[i]}"?`)) return; data.config.areas.splice(i,1); cacheLocal(); renderAdminListas(); popularFiltros(); }

function popularFiltros(){
    const ft = document.getElementById('filterTipo');
    const fr = document.getElementById('filterResp');
    const fa = document.getElementById('filterArea');
    ft.innerHTML = '<option value="">Tipo: todos</option>' + (data.config.tipos||[]).map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.label)}</option>`).join('');
    fr.innerHTML = '<option value="">Responsável: todos</option>' + (data.config.responsaveis||[]).map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
    fa.innerHTML = '<option value="">Área: todas</option>' + (data.config.areas||[]).map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
    ft.value = filtros.tipo; fr.value = filtros.responsavel; fa.value = filtros.area;
}
function aplicarFiltros(){
    filtros.tipo = document.getElementById('filterTipo').value;
    filtros.responsavel = document.getElementById('filterResp').value;
    filtros.area = document.getElementById('filterArea').value;
    render();
}
function limparFiltros(){ filtros = {tipo:'',responsavel:'',area:''}; popularFiltros(); render(); }
function passaFiltro(ev){
    if(filtros.tipo && ev.tipo !== filtros.tipo) return false;
    if(filtros.responsavel && ev.responsavel !== filtros.responsavel) return false;
    if(filtros.area && ev.area !== filtros.area) return false;
    return true;
}
function temFiltroAtivo(){ return filtros.tipo || filtros.responsavel || filtros.area; }

/* ============================================================
   NAVEGAÇÃO (CORRIGIDA — sem transbordar o mês)
============================================================ */
function navPrev(){
    const y = currentDate.getFullYear(), m = currentDate.getMonth(), d = currentDate.getDate();
    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m-1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d-7);
    else currentDate = new Date(y, m, d-1);
    sincronizarSelects(); render();
}
function navNext(){
    const y = currentDate.getFullYear(), m = currentDate.getMonth(), d = currentDate.getDate();
    if(view === 'mes' || view === 'lista') currentDate = new Date(y, m+1, 1);
    else if(view === 'semana') currentDate = new Date(y, m, d+7);
    else currentDate = new Date(y, m, d+1);
    sincronizarSelects(); render();
}
function irHoje(){ currentDate = new Date(); sincronizarSelects(); render(); }

function sincronizarSelects(){
    document.getElementById('selectMes').value = currentDate.getMonth();
    document.getElementById('selectAno').value = currentDate.getFullYear();
}
function initSelects(){
    const sm = document.getElementById('selectMes');
    const sa = document.getElementById('selectAno');
    sm.innerHTML = MESES_CURTOS.map((m,i)=>`<option value="${i}">${m}</option>`).join('');
    const y = new Date().getFullYear();
    const anos = []; for(let i=y-3;i<=y+5;i++) anos.push(i);
    sa.innerHTML = anos.map(a=>`<option value="${a}">${a}</option>`).join('');
    // CORREÇÃO: usar new Date(y, m, 1) para nunca transbordar
    sm.addEventListener('change', ()=>{ currentDate = new Date(currentDate.getFullYear(), Number(sm.value), 1); render(); });
    sa.addEventListener('change', ()=>{ currentDate = new Date(Number(sa.value), currentDate.getMonth(), 1); render(); });
}
function setView(v){ view = v; localStorage.setItem(VIEW_KEY, v); render(); }

/* ============================================================
   MAPA DE EVENTOS
============================================================ */
function construirMapa(){
    const mapa = {};
    const evs = data.eventos
        .filter(passaFiltro)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);
    evs.forEach(ev=>{
        const ini = ev.dataInicio, fim = ev.dataFim||ini;
        if(!ini||!fim) return;
        let cur = ini;
        while(cur <= fim){
            if(!mapa[cur]) mapa[cur] = [];
            const position = ini===fim ? 'single' : (cur===ini ? 'start' : (cur===fim ? 'end' : 'middle'));
            mapa[cur].push({ev, position});
            cur = addDays(cur, 1);
        }
    });
    return mapa;
}

/* ============================================================
   RENDER PRINCIPAL
============================================================ */
function render(){
    document.querySelectorAll('.btn-toggle').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    atualizarTitulo();
    const c = document.getElementById('viewContainer');
    if(view === 'mes') c.innerHTML = renderMes();
    else if(view === 'semana') c.innerHTML = renderSemana();
    else if(view === 'dia') c.innerHTML = renderDia();
    else c.innerHTML = renderLista();
    renderLegend();
    atualizarContadorFiltro();
}

function atualizarContadorFiltro(){
    const el = document.getElementById('filterCount');
    if(!temFiltroAtivo()){ el.textContent = ''; return; }
    const total = data.eventos.length;
    const visiveis = data.eventos.filter(passaFiltro).length;
    el.textContent = `${visiveis} de ${total} eventos`;
}

function atualizarTitulo(){
    const mt = document.getElementById('monthTitle');
    const yt = document.getElementById('yearTitle');
    if(view === 'dia'){
        const d = currentDate;
        mt.textContent = DIAS_SEMANA_LONGO[d.getDay()].toUpperCase();
        yt.textContent = `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
    } else if(view === 'semana'){
        const ini = new Date(currentDate); ini.setDate(currentDate.getDate() - currentDate.getDay());
        const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
        mt.textContent = 'SEMANA';
        yt.textContent = `${ini.getDate()}/${ini.getMonth()+1} a ${fim.getDate()}/${fim.getMonth()+1} de ${fim.getFullYear()}`;
    } else {
        mt.textContent = MESES[currentDate.getMonth()];
        yt.textContent = currentDate.getFullYear();
    }
}

/* ============================================================
   DRAG STATE (único, centralizado)
============================================================ */
let dragState = { eventId: null, sourceDay: null };

/* ============================================================
   RENDER — MÊS
============================================================ */
function renderMes(){
    const ano = currentDate.getFullYear(), mes = currentDate.getMonth();
    const primeiro = new Date(ano, mes, 1);
    const diaSemanaIni = primeiro.getDay();
    const ultimoDia = new Date(ano, mes+1, 0).getDate();
    const ultimoAnt = new Date(ano, mes, 0).getDate();
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '<table class="calendar"><thead><tr>';
    ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].forEach((d,i)=>{ html += `<th class="${(i===0||i===6)?'weekend':''}">${d}</th>`; });
    html += '</tr></thead><tbody>';

    const total = Math.ceil((diaSemanaIni + ultimoDia)/7)*7;
    for(let i=0;i<total;i++){
        if(i%7===0) html += '<tr>';
        const dia = i - diaSemanaIni + 1;
        let cy=ano, cm=mes, cd, other=false;
        if(dia<1){ other=true; cm=mes-1; cy=ano; if(cm<0){cm=11;cy--;} cd=ultimoAnt+dia; }
        else if(dia>ultimoDia){ other=true; cm=mes+1; cy=ano; if(cm>11){cm=0;cy++;} cd=dia-ultimoDia; }
        else cd = dia;

        const key = dateKey(cy, cm, cd);
        const evs = (!other && mapa[key]) ? mapa[key] : [];
        const wknd = (i%7===0||i%7===6);
        const hj = key === hojeKey;

        let cls = ''; if(other) cls += ' other-month'; if(wknd) cls += ' weekend';

        // Zona de drop: apenas a td (não o chip)
        html += `<td class="${cls}" data-day="${key}" ${other?'':'onclick="cellClick(event, \''+key+'\')"'} ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        if(!other){
            html += `<span class="day-number ${hj?'hoje':''}">${cd}</span>`;
            if(evs.length > 0){
                html += `<span class="day-badge">${evs.length}</span><div class="events-list">`;
                evs.slice(0,8).forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
                if(evs.length>8) html += `<div style="font-size:10.5px;text-align:center;color:#163c6d;font-weight:600;">+${evs.length-8} mais</div>`;
                html += '</div>';
            }
        } else {
            html += `<span class="day-number" style="color:#c5cdd6">${cd}</span>`;
        }
        html += '</td>';
        if(i%7===6) html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
}

/* ============================================================
   RENDER — SEMANA
============================================================ */
function renderSemana(){
    const ini = new Date(currentDate);
    ini.setDate(currentDate.getDate() - currentDate.getDay());
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '<div class="week-grid">';
    for(let i=0;i<7;i++){
        const d = new Date(ini); d.setDate(ini.getDate()+i);
        const key = dateKeyFromDate(d);
        const evs = mapa[key] || [];
        const hj = key === hojeKey;
        const wknd = (i===0||i===6);
        html += `<div class="week-col ${wknd?'weekend':''}" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
        html += `<div class="week-col-header ${hj?'hoje':''}">
                    <span style="font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;">${DIAS_SEMANA_CURTO[i]}</span>
                    <span class="wk-day">${d.getDate()}</span>
                 </div>`;
        evs.forEach(({ev, position})=>{ html += renderChip(ev, position, key); });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

/* ============================================================
   RENDER — DIA
============================================================ */
function renderDia(){
    const key = dateKeyFromDate(currentDate);
    const mapa = construirMapa();
    const evs = mapa[key] || [];
    const dt = currentDate;
    const hj = key === dateKeyFromDate(new Date());

    let html = '<div class="day-view">';
    html += `<div class="day-view-header">
                <div>
                    <h2>${dt.getDate()} de ${MESES[dt.getMonth()]} de ${dt.getFullYear()}</h2>
                    <div class="sub">${DIAS_SEMANA_LONGO[dt.getDay()]} ${hj?'• HOJE':''}</div>
                </div>
                <div><button class="btn btn-secondary" onclick="abrirFormEvento()">➕ Novo evento</button></div>
             </div>`;
    html += `<div class="day-view-list" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">`;
    evs.forEach(({ev, position})=>{ html += renderDayCard(ev, position, key); });
    html += '</div></div>';
    return html;
}

function renderDayCard(ev, position, dayKey){
    const t = getTipo(ev.tipo);
    const isMulti = ev.dataInicio !== ev.dataFim;
    const isCont = isMulti && position !== 'start' && position !== 'single';
    const resp = ev.responsavel ? `<span class="chip-resp">@${escapeHtml(ev.responsavel)}</span>` : '';
    const area = ev.area ? `<span class="chip-area">${escapeHtml(ev.area)}</span>` : '';
    const periodo = isMulti ? `<div class="dc-meta">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</div>` : '';
    const desc = ev.descricao ? `<div class="dc-desc">${escapeHtml(ev.descricao)}</div>` : '';

    return `<div class="day-card" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"
                 ondragstart="onChipDragStart(event, ${ev.id}, '${dayKey}')"
                 ondragend="onChipDragEnd(event)"
                 onclick="abrirFormEvento(${ev.id})">
                <div class="dc-header">
                    <div class="dc-title">${isCont?'<span class="continuation-mark">↳</span>':''}${resp}${area}${escapeHtml(ev.titulo)}</div>
                    <div class="dc-actions">
                        <button class="btn-mini edit" onclick="event.stopPropagation(); abrirFormEvento(${ev.id})" title="Editar">✎</button>
                        <button class="btn-mini dup" onclick="event.stopPropagation(); duplicarEvento(${ev.id})" title="Duplicar">⎘</button>
                        <button class="btn-mini del" onclick="event.stopPropagation(); excluirEvento(${ev.id})" title="Excluir">✕</button>
                    </div>
                </div>
                ${periodo}
                ${desc}
                <div class="dc-meta"><span style="opacity:.7;font-weight:700;text-transform:uppercase;font-size:11px;">${escapeHtml(t.label)}</span></div>
            </div>`;
}

/* ============================================================
   RENDER — LISTA
============================================================ */
function renderLista(){
    const ano = currentDate.getFullYear(), mes = currentDate.getMonth();
    const ultimo = new Date(ano, mes+1, 0).getDate();
    const hojeKey = dateKeyFromDate(new Date());
    const mapa = construirMapa();

    let html = '', count = 0;
    for(let d=1; d<=ultimo; d++){
        const key = dateKey(ano, mes, d);
        const evs = mapa[key] || [];
        if(evs.length === 0) continue;
        count += evs.length;
        const dt = new Date(ano, mes, d);
        const hj = key === hojeKey;
        html += `<div class="list-day">
                    <div class="list-day-header ${hj?'hoje':''}">
                        <span>${d} de ${MESES[mes]} ${hj?'• HOJE':''}</span>
                        <span class="weekday">${DIAS_SEMANA_LONGO[dt.getDay()]}</span>
                    </div>
                    <div class="list-day-body" data-day="${key}" ondragover="onDayDragOver(event, this)" ondragleave="onDayDragLeave(event, this)" ondrop="onDayDrop(event, this)">
                        ${evs.map(({ev, position})=>renderChip(ev, position, key, true)).join('')}
                    </div>
                 </div>`;
    }
    if(count === 0) html = `<p style="text-align:center;color:#888;padding:40px 20px;font-size:14px;">${temFiltroAtivo()?'Nenhum evento corresponde aos filtros.':'Nenhum evento neste mês.'}</p>`;
    return html;
}

/* ============================================================
   CHIP
============================================================ */
function renderChip(ev, position, dayKey, expandido){
    const t = getTipo(ev.tipo);
    const isMulti = ev.dataInicio !== ev.dataFim;
    const isCont = isMulti && position !== 'start' && position !== 'single';
    const resp = ev.responsavel ? `<span class="chip-resp">@${escapeHtml(ev.responsavel)}</span>` : '';
    const area = ev.area ? `<span class="chip-area">${escapeHtml(ev.area)}</span>` : '';
    const cont = isCont ? '<span class="continuation-mark">↳</span>' : '';
    const periodo = (expandido && isMulti) ? `<div style="font-size:11.5px;opacity:.75;margin-top:3px;font-style:italic;">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</div>` : '';
    const desc = (expandido && ev.descricao) ? `<div style="font-size:12.5px;opacity:.85;margin-top:3px;">${escapeHtml(ev.descricao)}</div>` : '';
    const tipoLabel = expandido ? `<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;opacity:.7;margin-top:3px;">${escapeHtml(t.label)}</div>` : '';
    const tooltip = [ev.responsavel?'Resp: '+ev.responsavel:'', ev.area?'Área: '+ev.area:'', ev.titulo, isMulti?`${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}`:'', ev.descricao||''].filter(Boolean).join(' • ');

    return `<div class="event-chip" style="${tipoCss(t.cor)}" draggable="true"
                 data-event-id="${ev.id}" data-day="${dayKey}"
                 title="${escapeHtml(tooltip)}"
                 ondragstart="onChipDragStart(event, ${ev.id}, '${dayKey}')"
                 ondragend="onChipDragEnd(event)"
                 onclick="event.stopPropagation(); abrirFormEvento(${ev.id})">
                ${cont}${resp}${area}<span class="chip-title">${escapeHtml(ev.titulo)}</span>
                ${periodo}${desc}${tipoLabel}
            </div>`;
}

/* ============================================================
   LEGENDA
============================================================ */
function renderLegend(){
    const l = document.getElementById('legend');
    l.innerHTML = (data.config.tipos||[]).map(t=>`
        <div class="item">
            <div class="dot" style="background:${rgbToHex(mix(hexToRgb(t.cor),{r:255,g:255,b:255},.85))};border-left-color:${escapeHtml(t.cor)}"></div>
            ${escapeHtml(t.label)}
        </div>`).join('');
}

/* ============================================================
   DRAG & DROP (REESCRITO)
   - Só a célula do dia é zona de drop.
   - O chip apenas inicia o drag (não aceita drop).
   - Decide entre mover e reordenar pela posição do cursor.
============================================================ */
function onChipDragStart(e, id, dayKey){
    dragState.eventId = id;
    dragState.sourceDay = dayKey;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(id));
    e.currentTarget.classList.add('dragging');
    // NÃO faz stopPropagation aqui, pois o dragstart precisa borbulhar normalmente
}
function onChipDragEnd(e){
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
    dragState.eventId = null;
    dragState.sourceDay = null;
}

function onDayDragOver(e, el){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-target');
}
function onDayDragLeave(e, el){
    if(!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
}

function onDayDrop(e, el){
    e.preventDefault();
    e.stopPropagation(); // impede que um container pai também trate
    el.classList.remove('drop-target');

    // Recupera id do evento: prioriza o dragState global
    let srcId = dragState.eventId;
    if(!srcId){
        const raw = e.dataTransfer.getData('text/plain');
        srcId = raw ? Number(raw) : null;
    }
    if(!srcId) return;

    const dayKey = el.dataset.day;
    if(!dayKey) return;

    const ev = data.eventos.find(x=>x.id === srcId);
    if(!ev) return;

    // 1) Mover para o novo dia (se o dia não estiver dentro do período atual)
    const jaEstaNoDia = ev.dataInicio <= dayKey && dayKey <= ev.dataFim;
    if(!jaEstaNoDia){
        const diff = daysBetween(ev.dataInicio, dayKey);
        ev.dataInicio = addDays(ev.dataInicio, diff);
        ev.dataFim = addDays(ev.dataFim, diff);
    }

    // 2) Reordenar com base na posição Y do cursor em relação aos chips existentes
    const chips = Array.from(el.querySelectorAll('.event-chip')).filter(c => Number(c.dataset.eventId) !== srcId);
    const mouseY = e.clientY;
    let insertBeforeIdx = chips.length;
    for(let i=0;i<chips.length;i++){
        const rect = chips[i].getBoundingClientRect();
        if(mouseY < rect.top + rect.height/2){ insertBeforeIdx = i; break; }
    }

    // Pega eventos do dia-alvo (excluindo o movido), já na ordem atual
    const diaEvs = data.eventos
        .filter(x => x.id !== srcId && x.dataInicio <= dayKey && dayKey <= x.dataFim)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);

    diaEvs.splice(insertBeforeIdx, 0, ev);
    diaEvs.forEach((x,i)=>{ x.ordem = (i+1)*10; });

    dragState.eventId = null;
    dragState.sourceDay = null;
    cacheLocal();
    render();
}

/* ============================================================
   CLIQUE EM CÉLULA
============================================================ */
function cellClick(e, key){
    if(e.target.closest('.event-chip')) return;
    abrirModalDia(key);
}

/* ============================================================
   MODAL DO DIA
============================================================ */
function abrirModalDia(key){
    if(!key) key = dateKeyFromDate(currentDate);
    diaSelecionado = key;
    const [y,m,d] = key.split('-');
    document.getElementById('modalDiaTitulo').textContent = `${Number(d)} de ${MESES[Number(m)-1]} de ${y}`;
    renderListaDia();
    document.getElementById('modalDia').classList.add('active');
}
function renderListaDia(){
    const evs = data.eventos
        .filter(ev => ev.dataInicio <= diaSelecionado && diaSelecionado <= ev.dataFim)
        .filter(passaFiltro)
        .sort((a,b)=>(a.ordem||0)-(b.ordem||0) || a.id-b.id);

    const c = document.getElementById('eventsDayList');
    if(evs.length === 0){ c.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Nenhum evento neste dia.</p>'; return; }
    c.innerHTML = evs.map(ev => {
        const t = getTipo(ev.tipo);
        const periodo = ev.dataInicio !== ev.dataFim ? `<span class="periodo">📅 ${fmtBR(ev.dataInicio)} → ${fmtBR(ev.dataFim)}</span>` : '';
        const resp = ev.responsavel ? `<span class="chip-resp">@${escapeHtml(ev.responsavel)}</span>` : '';
        const area = ev.area ? `<span class="chip-area">${escapeHtml(ev.area)}</span>` : '';
        return `<div class="event-row" style="${tipoCss(t.cor)}">
                    <div class="info">
                        <span class="tipo-label">${escapeHtml(t.label)}</span> ${resp} ${area}
                        <strong>${escapeHtml(ev.titulo)}</strong>
                        ${periodo}
                        ${ev.descricao ? `<span class="desc">${escapeHtml(ev.descricao)}</span>` : ''}
                    </div>
                    <div class="row-actions">
                        <button class="btn-mini edit" onclick="abrirFormEvento(${ev.id})">Editar</button>
                        <button class="btn-mini dup" onclick="duplicarEvento(${ev.id})">Duplicar</button>
                        <button class="btn-mini del" onclick="excluirEvento(${ev.id})">Excluir</button>
                    </div>
                </div>`;
    }).join('');
}
function fecharModalDia(){ document.getElementById('modalDia').classList.remove('active'); }

/* ============================================================
   FORMULÁRIO DE EVENTO
============================================================ */
function novoEventoHoje(){ diaSelecionado = dateKeyFromDate(currentDate); abrirFormEvento(); }

function abrirFormEvento(id){
    fecharModalDia();
    const ev = id ? data.eventos.find(e=>e.id===id) : null;
    if(!ev && !diaSelecionado) diaSelecionado = dateKeyFromDate(new Date());

    document.getElementById('formTituloModal').textContent = ev ? 'Editar evento' : 'Novo evento';
    document.getElementById('formId').value = ev ? ev.id : '';
    document.getElementById('formDataInicio').value = ev ? ev.dataInicio : diaSelecionado;
    document.getElementById('formDataFim').value = ev ? (ev.dataFim !== ev.dataInicio ? ev.dataFim : '') : '';
    document.getElementById('formTitulo').value = ev ? ev.titulo : '';
    document.getElementById('formDescricao').value = ev ? (ev.descricao||'') : '';

    preencherSelect('formResponsavel', data.config.responsaveis, ev ? ev.responsavel : '');
    preencherSelect('formArea', data.config.areas, ev ? ev.area : '');
    preencherSelect('formTipo', data.config.tipos.map(t=>({value:t.id,label:t.label})), ev ? ev.tipo : (data.config.tipos[0]?data.config.tipos[0].id:''));

    document.getElementById('modalForm').classList.add('active');
    setTimeout(()=>document.getElementById('formTitulo').focus(), 100);
}
function preencherSelect(id, opcoes, valorAtual){
    const sel = document.getElementById(id);
    const normalizadas = opcoes.map(o => (typeof o === 'string' ? {value:o,label:o} : o));
    let html = '<option value="">— Nenhum —</option>';
    html += normalizadas.map(o => `<option value="${escapeHtml(o.value)}" ${o.value===valorAtual?'selected':''}>${escapeHtml(o.label)}</option>`).join('');
    if(valorAtual && !normalizadas.find(o=>o.value===valorAtual)){
        html += `<option value="${escapeHtml(valorAtual)}" selected>${escapeHtml(valorAtual)} (removido)</option>`;
    }
    sel.innerHTML = html;
}
function fecharForm(){ document.getElementById('modalForm').classList.remove('active'); }

function mostrarTeletubies(){
    const el = document.getElementById('teletubiesOverlay');
    if(!el) return;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 1000);
}

function salvarEvento(){
    const dataInicio = document.getElementById('formDataInicio').value;
    const dataFimRaw = document.getElementById('formDataFim').value;
    const titulo = document.getElementById('formTitulo').value.trim();
    const responsavel = document.getElementById('formResponsavel').value;
    const area = document.getElementById('formArea').value;
    const descricao = document.getElementById('formDescricao').value.trim();
    const tipo = document.getElementById('formTipo').value;
    const id = document.getElementById('formId').value;

    if(!dataInicio){ alert('Informe a data de início.'); return; }
    if(!titulo){ alert('Informe o título.'); return; }
    const dataFim = dataFimRaw && dataFimRaw >= dataInicio ? dataFimRaw : dataInicio;

    if(id){
        const ev = data.eventos.find(e=>e.id===Number(id));
        if(ev){
            ev.dataInicio = dataInicio; ev.dataFim = dataFim;
            ev.titulo = titulo; ev.responsavel = responsavel;
            ev.area = area; ev.descricao = descricao; ev.tipo = tipo;
        }
    } else {
        data.eventos.push({ id: nextId++, dataInicio, dataFim, titulo, responsavel, area, descricao, tipo, ordem: nextId*10 });
        mostrarTeletubies();   // 🎉 só na criação de um novo evento
    }
    cacheLocal(); fecharForm(); diaSelecionado = dataInicio; render(); abrirModalDia(dataInicio);
}
function duplicarEvento(id){
    const ev = data.eventos.find(e=>e.id===id); if(!ev) return;
    const novo = JSON.parse(JSON.stringify(ev));
    novo.id = nextId++; novo.ordem = nextId*10; novo.titulo = ev.titulo + ' (cópia)';
    data.eventos.push(novo);
    cacheLocal(); render(); renderListaDia();
}
function excluirEvento(id){
    if(!confirm('Excluir este evento?')) return;
    data.eventos = data.eventos.filter(e=>e.id!==id);
    cacheLocal(); renderListaDia(); render();
}

/* ============================================================
   INICIALIZAÇÃO
============================================================ */
document.addEventListener('DOMContentLoaded', async ()=>{
    await loadData();
    const pref = localStorage.getItem(VIEW_KEY);
    if(pref) view = pref;
    else if(window.innerWidth < 560) view = 'lista';
    initSelects();
    sincronizarSelects();
    popularFiltros();
    render();

    document.addEventListener('keydown', e=>{
        if(e.key === 'Escape'){ fecharForm(); fecharModalDia(); fecharAdmin(); }
    });
});
</script>
